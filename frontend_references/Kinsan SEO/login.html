<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — Kinsan SEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,300,0,0" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:        #0A2B41;
  --primary-hover:  #2E4A5E;
  --primary-light:  #E7EAEC;
  --accent:         #FDB338;
  --info:           #1677FF;
  --info-light:     #E6F4FF;
  --success:        #52C41A;
  --error:          #F5222D;
  --error-light:    #FFF1F0;
  --error-border:   #FFA39E;
  --text-primary:   #1F1F1F;
  --text-secondary: #595959;
  --text-desc:      #8C8C8C;
  --text-disabled:  #BFBFBF;
  --surface:        #FFFFFF;
  --surface-2:      #FAFAFA;
  --border:         #D9D9D9;
  --border-subtle:  #F0F0F0;
}

body {
  font-family: 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
  background: var(--surface);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
}

/* ── Two-column shell ── */
.shell {
  display: flex;
  width: 100%;
  min-height: 100vh;
}

/* ── Left: Illustration panel ── */
.panel-left {
  flex: 1;
  position: relative;
  overflow: hidden;
  background: #1A2E3A;
  min-height: 100vh;
}
.panel-left img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
  opacity: 0.92;
}
/* gradient overlay fading to white at right edge for smooth blend */
.panel-left::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to right,
    rgba(0,0,0,0) 60%,
    rgba(255,255,255,0.18) 85%,
    rgba(255,255,255,0.72) 100%
  );
  pointer-events: none;
}

/* branding watermark bottom-left */
.panel-brand {
  position: absolute;
  bottom: 32px;
  left: 32px;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.panel-brand-name {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  letter-spacing: -0.02em;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
}
.panel-brand-tagline {
  font-size: 13px;
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 6px rgba(0,0,0,0.25);
}

/* ── Right: Form panel ── */
.panel-right {
  width: 480px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 40px;
  background: var(--surface);
  position: relative;
  box-shadow: -2px 0 32px rgba(0,0,0,0.06);
}

.form-wrap {
  width: 100%;
  max-width: 360px;
}

/* ── Logo ── */
.form-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.form-logo-mark {
  width: 36px; height: 36px;
  border-radius: 9px;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.form-logo-mark svg { width: 18px; height: 18px; fill: var(--accent); }
.form-logo-name {
  font-size: 18px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.02em;
  line-height: 1;
}
.form-logo-sub {
  font-size: 12px;
  color: var(--text-desc);
  margin-top: 2px;
}

/* ── Heading ── */
.form-heading {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.form-subheading {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 28px;
  line-height: 1.5;
}

/* ── Google button ── */
.btn-google {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  font-size: 14px;
  font-weight: 500;
  color: var(--text-primary);
  cursor: pointer;
  transition: background 150ms, border-color 150ms, box-shadow 150ms;
  font-family: inherit;
}
.btn-google:hover {
  background: var(--surface-2);
  border-color: var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.btn-google:active { background: #F5F5F5; }
.google-icon { width: 18px; height: 18px; flex-shrink: 0; }

/* ── Divider ── */
.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 20px 0;
}
.divider-line {
  flex: 1;
  height: 1px;
  background: var(--border-subtle);
}
.divider-text {
  font-size: 12px;
  color: var(--text-desc);
  flex-shrink: 0;
}

/* ── Form fields ── */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}
.field:last-of-type { margin-bottom: 0; }

.field-label {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
}

.field-wrap {
  position: relative;
}

.field-input {
  width: 100%;
  height: 44px;
  padding: 0 44px 0 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--surface);
  outline: none;
  transition: border-color 150ms, box-shadow 150ms;
  -webkit-appearance: none;
}
.field-input::placeholder { color: var(--text-disabled); }
.field-input:hover { border-color: var(--border); }
.field-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(10,43,65,0.08);
}
.field-input.has-error {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(245,34,45,0.08);
}

.field-icon {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-desc);
  display: flex;
  align-items: center;
  cursor: pointer;
  font-family: 'Material Symbols Rounded';
  font-size: 18px;
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
  user-select: none;
  transition: color 150ms;
}
.field-icon:hover { color: var(--text-secondary); }

.field-error {
  font-size: 12px;
  color: var(--error);
  display: flex;
  align-items: center;
  gap: 4px;
}
.field-error .ms {
  font-family: 'Material Symbols Rounded';
  font-size: 14px;
  font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
}

/* ── Options row ── */
.options-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 16px 0 20px;
}

/* remember me checkbox */
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.remember-box {
  width: 16px; height: 16px;
  border: 1.5px solid var(--border);
  border-radius: 4px;
  background: var(--surface);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: all 150ms;
}
.remember-box.checked {
  background: var(--primary);
  border-color: var(--primary);
}
.remember-box.checked::after {
  content: '';
  width: 9px; height: 6px;
  border-left: 1.5px solid #fff;
  border-bottom: 1.5px solid #fff;
  transform: rotate(-45deg) translateY(-1px);
  display: block;
}
.remember-label {
  font-size: 13px;
  color: var(--text-secondary);
}

/* forgot link */
.forgot-link {
  font-size: 13px;
  font-weight: 500;
  color: var(--info);
  text-decoration: none;
  transition: color 150ms;
}
.forgot-link:hover { color: #0958D9; text-decoration: underline; }

/* ── Primary button ── */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  height: 44px;
  background: var(--primary);
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  cursor: pointer;
  transition: background 150ms, box-shadow 150ms;
  font-family: inherit;
  letter-spacing: 0.01em;
}
.btn-primary:hover {
  background: var(--primary-hover);
  box-shadow: 0 4px 12px rgba(10,43,65,0.2);
}
.btn-primary:active { background: #061A28; }
.btn-primary:focus-visible {
  outline: none;
  box-shadow: 0 0 0 3px rgba(10,43,65,0.2);
}
.btn-primary.loading { opacity: 0.8; cursor: not-allowed; }

/* ── Sign-up nudge ── */
.signup-row {
  text-align: center;
  margin-top: 24px;
  font-size: 13px;
  color: var(--text-secondary);
}
.signup-link {
  color: var(--primary);
  font-weight: 500;
  text-decoration: none;
  margin-left: 4px;
}
.signup-link:hover { text-decoration: underline; }

/* ── System status ── */
.status-row {
  position: absolute;
  bottom: 24px;
  left: 0; right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-desc);
}
.status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--success);
  flex-shrink: 0;
  box-shadow: 0 0 0 2px rgba(82,196,26,0.2);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 2px rgba(82,196,26,0.2); }
  50%       { box-shadow: 0 0 0 4px rgba(82,196,26,0.12); }
}

/* ── Loading dots (for btn) ── */
.dot-pulse {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}
.dot-pulse span {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.8);
  animation: dotAnim 1.2s ease-in-out infinite;
}
.dot-pulse span:nth-child(2) { animation-delay: .15s; }
.dot-pulse span:nth-child(3) { animation-delay: .30s; }
@keyframes dotAnim {
  0%,80%,100%{opacity:.3;transform:scale(.7)}
  40%{opacity:1;transform:scale(1)}
}

/* ── Responsive ── */
@media (max-width: 860px) {
  .panel-left { display: none; }
  .panel-right { width: 100%; box-shadow: none; }
}
@media (max-width: 480px) {
  .panel-right { padding: 32px 24px; }
}
</style>
</head>
<body>

<div class="shell">

  <!-- LEFT: Illustration -->
  <div class="panel-left">
    <img src="images/login_background.png" 
      onerror="this.closest('.panel-left').style.background='linear-gradient(135deg,#0A2B41 0%,#2E4A5E 50%,#4D6577 100%)'"/>

    <div class="panel-brand">
      <div class="panel-brand-name">Kinsan SEO</div>
      <div class="panel-brand-tagline">智能文案管理，讓內容更有力量</div>
    </div>
  </div>

  <!-- RIGHT: Login form -->
  <div class="panel-right">
    <div class="form-wrap">

      <!-- Logo -->
      <div class="form-logo">
        <div class="form-logo-mark">
          <svg viewBox="0 0 20 20">
            <path d="M10 2L3 6.5v4l7 3.5 7-3.5v-4L10 2z"/>
            <path d="M3 10.5v4L10 18l7-3.5v-4l-7 3.5-7-3.5z" opacity="0.6"/>
          </svg>
        </div>
        <div>
          <div class="form-logo-name">Kinsan SEO</div>
          <div class="form-logo-sub">文案管理系統</div>
        </div>
      </div>

      <!-- Heading -->
      <div class="form-heading">歡迎回來</div>
      <div class="form-subheading">登入以繼續使用您的工作區</div>

      <!-- Google OAuth -->
      <button class="btn-google" onclick="handleGoogle()">
        <svg class="google-icon" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        使用 Google 帳號登入
      </button>

      <!-- Divider -->
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">或使用帳號密碼</span>
        <div class="divider-line"></div>
      </div>

      <!-- Form -->
      <form onsubmit="handleSubmit(event)" novalidate>

        <!-- Email -->
        <div class="field" id="field-email">
          <label class="field-label" for="email">信箱</label>
          <div class="field-wrap">
            <input class="field-input" type="email" id="email" name="email"
              placeholder="your@email.com" autocomplete="email"
              oninput="clearError('field-email')" />
            <span class="field-icon">mail</span>
          </div>
          <div class="field-error" id="error-email" style="display:none">
            <span class="ms">error</span>
            <span id="error-email-text"></span>
          </div>
        </div>

        <!-- Password -->
        <div class="field" id="field-password">
          <label class="field-label" for="password">密碼</label>
          <div class="field-wrap">
            <input class="field-input" type="password" id="password" name="password"
              placeholder="輸入密碼" autocomplete="current-password"
              oninput="clearError('field-password')" />
            <span class="field-icon" id="toggle-pw" onclick="togglePassword()" title="顯示/隱藏密碼">visibility</span>
          </div>
          <div class="field-error" id="error-password" style="display:none">
            <span class="ms">error</span>
            <span id="error-password-text"></span>
          </div>
        </div>

        <!-- Options -->
        <div class="options-row">
          <div class="remember" onclick="toggleRemember()">
            <div class="remember-box" id="remember-box"></div>
            <span class="remember-label">記住我</span>
          </div>
          <a href="#" class="forgot-link">忘記密碼？</a>
        </div>

        <!-- Submit -->
        <button class="btn-primary" type="submit" id="btn-submit">
          <span id="btn-label">登入</span>
        </button>

      </form>

      <!-- Sign-up nudge -->
      <div class="signup-row">
        還沒有帳號？
        <a href="#" class="signup-link">申請試用</a>
      </div>

    </div>

    <!-- System status -->
    <div class="status-row">
      <div class="status-dot"></div>
      <span>系統狀態：正常</span>
      <span style="color:#BFBFBF">·</span>
      <span>v2.1.0</span>
    </div>

  </div>
</div>

<script>
  // ── Remember me ──
  let remembered = false;
  function toggleRemember() {
    remembered = !remembered;
    const box = document.getElementById('remember-box');
    box.classList.toggle('checked', remembered);
  }

  // ── Toggle password visibility ──
  let pwVisible = false;
  function togglePassword() {
    pwVisible = !pwVisible;
    const inp = document.getElementById('password');
    const icon = document.getElementById('toggle-pw');
    inp.type = pwVisible ? 'text' : 'password';
    icon.textContent = pwVisible ? 'visibility_off' : 'visibility';
  }

  // ── Clear field error ──
  function clearError(fieldId) {
    const field = document.getElementById(fieldId);
    const inp = field.querySelector('.field-input');
    const err = document.getElementById('error-' + fieldId.replace('field-', ''));
    if (inp) inp.classList.remove('has-error');
    if (err) err.style.display = 'none';
  }

  function showError(fieldId, message) {
    const field = document.getElementById(fieldId);
    const inp = field.querySelector('.field-input');
    const errId = fieldId.replace('field-', '');
    const err = document.getElementById('error-' + errId);
    const errText = document.getElementById('error-' + errId + '-text');
    if (inp) inp.classList.add('has-error');
    if (err) err.style.display = 'flex';
    if (errText) errText.textContent = message;
  }

  // ── Google ──
  function handleGoogle() {
    const btn = document.querySelector('.btn-google');
    btn.style.opacity = '0.6';
    btn.style.pointerEvents = 'none';
    setTimeout(() => {
      btn.style.opacity = '';
      btn.style.pointerEvents = '';
    }, 1500);
  }

  // ── Submit ──
  function handleSubmit(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    let valid = true;

    // clear previous errors
    clearError('field-email');
    clearError('field-password');

    // validate
    if (!email) {
      showError('field-email', '請輸入信箱');
      valid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('field-email', '請輸入有效的信箱格式');
      valid = false;
    }
    if (!password) {
      showError('field-password', '請輸入密碼');
      valid = false;
    } else if (password.length < 6) {
      showError('field-password', '密碼長度至少 6 位');
      valid = false;
    }
    if (!valid) return;

    // loading state
    const btn = document.getElementById('btn-submit');
    const label = document.getElementById('btn-label');
    btn.classList.add('loading');
    btn.disabled = true;
    label.innerHTML = `<div class="dot-pulse"><span></span><span></span><span></span></div>`;

    // simulate API call
    setTimeout(() => {
      btn.classList.remove('loading');
      btn.disabled = false;
      label.textContent = '登入';
      // simulate wrong password
      showError('field-password', '帳號或密碼不正確，請再試一次');
    }, 1800);
  }
</script>
</body>
</html>
