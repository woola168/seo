<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>總覽 — Kinsan SEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --primary:         #0A2B41;
  --primary-hover:   #2E4A5E;
  --primary-light:   #E7EAEC;
  --accent:          #FDB338;
  --info:            #1677FF;
  --info-light:      #E6F4FF;
  --info-text:       #0958D9;
  --success:         #52C41A;
  --success-light:   #F6FFED;
  --success-text:    #389E0D;
  --warning:         #FDB338;
  --warning-light:   #FFFCF0;
  --warning-text:    #AD6800;
  --error:           #F5222D;
  --error-light:     #FFF1F0;
  --error-text:      #CF1322;
  --text-primary:    #1F1F1F;
  --text-secondary:  #595959;
  --text-desc:       #8C8C8C;
  --text-disabled:   #BFBFBF;
  --surface:         #FFFFFF;
  --surface-2:       #FAFAFA;
  --surface-page:    #F5F5F5;
  --border:          #D9D9D9;
  --border-subtle:   #F0F0F0;
  --sidebar-w:       240px;
  --topbar-h:        56px;
}

body {
  font-family: 'Inter', 'Noto Sans TC', -apple-system, sans-serif;
  background: var(--surface-page);
  color: var(--text-primary);
  font-size: 14px;
  line-height: 1.57;
}

/* ══════════════════════════════════
   FEATHER ICONS helper
══════════════════════════════════ */
.fi {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  line-height: 1;
}
.fi svg {
  display: block;
  width: 20px;
  height: 20px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}
/* fi-sm/lg removed — all icons unified to 20px */

/* ══════════════════════════════════
   SIDEBAR COLLAPSED
══════════════════════════════════ */
.layout.collapsed .sidebar { width: 56px; }
.layout.collapsed .sb-logo-name,
.layout.collapsed .nav-item-label,
.layout.collapsed .nav-section,
.layout.collapsed .nav-badge,
.layout.collapsed .sb-user-info,
.layout.collapsed .sb-user-actions { display: none; }
.layout.collapsed .sb-logo { justify-content: space-between; padding: 0 14px; }
.layout.collapsed .nav-item { justify-content: center; padding: 9px; margin: 1px 6px; width: calc(100% - 12px); }
.layout.collapsed .sb-user  { justify-content: center; padding: 12px 0; }
.layout.collapsed .main     { margin-left: 56px; }
.layout.collapsed .topbar   { left: 56px; }

/* ══════════════════════════════════
   LAYOUT SHELL
══════════════════════════════════ */
.layout { display: flex; min-height: 100vh; }

/* ══════════════════════════════════
   SIDEBAR — 完全對齊 Sidebar/Nav 元件規格
══════════════════════════════════ */
.sidebar {
  width: var(--sidebar-w);
  height: 100vh;
  position: fixed;
  top: 0; left: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 200;
  transition: width 200ms ease;
  overflow: hidden;
}

/* ── Logo 區：height 68px / padding 18px 16px 14px ── */
.sb-logo {
  height: var(--topbar-h);
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
}
.sb-logo-name {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  letter-spacing: -0.01em;
  white-space: nowrap;
  flex: 1;
}
/* 收折按鈕（原 PRO badge 位置） */
.sb-collapse-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-desc);
  background: transparent;
  border: none;
  transition: background 120ms, color 120ms;
  flex-shrink: 0;
}
.sb-collapse-btn:hover {
  background: var(--surface-2);
  color: var(--text-primary);
}

/* ── Nav 捲動區 ── */
.sb-nav {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
}
.sb-nav::-webkit-scrollbar { width: 4px; }
.sb-nav::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── Section heading：10px / 600 / uppercase / #BFBFBF ── */
.nav-section {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-disabled);   /* #BFBFBF */
  padding: 10px 16px 4px;
  white-space: nowrap;
}

/* ── Nav item：padding 7px 12px / margin 1px 8px / radius 8px ── */
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  margin: 1px 8px;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 400;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 120ms, color 120ms;
  white-space: nowrap;
  border: none;
  background: transparent;
  width: calc(100% - 16px);
  font-family: inherit;
  text-align: left;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text-primary);
}
.nav-item.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 500;
}
/* icon 顏色 */
.nav-item .fi { color: var(--text-desc); transition: color 120ms; }
.nav-item.active .fi { color: var(--primary); }
.nav-item:hover .fi  { color: var(--text-primary); }

.nav-item-label { flex: 1; }

/* badge — 右側計數 */
.nav-badge {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 9999px;
  margin-left: auto;
  flex-shrink: 0;
}
.nav-badge.red   { background: var(--error-light);   color: var(--error-text); }
.nav-badge.blue  { background: var(--info-light);    color: var(--info-text); }
.nav-badge.amber { background: var(--warning-light); color: var(--warning-text); }
.nav-badge.green { background: var(--success-light); color: var(--success-text); }
.nav-badge.gray  { background: var(--surface-2); color: var(--text-desc); border: 1px solid var(--border); }

/* nav-chevron removed */

/* nav-sub/nav-dot removed */

/* ── User card：height 56px / padding 12px 14px ── */
.sb-user {
  border-top: 1px solid var(--border-subtle);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: background 120ms;
  flex-shrink: 0;
  height: 56px;
}
.sb-user:hover { background: var(--surface-2); }
.sb-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
  flex-shrink: 0;
  position: relative;
}
.sb-avatar-dot {
  position: absolute; bottom: 0; right: 0;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--success);
  border: 2px solid var(--surface);
}
.sb-user-info { flex: 1; min-width: 0; }
.sb-user-name {
  font-size: 13px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.sb-user-role { font-size: 11px; color: var(--text-desc); }
/* action buttons：size 28px / radius 6px — 放得下 20px icon */
.sb-user-actions { display: flex; gap: 2px; flex-shrink: 0; }
.sb-action-btn {
  width: 28px; height: 28px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-desc);
  background: transparent;
  cursor: pointer;
  transition: background 120ms;
  border: none;
  font-family: inherit;
}
.sb-action-btn:hover { background: var(--border-subtle); }

/* ══════════════════════════════════
   TOPBAR
══════════════════════════════════ */
.topbar {
  position: fixed;
  top: 0;
  left: var(--sidebar-w);
  right: 0;
  height: var(--topbar-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 12px;
  z-index: 100;
  transition: left 200ms ease;
}

.topbar-search {
  flex: 1;
  max-width: 400px;
  position: relative;
}
.topbar-search input {
  width: 100%;
  height: 36px;
  padding: 0 36px 0 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--surface-2);
  outline: none;
  transition: border-color 150ms, background 150ms, box-shadow 150ms;
}
.topbar-search input::placeholder { color: var(--text-disabled); }
.topbar-search input:focus {
  border-color: var(--primary);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(10,43,65,0.08);
}
.topbar-search-kbd {
  position: absolute;
  right: 10px; top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: var(--text-desc);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 5px;
  pointer-events: none;
}

/* Topbar right actions */
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 4px;
}

.tb-icon-btn {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text-secondary);
  transition: background 120ms;
  position: relative;
  border: none;
  background: transparent;
  font-family: inherit;
}
.tb-icon-btn:hover { background: var(--surface-2); }
.tb-icon-btn .ms { font-size: 20px; }
.tb-notif-badge {
  position: absolute;
  top: 4px; right: 4px;
  min-width: 16px; height: 16px;
  background: var(--error);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  border-radius: 9999px;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--surface);
  padding: 0 3px;
}

.tb-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff;
  cursor: pointer;
  margin-left: 4px;
  transition: opacity 150ms;
}
.tb-avatar:hover { opacity: 0.85; }

/* ══════════════════════════════════
   MAIN CONTENT
══════════════════════════════════ */
.main {
  margin-left: var(--sidebar-w);
  margin-top: var(--topbar-h);
  flex: 1;
  min-height: calc(100vh - var(--topbar-h));
  padding: 28px 32px 48px;
  transition: margin-left 200ms ease;
}

/* ── Page Header ── */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}
.ph-left {}
.ph-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.ph-meta {
  font-size: 13px;
  color: var(--text-desc);
  margin-top: 4px;
}
.ph-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 38px;
  padding: 0 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background 150ms, border-color 150ms, box-shadow 150ms;
  border: 1px solid transparent;
  font-family: inherit;
  white-space: nowrap;
  text-decoration: none;
}
.btn .ms { font-size: 16px; }
.btn-primary {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.btn-primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
  box-shadow: 0 4px 10px rgba(10,43,65,0.18);
}
.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-2); }

/* ── Stat Cards ── */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 20px 18px;
  position: relative;
  overflow: hidden;
  transition: box-shadow 200ms, transform 200ms;
  cursor: default;
}
.stat-card:hover {
  box-shadow: 0 4px 16px rgba(0,0,0,0.07);
  transform: translateY(-1px);
}
/* top accent bar */
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  border-radius: 12px 12px 0 0;
}
.stat-card.blue::before   { background: var(--info); }
.stat-card.amber::before  { background: var(--accent); }
.stat-card.red::before    { background: var(--error); }
.stat-card.green::before  { background: var(--success); }

.stat-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-desc);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.stat-icon {
  width: 26px; height: 26px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.stat-icon.blue  { background: var(--info-light);    color: var(--info-text); }
.stat-icon.amber { background: var(--warning-light); color: var(--warning-text); }
.stat-icon.red   { background: var(--error-light);   color: var(--error-text); }
.stat-icon.green { background: var(--success-light); color: var(--success-text); }

.stat-value {
  font-size: 36px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}
.stat-value.blue  { color: var(--info); }
.stat-value.amber { color: var(--warning); }
.stat-value.red   { color: var(--error); }
.stat-value.green { color: var(--success); }

.stat-sub {
  font-size: 12px;
  color: var(--text-desc);
}

/* ── Content Grid ── */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 20px;
}

/* ── Card ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
}
.card-body { padding: 0; }
.card-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ── Table ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
}
.data-table th {
  text-align: left;
  padding: 10px 20px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-desc);
  border-bottom: 1px solid var(--border-subtle);
  white-space: nowrap;
  background: var(--surface);
}
.data-table td {
  padding: 13px 20px;
  font-size: 13px;
  color: var(--text-primary);
  border-bottom: 1px solid var(--border-subtle);
  vertical-align: middle;
}
.data-table tr:last-child td { border-bottom: none; }
.data-table tbody tr {
  transition: background 120ms;
  cursor: pointer;
}
.data-table tbody tr:hover { background: var(--surface-2); }

/* Task title with avatar */
.task-title-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}
.task-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; color: #fff;
  flex-shrink: 0;
}
.task-name { font-size: 15px; font-weight: 500; }
.task-client { font-size: 13px; color: var(--text-desc); margin-top: 1px; }

/* ── Badge ── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 6px;
  border: 1px solid;
  white-space: nowrap;
}
.badge-info    { background: var(--info-light);    color: var(--info-text);    border-color: #91CAFF; }
.badge-success { background: var(--success-light); color: var(--success-text); border-color: #B7EB8F; }
.badge-warning { background: var(--warning-light); color: var(--warning-text); border-color: #FFC861; }
.badge-error   { background: var(--error-light);   color: var(--error-text);   border-color: #FFA39E; }
.badge-default { background: #F5F5F5; color: #595959; border-color: var(--border); }
.badge-primary { background: var(--primary-light); color: var(--primary); border-color: #9AABB7; }
.badge svg { width: 12px; height: 12px; }

/* ── Notification list ── */
.notif-item {
  display: flex;
  gap: 10px;
  padding: 13px 20px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: background 120ms;
  position: relative;
}
.notif-item:last-child { border-bottom: none; }
.notif-item:hover { background: var(--surface-2); }
.notif-item.unread { background: #F4F7FF; }
.notif-item.unread:hover { background: #EBF0FF; }
.notif-dot {
  position: absolute;
  top: 50%; right: 16px;
  transform: translateY(-50%);
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--info);
}
.notif-icon-wrap { position: relative; flex-shrink: 0; }
.notif-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.notif-type {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 14px; height: 14px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--surface);
  font-size: 8px;
}
.notif-body { flex: 1; min-width: 0; }
.notif-text {
  font-size: 12px;
  color: var(--text-primary);
  line-height: 1.5;
}
.notif-text b { font-weight: 600; }
.notif-time { font-size: 11px; color: var(--text-desc); margin-top: 2px; }

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 48px 24px;
}
.empty-icon {
  width: 48px; height: 48px;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 14px;
  font-size: 20px;
  color: var(--text-desc);
}
.empty-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.empty-desc { font-size: 13px; color: var(--text-desc); line-height: 1.6; }

/* ── Pagination ── */
.pagination {
  display: flex;
  align-items: center;
  gap: 4px;
}
.pg-btn {
  min-width: 30px; height: 30px;
  border-radius: 7px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0 6px;
  transition: all 120ms;
  font-family: inherit;
}
.pg-btn:hover { border-color: var(--text-disabled); color: var(--text-primary); }
.pg-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: 500; }
.pg-btn.disabled { opacity: 0.4; cursor: not-allowed; pointer-events: none; }

/* ── Quick action link ── */
.view-all {
  font-size: 12px;
  color: var(--info-text);
  font-weight: 500;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 3px;
  transition: color 120ms;
  border: none;
  background: none;
  font-family: inherit;
}
.view-all:hover { color: var(--info); }
.view-all svg { width: 14px; height: 14px; }

/* ── Dropdown menu ── */
.dropdown-wrap { position: relative; display: inline-block; }
.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: 160px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.09);
  z-index: 500;
  display: none;
}
.dropdown-wrap.open .dropdown-menu { display: block; }
.dd-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 16px;
  color: var(--text-primary);
  cursor: pointer;
  transition: background 120ms;
}
.dd-item:hover { background: var(--surface-2); }

.dd-item .ms { font-size: 15px; color: var(--text-desc); }

/* ── Summary chips ── */
.summary-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 28px;
  padding: 0 10px;
  border-radius: 9999px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);

}

.chip.active { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.chip svg { width: 13px; height: 13px; }

/* ── Tooltip ── */
[data-tip] { position: relative; }
[data-tip]:hover::after {
  content: attr(data-tip);
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%; transform: translateX(-50%);

<!-- ════════ TOAST ════════ -->
<div id="toast" style="
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);
  background:#1F1F1F;color:#fff;padding:9px 18px;border-radius:8px;
  font-size:13px;font-family:inherit;pointer-events:none;z-index:9999;
  opacity:0;transition:all .25s ease;box-shadow:0 4px 14px rgba(0,0,0,0.15);
  display:flex;align-items:center;gap:8px;white-space:nowrap;
"></div>

<script>
// ── Data ──
const TASKS = [
  { id:1, name:"Q2 SEO 落地頁優化",  client:"ACME Corp",    color:"#0958D9", initials:"AC", status:"progress", words:2400, due:"06/15" },
  { id:2, name:"品牌故事文案",        client:"NexGen Bio",   color:"#389E0D", initials:"NB", status:"progress", words:800,  due:"06/18" },
  { id:3, name:"電商首頁改寫",        client:"ShopPlus",     color:"#7C3AED", initials:"SP", status:"waiting",  words:1200, due:"06/20" },
  { id:4, name:"月報關鍵字分析",      client:"ACME Corp",    color:"#0958D9", initials:"AC", status:"progress", words:600,  due:"06/22" },
  { id:5, name:"產品頁 A/B 文案",     client:"Volta Tech",   color:"#D68C24", initials:"VT", status:"review",   words:980,  due:"06/25" },
  { id:6, name:"部落格長文 × 5",      client:"NexGen Bio",   color:"#389E0D", initials:"NB", status:"pending",  words:5000, due:"06/30" },
  { id:7, name:"社群貼文規劃",        client:"ShopPlus",     color:"#7C3AED", initials:"SP", status:"pending",  words:400,  due:"07/02" },
  { id:8, name:"競品分析報告",        client:"Volta Tech",   color:"#D68C24", initials:"VT", status:"pending",  words:3200, due:"07/05" },
  { id:9, name:"年度 SEO 策略書",     client:"ACME Corp",    color:"#0958D9", initials:"AC", status:"pending",  words:6000, due:"07/10" },
];

const STATUS_MAP = {
  progress: { label:"進行中", cls:"badge-info" },
  waiting:  { label:"等待客戶", cls:"badge-warning" },
  review:   { label:"審核中", cls:"badge-primary" },
  pending:  { label:"待開始", cls:"badge-default" },
  done:     { label:"已完成", cls:"badge-success" },
  returned: { label:"被退回", cls:"badge-error" },
};

const NOTIFS = [
  { id:1, unread:true,  initials:"AC", color:"#0958D9", typeColor:"#1677FF", typeFeather:"message-circle", text:"<b>ACME Corp</b> 對「Q2 SEO 落地頁」留下評論", time:"10 分鐘前" },
  { id:2, unread:true,  initials:"NB", color:"#389E0D", typeColor:"#52C41A", typeFeather:"check-circle",   text:"<b>NexGen Bio</b> 確認「品牌故事文案」完成", time:"1 小時前" },
  { id:3, unread:false, initials:"SP", color:"#7C3AED", typeColor:"#F5222D", typeFeather:"corner-up-left", text:"<b>ShopPlus</b> 退回「電商首頁改寫」，需修改", time:"3 小時前" },
];

// ── Date ──
function getDateMeta() {
  const d = new Date();
  const week = ["日","一","二","三","四","五","六"];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week[d.getDay()]} · 8 個客戶 · 9 個任務`;
}
document.getElementById('ph-meta').textContent = getDateMeta();

// ── Render tasks ──
let currentFilter = 'all';
function renderTasks(filter='all') {
  const tbody = document.getElementById('task-tbody');
  const list = filter==='all' ? TASKS :
    filter==='progress' ? TASKS.filter(t=>t.status==='progress') :
    filter==='waiting'  ? TASKS.filter(t=>t.status==='waiting')  : TASKS;

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state"><div class="empty-icon"><span class="ms" style="font-size:20px">checklist</span></div><div class="empty-title">沒有符合的任務</div><div class="empty-desc">試試調整篩選條件</div></div></td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(t => {
    const s = STATUS_MAP[t.status] || STATUS_MAP.pending;
    return `
    <tr>
      <td>
        <div class="task-title-cell">
          <div class="task-avatar" style="background:${t.color}">${t.initials}</div>
          <div>
            <div class="task-name">${t.name}</div>
            <div class="task-client">${t.client}</div>
          </div>
        </div>
      </td>
      <td><span class="badge ${s.cls}">${s.label}</span></td>
      <td style="color:var(--text-secondary);font-size:12px;font-family:'IBM Plex Mono',monospace">${t.words.toLocaleString()}</td>
      <td style="color:var(--text-secondary);font-size:12px">${t.due}</td>
      <td>
        <div class="dropdown-wrap" id="dd-${t.id}">
          <button class="tb-icon-btn" onclick="toggleDropdown('dd-${t.id}')" style="width:28px;height:28px;border-radius:6px">
            <span class="fi"><i data-feather="more-horizontal"></i></span>
          </button>
          <div class="dropdown-menu">
            <div class="dd-item"><span class="fi"><i data-feather="edit-2"></i></span> 編輯任務</div>
            <div class="dd-item"><span class="fi"><i data-feather="eye"></i></span> 查看詳情</div>
            <div class="dd-item"><span class="fi"><i data-feather="user-check"></i></span> 指派成員</div>
            <div class="dd-divider"></div>
            <div class="dd-item danger"><span class="fi"><i data-feather="trash-2"></i></span> 刪除任務</div>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
  feather.replace();
}
renderTasks();

// ── Render notifications ──
function renderNotifs() {
  const el = document.getElementById('notif-list');
  el.innerHTML = NOTIFS.map(n => `
    <div class="notif-item ${n.unread?'unread':''}" onclick="markRead(${n.id},this)">
      <div class="notif-icon-wrap">
        <div class="notif-avatar" style="background:${n.color}">${n.initials}</div>
        <div class="notif-type" style="background:${n.typeColor}">
          <svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" data-feather="${n.typeFeather}"></svg>
        </div>
      </div>
      <div class="notif-body">
        <div class="notif-text">${n.text}</div>
        <div class="notif-time">${n.time}</div>
      </div>
      ${n.unread?'<div class="notif-dot"></div>':''}
    </div>
  `).join('');
  feather.replace();
}
renderNotifs();

// ── Navigate ──
const PAGE_TITLES = {
  overview:"總覽", clients:"客戶", tasks:"任務",
  warroom:"戰情室", strategy:"策略分析",
  notifications:"通知", profile:"個人設定",
  permissions:"權限管理", settings:"系統設定",
};
function navigate(id, el) {
  // Update active nav item
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  const target = el || document.querySelector(`.nav-item[onclick*="${id}"]`);
  if (target) target.classList.add('active');
  // Update page title
  const t = PAGE_TITLES[id] || id;
  document.querySelector('.ph-title').textContent = t;
  showToast(`前往「${t}」`,'open-in-new');
}

// ── Filter chips ──
function filterChip(el, val) {
  document.querySelectorAll('.summary-chips .chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
}
function filterTasks(filter, el) {
  document.querySelectorAll('[id^="filter-"]').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTasks(filter);
}

// ── Sidebar collapse ──
function toggleSidebar() {
  const layout = document.getElementById('layout');
  const btn = document.getElementById('collapse-btn');
  const collapsed = layout.classList.toggle('collapsed');
  btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>';
}

// ── Dropdown ──
function toggleDropdown(id) {
  const el = document.getElementById(id);
  const wasOpen = el.classList.contains('open');
  document.querySelectorAll('.dropdown-wrap.open').forEach(d=>d.classList.remove('open'));
  if (!wasOpen) el.classList.add('open');
}
document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown-wrap') && !e.target.closest('.sb-user')) {
    document.querySelectorAll('.dropdown-wrap.open').forEach(d=>d.classList.remove('open'));
  }
});

// ── Refresh ──
function handleRefresh(btn) {
  const svg = btn.querySelector('svg');
  if (svg) svg.style.animation = 'spin 0.6s linear';
  setTimeout(()=>{ if(svg) svg.style.animation=''; },700);
  showToast('資料已更新','check-circle');
}
const styleEl = document.createElement('style');
styleEl.textContent = '@keyframes spin{to{transform:rotate(360deg)}}';
document.head.appendChild(styleEl);

// ── Export ──
function handleExport() { showToast('報表匯出中⋯','download'); }

// ── Mark notification read ──
function markRead(id, el) {
  el.classList.remove('unread');
  el.querySelector('.notif-dot')?.remove();
  const n = NOTIFS.find(x=>x.id===id);
  if (n) n.unread = false;
  // update topbar badge
  const unread = NOTIFS.filter(x=>x.unread).length;
  const badge = document.querySelector('.tb-notif-badge');
  if (badge) badge.textContent = unread || '';
  if (!unread) badge?.style && (badge.style.display='none');
}

// ── Toast ──
const TOAST_ICONS = {
  'check-circle': '<polyline points="20 6 9 17 4 12"></polyline>',
  'download':     '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
  'open-in-new':  '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line>',
};
function toastSvg(name) {
  const p = TOAST_ICONS[name] || TOAST_ICONS['check-circle'];
  return `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}
function showToast(msg, icon='check-circle') {
  const t = document.getElementById('toast');
  t.innerHTML = `${toastSvg(icon)}${msg}`;
  t.style.opacity='1';
  t.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>{
    t.style.opacity='0';
    t.style.transform='translateX(-50%) translateY(16px)';
  },2200);
}

// ── Keyboard shortcut: / to focus search ──
document.addEventListener('keydown', e=>{
  if(e.key==='/' && e.target.tagName!=='INPUT'){
    e.preventDefault();
    document.querySelector('.topbar-search input').focus();
  }
});
