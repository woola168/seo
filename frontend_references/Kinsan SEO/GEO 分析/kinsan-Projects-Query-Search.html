/* ══════════════════════════════════════════════════════════
   NAV COMPONENTS — exactly per younilab-設計規範 Sidebar spec
   Icons: 20px for nav items per Iconography spec
   Active group: fontWeight 600, chevron #0A2B41
   Sub-item: padding 8px 16px (wider horizontal)
   Section header: padding-top 20px
══════════════════════════════════════════════════════════ */
function NavSection({label}){
  return <div style={{fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",color:"#BFBFBF",padding:"20px 16px 6px"}}>{label}</div>;
}

function NavItem({item,activeId,onSelect,collapsed,expanded,onToggle,sub=false}){
  const [hov,setHov] = useState(false);

  /* active: direct match OR any child matches */
  const isActive = activeId===item.id
    || (item.children&&item.children.some(c=>c.id===activeId));
  const isExp = expanded[item.id];

  if(item.type==="section") return collapsed ? null : <NavSection label={item.label}/>;

  const handleClick = () => {
    if(item.children) onToggle(item.id);
    else onSelect(item.id);
  };

  /* Colour + weight rules (per spec + Figma)
     Group 有子選單時：active 只改顏色/字重，背景保持透明 */
  const hasChildren = !!item.children;
  const fg       = isActive ? "#0A2B41" : "#595959";
  const iconCol  = isActive ? "#0A2B41" : "#8C8C8C";
  const bgCol    = isActive
    ? (hasChildren ? "transparent" : "#E7EAEC")  /* group = 無底色 */
    : hov ? "#FAFAFA" : "transparent";
  const fw       = isActive ? (hasChildren ? 600 : 500) : 400;

  return (
    <>
      <div onClick={handleClick}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        title={collapsed&&!sub ? item.label : undefined}
        style={{
          display:"flex", alignItems:"center",
          gap: (collapsed&&!sub) ? 0 : 8,
          /* Sub: 8px 16px / Parent: 10px 12px */
          padding: sub ? "8px 16px" : (collapsed ? "10px 0" : "10px 12px"),
          margin:"1px 8px", borderRadius:8, cursor:"pointer",
          justifyContent:(collapsed&&!sub)?"center":"flex-start",
          background: bgCol,
          color: fg,
          fontWeight: fw,
          /* Sub 13px / Parent 14px */
          fontSize: sub ? 13 : 14,
          transition:"all .12s",
          position:"relative",
        }}>
        {/* ── Icon: 20px for nav items per spec Iconography 尺寸階 ── */}
        {!sub && !collapsed && <FI name={item.icon} size={20} color={iconCol}/>}
        {!sub && collapsed  && <FI name={item.icon} size={20} color={iconCol}/>}
        {/* Sub-item: 前綴圓點 5×5 active #0A2B41 / default #BFBFBF / marginLeft 6px */}
        {sub && (
          <div style={{width:5,height:5,borderRadius:"50%",background:isActive?"#0A2B41":"#BFBFBF",marginLeft:6,flexShrink:0}}/>
        )}
        {!collapsed && <span style={{flex:1,whiteSpace:"nowrap"}}>{item.label}</span>}
        {/* Badge */}
        {!collapsed && !sub && item.badge && (
          <span style={{minWidth:18,height:18,borderRadius:9,background:item.badgeColor||"#F5222D",color:"#fff",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 5px",flexShrink:0}}>
            {item.badge}
          </span>
        )}
        {/* Badge dot (collapsed) */}
        {collapsed && !sub && item.badge && (
          <div style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:"50%",background:item.badgeColor||"#F5222D",border:"1.5px solid #fff"}}/>
        )}
        {/* Chevron — active group: #0A2B41, else #BFBFBF (per Figma) */}
        {!collapsed && item.children && (
          <FI name={isExp?"chevron-up":"chevron-right"} size={14}
            color={isActive?"#0A2B41":"#BFBFBF"}/>
        )}
      </div>
      {/* Children — paddingLeft:10 per spec */}
      {item.children && isExp && !collapsed && (
        <div style={{paddingLeft:10}}>
          {item.children.map(c=>(
            <NavItem key={c.id} item={{...c,type:"item",icon:""}} activeId={activeId}
              onSelect={onSelect} collapsed={false} expanded={{}} onToggle={()=>{}} sub/>
          ))}
        </div>
      )}
    </>
  );
}

}

/* Button — per spec sizes & variants */
function Btn({children,variant="primary",size="md",onClick,style={}}){
  const [hov,setHov]=useState(false);
  const h=size==="sm"?32:size==="lg"?44:40;
  const px=size==="sm"?12:size==="lg"?20:16;
  const fs=size==="sm"?12:size==="lg"?15:14;
  const base={height:h,padding:`0 ${px}px`,borderRadius:8,fontSize:fs,fontWeight:500,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,outline:"none",transition:"all .15s",whiteSpace:"nowrap",fontFamily:"var(--font)",border:"none"};
  const v={
    primary:  {border:"1px solid var(--primary)",background:hov?"var(--primary-hover)":"var(--primary)",color:"#fff"},
    secondary:{border:"1px solid var(--border)",background:hov?"var(--bg-2)":"#fff",color:"var(--fg)"},
    ghost:    {border:"1px solid transparent",background:hov?"var(--bg-2)":"transparent",color:"var(--fg-2)"},
  }[variant]||{};
  return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,...v,...style}}>{children}</button>;
}

/* Top Header Icon Button — 18px icon, 32×32, radius 6 per spec */
function IconBtn({name,title,badge,onClick}){
  const [hov,setHov]=useState(false);
  return(
    <div style={{position:"relative"}}>
      <div title={title} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:hov?"#F0F0F0":"transparent",transition:"background .12s",flexShrink:0}}>
        {/* Top Header icons: 18px per spec */}
        <FI name={name} size={18} color="#595959"/>
      </div>
      {badge&&<div style={{position:"absolute",top:5,right:6,width:8,height:8,borderRadius:"50%",background:"#F5222D",border:"1.5px solid #fff",pointerEvents:"none"}}/>}
    </div>
  );
}

  active:   {bg:"#F6FFED",color:"#389E0D",border:"#B7EB8F", label:"進行中"},
  paused:   {bg:"#FFFCF0",color:"#AD6800",border:"#FFC861", label:"已暫停"},
  archived: {bg:"#F5F5F5",color:"#595959",border:"#D9D9D9", label:"已下架"},
};
/* 狀態值 → 中文（供 badge 與篩選 dropdown 共用） */
const STATUS_LABEL = Object.fromEntries(Object.entries(PROJ_STATUS).map(([k,v])=>[k,v.label]));
function ProjStatusBadge({status}){
  const c=PROJ_STATUS[status]||PROJ_STATUS.archived;
  return(
    <span style={{display:"inline-flex",alignItems:"center",fontSize:12,fontWeight:500,padding:"2px 8px",borderRadius:6,whiteSpace:"nowrap",lineHeight:"18px",background:c.bg,color:c.color,border:`1px solid ${c.border}`}}>
      <span style={{width:5,height:5,borderRadius:"50%",background:c.color,marginRight:5,flexShrink:0}}/>
      {c.label}
    </span>
  );
}

/* ─── Filter Tag — pill 28px per spec ─── */
function FilterTag({label,onRemove}){
  return(
    <div style={{display:"inline-flex",alignItems:"center",gap:6,height:28,padding:"0 6px 0 10px",borderRadius:14,background:"#FAFAFA",border:"1px solid #D9D9D9",fontSize:12,color:"#434343",flexShrink:0,whiteSpace:"nowrap"}}>
      {label}
      <span onClick={onRemove} style={{display:"flex",cursor:"pointer",padding:2,borderRadius:4,transition:"opacity .1s"}}
        onMouseEnter={e=>e.currentTarget.style.opacity=0.6} onMouseLeave={e=>e.currentTarget.style.opacity=1}>
        <FI name="x" size={12} color="#8C8C8C"/>
      </span>
    </div>
  );
}

/* ─── Filter Panel Checkbox ─── */
function FilterCb({checked,onChange,label}){
  const [hov,setHov]=useState(false);
  return(
    <div onClick={onChange} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",cursor:"pointer",background:hov?"#FAFAFA":"transparent",marginLeft:-4,paddingLeft:4,borderRadius:6,transition:"background .1s"}}>
      <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${checked?"#0A2B41":"#D9D9D9"}`,background:checked?"#0A2B41":"#fff",display:"flex",alignItems:"center",justifyContent:"center",transition:"all .12s",flexShrink:0}}>
        {checked&&<FI name="check" size={11} color="#fff"/>}
      </div>
      <span style={{fontSize:13,color:"#434343"}}>{label}</span>
    </div>
  );
}

/* ─── Multi-Select Dropdown ───
   即點即用，無需 apply 動作
   按鈕樣式：
     default: 白底灰框
     active (有選):  bg #E6F4FF / border #91CAFF / text #0958D9
   面板：position:fixed, 含搜尋框（>=8 項才顯示）+ 全選/全不選 + checkbox list
─────────────────────────────────────────── */
function MultiDropdown({label,options,selected,onChange,searchable=false,optionLabel}){
  const optLabel=(v)=>optionLabel?optionLabel(v):v;
  const [open,setOpen]=useState(false);
  const [pos,setPos]=useState(null);
  const [q,setQ]=useState("");
  const btnRef=useRef(null);
  const isActive=selected.length>0;
  const showSearch=searchable&&options.length>=8;

  const toggle=()=>{
    if(!open){
      const r=btnRef.current?.getBoundingClientRect();
      if(r) setPos({top:r.bottom+4,left:r.left});
      setQ("");
    }
    setOpen(o=>!o);
  };
  const close=()=>setOpen(false);
  const toggleOpt=(v)=>onChange(selected.includes(v)?selected.filter(x=>x!==v):[...selected,v]);
  const filteredOpts=q?options.filter(o=>optLabel(o).toLowerCase().includes(q.toLowerCase())):options;
  const allSelected=options.every(o=>selected.includes(o));
  const toggleAll=()=>onChange(allSelected?[]:[...options]);

  /* close on scroll */
  useEffect(()=>{
    const h=()=>{if(open)close();};
    window.addEventListener("scroll",h,true);
    return()=>window.removeEventListener("scroll",h,true);
  },[open]);

  /* button label: "Status" / "Status · 2" */
  const buttonLabel=isActive?`${label} · ${selected.length}`:label;

  return(
    <>
      <button ref={btnRef} onClick={toggle}
        style={{
          height:40,padding:"0 12px",borderRadius:8,
          display:"inline-flex",alignItems:"center",gap:6,
          fontSize:14,cursor:"pointer",fontFamily:"var(--font)",flexShrink:0,
          transition:"all .15s",whiteSpace:"nowrap",
          background:open||isActive?"#E6F4FF":"#fff",
          border:"1px solid "+(open||isActive?"#91CAFF":"#D9D9D9"),
          color:open||isActive?"#0958D9":"#1F1F1F",
          fontWeight:isActive?500:400,
        }}>
        {buttonLabel}
        <FI name="chevron-down" size={12} color={open||isActive?"#0958D9":"#8C8C8C"}/>
      </button>
      {open&&pos&&(
        <>
          <div onClick={close} style={{position:"fixed",inset:0,zIndex:99}}/>
          <div style={{
            position:"fixed",top:pos.top,left:pos.left,
            minWidth:220,maxWidth:300,
            background:"#fff",border:"1px solid #E7EAEC",borderRadius:10,
            boxShadow:"0 4px 16px rgba(0,0,0,0.08)",
            zIndex:100,padding:8,
            display:"flex",flexDirection:"column",
          }} onClick={e=>e.stopPropagation()}>
            {/* Search — only when ≥8 options（固定於頂部，不隨選項捲動） */}
            {showSearch&&(
              <div style={{position:"relative",marginBottom:8,flexShrink:0}}>
                <div style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
                  <FI name="search" size={12} color="#BFBFBF"/>
                </div>
                <input value={q} onChange={e=>setQ(e.target.value)} autoFocus
                  placeholder={`搜尋 ${label}…`}
                  style={{width:"100%",height:32,padding:"0 10px 0 28px",fontSize:13,color:"#1F1F1F",border:"1px solid #D9D9D9",borderRadius:6,outline:"none",background:"#fff",fontFamily:"var(--font)"}}
                  onFocus={e=>e.target.style.borderColor="#0A2B41"}
                  onBlur={e=>e.target.style.borderColor="#D9D9D9"}/>
              </div>
            )}
            {/* All toggle — only when ≥3 options & no search query（固定，不隨選項捲動） */}
            {options.length>=3&&!q&&(
              <div onClick={toggleAll}
                style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",borderRadius:6,fontSize:12,color:"#1677FF",cursor:"pointer",fontWeight:500,marginBottom:2,flexShrink:0}}
                onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {allSelected?"取消全選":"全選"}
              </div>
            )}
            {/* Options — 規範 maxHeight 240 卷動；細捲軸 */}
            <div style={{maxHeight:240,overflowY:"auto",scrollbarWidth:"thin",scrollbarColor:"#D9D9D9 transparent"}}>
              {filteredOpts.length>0
                ? filteredOpts.map(opt=>(
                    <div key={opt} onClick={()=>toggleOpt(opt)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:6,cursor:"pointer",fontSize:13,color:"#434343"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${selected.includes(opt)?"#0A2B41":"#D9D9D9"}`,background:selected.includes(opt)?"#0A2B41":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .12s"}}>
                        {selected.includes(opt)&&<FI name="check" size={11} color="#fff"/>}
                      </div>
                      <span>{optLabel(opt)}</span>
                    </div>
                  ))
                : <div style={{padding:"16px 8px",fontSize:12,color:"#BFBFBF",textAlign:"center"}}>找不到相符項目</div>
              }
            </div>
          </div>
        </>
      )}
    </>
  );
}

/* Auto-select pattern:
   篩選欄位數 ≤ 3 → 使用多 Dropdown（即點即用，每欄位獨立）
   篩選欄位數 > 3 → 應改回 Filter Panel（一鍵展開整版）
   本頁有 3 個欄位（Status / Locale / Customer），剛好用 Multi-Dropdown */

/* ─── Project Drawer — per younilab Drawer spec
   width 480px (規範 default 400 → 加寬容納 3-col grid)
   header 20px 24px / body 20px 24px / footer 16px 24px
   overlay rgba(0,0,0,0.4) + blur(2px)
   slideIn 250ms ease from right
─────────────────────────────────────────── */
const REGION_OPTIONS = ["TW","US","JP","EU","Others"];
const LANG_OPTIONS   = ["zh-TW","en-US","ja-JP","en-GB"];

/* ── 共用確認彈窗（navy 主按鈕，禁紅，文案明示後果）── */
function ConfirmDialog({title,message,onCancel,onConfirm,confirmLabel="確定刪除",single=false}){
  useEffect(()=>{
    const h=e=>{if(e.key==="Escape")onCancel();};
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[]);
  return(
    <>
      <div onClick={onCancel} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:400}}/>
      <div style={{position:"fixed",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:400,maxWidth:"90vw",
        background:"#fff",borderRadius:12,boxShadow:"0 16px 48px rgba(0,0,0,0.16)",zIndex:401,overflow:"hidden"}}>
        <div style={{padding:"24px 24px 20px"}}>
          <div style={{fontSize:16,fontWeight:600,color:"#1F1F1F",marginBottom:8}}>{title}</div>
          <div style={{fontSize:14,color:"#595959",lineHeight:1.6}}>{message}</div>
        </div>
        <div style={{padding:"12px 24px 20px",display:"flex",justifyContent:"flex-end",gap:8}}>
          {!single&&(
            <button onClick={onCancel}
              style={{height:40,padding:"0 16px",borderRadius:8,fontSize:14,fontWeight:500,fontFamily:"var(--font)",
                border:"1px solid #D9D9D9",background:"#fff",color:"#434343",cursor:"pointer"}}>取消</button>
          )}
          <button onClick={single?onCancel:onConfirm}
            style={{height:40,padding:"0 16px",borderRadius:8,fontSize:14,fontWeight:500,fontFamily:"var(--font)",
              border:"none",background:"#0A2B41",color:"#fff",cursor:"pointer"}}>{confirmLabel}</button>
        </div>
      </div>
    </>
  );
}

function ProjectDrawer({open,onClose,onCreate,onUpdate,editing}){
  const [vis,setVis]   = useState(false);  /* for slide-in animation */
  const [name,setName] = useState("");
  const [customer,setCustomer] = useState("");
  const [task,setTask] = useState("");
  const [region,setRegion] = useState("TW");
  const [lang,setLang] = useState("zh-TW");
  const [budget,setBudget] = useState("200");
  const [errors,setErrors] = useState({});
  const isEdit=!!editing;

  /* editing：開啟時帶入該列資料 */
  useEffect(()=>{
    if(open&&editing){
      setName(editing.name||"");
      setCustomer(editing.customer||"");
      setTask(editing.task==="—"?"":(editing.task||""));
      const parts=(editing.locale||"TW/zh-TW").split(" · ");
      setRegion(parts[0]||"TW"); setLang(parts[1]||"zh-TW");
      setBudget(String(editing.budget||"200"));
    } else if(open&&!editing){
      setName(""); setCustomer(""); setTask(""); setRegion("TW"); setLang("zh-TW"); setBudget("200");
    }
    setErrors({});
  },[open,editing]);

  /* drive slide-in once mounted */
  useEffect(()=>{
    if(open){
      const t=setTimeout(()=>setVis(true),10);
      return()=>clearTimeout(t);
    } else {
      setVis(false);
    }
  },[open]);

  /* Esc to close */
  useEffect(()=>{
    if(!open) return;
    const h=e=>{if(e.key==="Escape") handleClose();};
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
    // eslint-disable-next-line
  },[open]);

  const handleClose=()=>{
    setVis(false);
    setTimeout(()=>{
      onClose();
      /* reset form on close */
      setName("");setCustomer("");setTask("");
      setRegion("TW");setLang("zh-TW");setBudget("200");
      setErrors({});
    },250);
  };

  const validate=()=>{
    const e={};
    if(!name.trim())     e.name="請輸入專案名稱";
    if(!customer.trim()) e.customer="請輸入客戶名稱";
    if(!budget.trim()||isNaN(Number(budget))||Number(budget)<=0) e.budget="請輸入有效預算";
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const handleSubmit=()=>{
    if(!validate()) return;
    /* slugify from name */
    const slug="geo-project-"+name.toLowerCase().replace(/\s+/g,"-").replace(/[^a-z0-9\-]/g,"").slice(0,24)||"new";
    if(isEdit){
      onUpdate({...editing,name:name.trim(),slug,customer:customer.trim(),
        task:task.trim()||"—",locale:`${region} · ${lang}`,budget:Number(budget)});
    } else {
      onCreate({id:"p"+Date.now(),name:name.trim(),slug,customer:customer.trim(),
        task:task.trim()||"—",locale:`${region} · ${lang}`,budget:Number(budget),status:"active"});
    }
    handleClose();
  };

  if(!open) return null;

  return (
    <>
      {/* Overlay */}
      <div onClick={handleClose}
        style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",backdropFilter:"blur(2px)",zIndex:300,
          opacity:vis?1:0,transition:"opacity 250ms ease"}}/>

      {/* Drawer panel */}
      <div role="dialog" aria-modal="true"
        style={{
          position:"fixed",top:0,right:0,bottom:0,
          width:480,maxWidth:"90vw",
          background:"#fff",boxShadow:"-4px 0 24px rgba(0,0,0,0.1)",
          zIndex:301,display:"flex",flexDirection:"column",
          transform:vis?"translateX(0)":"translateX(100%)",
          transition:"transform 250ms ease",
        }}>

        {/* ── Header ── */}
        <div style={{padding:"20px 24px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:600,color:"#1F1F1F"}}>{isEdit?"編輯 Project":"建立 Project"}</div>
          <div onClick={handleClose}
            style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"background .12s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="x" size={18} color="#595959"/>
          </div>
        </div>

        {/* ── Body — 一行一欄，無分組標題 ── */}
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>

          {/* 1. 專案名稱 */}
          <Field label="專案名稱" required error={errors.name}>
            <input value={name} onChange={e=>{setName(e.target.value);setErrors({...errors,name:undefined});}}
              placeholder="例如：品牌 GEO 追蹤"
              style={inputStyle(errors.name)}
              onFocus={e=>!errors.name&&(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
              onBlur={e=>(e.target.style.borderColor=errors.name?"#F5222D":"#D9D9D9",e.target.style.boxShadow="none")}/>
          </Field>

          {/* 2. 客戶名稱 */}
          <Field label="客戶名稱" required error={errors.customer}>
            <input value={customer} onChange={e=>{setCustomer(e.target.value);setErrors({...errors,customer:undefined});}}
              placeholder="客戶名稱"
              style={inputStyle(errors.customer)}
              onFocus={e=>!errors.customer&&(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
              onBlur={e=>(e.target.style.borderColor=errors.customer?"#F5222D":"#D9D9D9",e.target.style.boxShadow="none")}/>
          </Field>

          {/* 3. SEO 任務 */}
          <Field label="SEO 任務">
            <input value={task} onChange={e=>setTask(e.target.value)}
              placeholder="輸入任務名稱"
              style={inputStyle()}
              onFocus={e=>(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
              onBlur={e=>(e.target.style.borderColor="#D9D9D9",e.target.style.boxShadow="none")}/>
          </Field>

          {/* 4. Region */}
          <Field label="Region" required>
            <Select value={region} onChange={setRegion} options={REGION_OPTIONS}/>
          </Field>

          {/* 5. Language */}
          <Field label="Language" required>
            <Select value={lang} onChange={setLang} options={LANG_OPTIONS}/>
          </Field>

          {/* 6. Daily run budget — 單欄 + suffix 單位 */}
          <Field label="Daily run budget" required error={errors.budget}>
            <div style={{position:"relative"}}>
              <input type="number" min="1" value={budget}
                onChange={e=>{setBudget(e.target.value);setErrors({...errors,budget:undefined});}}
                style={{...inputStyle(errors.budget),paddingRight:60}}
                onFocus={e=>!errors.budget&&(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
                onBlur={e=>(e.target.style.borderColor=errors.budget?"#F5222D":"#D9D9D9",e.target.style.boxShadow="none")}/>
              {/* Suffix unit */}
              <div style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",fontSize:13,color:"#8C8C8C",pointerEvents:"none"}}>次/日</div>
            </div>
          </Field>
        </div>

        {/* ── Footer — 通用詞彙：取消 / 確認 ── */}
        <div style={{padding:"16px 24px",borderTop:"1px solid #F0F0F0",display:"flex",justifyContent:"flex-end",gap:8,flexShrink:0}}>
          <Btn variant="secondary" onClick={handleClose}>取消</Btn>
          <Btn variant="primary" onClick={handleSubmit}>{isEdit?"儲存變更":"確認"}</Btn>
        </div>
      </div>
    </>
  );
}

/* ── Section Header — overline 11px / 600 / uppercase 規範
   支援自訂 style，方便調整 marginTop（分組間距） ── */
function SectionHeader({children,style={}}){
  return(
    <div style={{
      fontSize:11,fontWeight:600,
      color:"#8C8C8C",
      letterSpacing:"0.06em",textTransform:"uppercase",
      marginBottom:14,
      ...style,
    }}>{children}</div>
  );
}

/* ── Section Divider — 1px / #F0F0F0 / 20px vertical margin
   ⚠️ 目前 ProjectDrawer 用距離取代，保留元件供未來頁面用 ── */
function SectionDivider(){
  return <div style={{height:1,background:"#F0F0F0",margin:"20px 0"}}/>;
}

/* ── Field wrapper ──
   marginBottom 20px 為統一垂直節奏
   noGap=true：grid 容器內的子 Field，外層 grid 已用 gap 控制，內部不再加 mb */
function Field({label,required,hint,error,children,noGap}){
  return(
    <div style={{marginBottom:noGap?0:20}}>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:6}}>
        <label style={{fontSize:13,fontWeight:500,color:"#1F1F1F"}}>
          {label}
          {required&&<span style={{color:"#F5222D",marginLeft:3}}>*</span>}
        </label>
        {hint&&<span style={{fontSize:11,color:"#BFBFBF"}}>{hint}</span>}
      </div>
      {children}
      {error&&(
        <div style={{display:"flex",alignItems:"center",gap:4,marginTop:6,fontSize:12,color:"#CF1322"}}>
          <FI name="alert-circle" size={12} color="#CF1322"/>
          {error}
        </div>
      )}
    </div>
  );
}

/* ── Input style helper ── */
const inputStyle=(error)=>({
  width:"100%",height:40,padding:"0 12px",
  fontSize:14,color:"#1F1F1F",
  border:`1px solid ${error?"#F5222D":"#D9D9D9"}`,
  borderRadius:8,outline:"none",background:"#fff",
  fontFamily:"var(--font)",
  transition:"border-color .12s, box-shadow .12s",
  boxSizing:"border-box",
});

/* ── Native-styled Select ── */
function Select({value,onChange,options,labels,renderOption}){
  const [open,setOpen]=useState(false);
  const [pos,setPos]=useState(null);
  const ref=useRef(null);
  const btnRef=useRef(null);
  const menuRef=useRef(null);
  const disp=(o)=>renderOption?renderOption(o):(labels?(labels[o]||o):o);
  const openMenu=()=>{
    const r=btnRef.current?.getBoundingClientRect();
    if(r) setPos({left:r.left,top:r.bottom+4,width:r.width});
    setOpen(true);
  };
  useEffect(()=>{
    if(!open) return;
    const close=e=>{
      if(ref.current&&ref.current.contains(e.target)) return;
      if(menuRef.current&&menuRef.current.contains(e.target)) return;
      setOpen(false);
    };
    const reposition=()=>{
      const r=btnRef.current?.getBoundingClientRect();
      if(r) setPos({left:r.left,top:r.bottom+4,width:r.width});
    };
    document.addEventListener("mousedown",close);
    window.addEventListener("scroll",reposition,true);
    window.addEventListener("resize",reposition);
    return()=>{
      document.removeEventListener("mousedown",close);
      window.removeEventListener("scroll",reposition,true);
      window.removeEventListener("resize",reposition);
    };
  },[open]);
  return(
    <div ref={ref} style={{position:"relative",width:"100%"}}>
      <button ref={btnRef} type="button" onClick={()=>open?setOpen(false):openMenu()}
        style={{width:"100%",height:40,padding:"0 36px 0 12px",fontSize:14,fontFamily:"var(--font)",
          color:value?"#1F1F1F":"#BFBFBF",textAlign:"left",cursor:"pointer",
          border:"1px solid "+(open?"#0A2B41":"#D9D9D9"),borderRadius:8,background:"#fff",outline:"none",
          boxShadow:open?"0 0 0 3px rgba(10,43,65,0.08)":"none",transition:"all .15s",boxSizing:"border-box"}}>
        {value?disp(value):"請選擇"}
      </button>
      <div style={{position:"absolute",right:12,top:"50%",transform:`translateY(-50%) rotate(${open?180:0}deg)`,pointerEvents:"none",transition:"transform .15s"}}>
        <FI name="chevron-down" size={14} color="#8C8C8C"/>
      </div>
      {open&&pos&&ReactDOM.createPortal(
        <div ref={menuRef} style={{position:"fixed",top:pos.top,left:pos.left,width:pos.width,background:"#fff",

          {options.map(o=>{
            const s=o===value;
            return(
              <div key={o} onClick={()=>{onChange(o);setOpen(false);}}
                onMouseEnter={e=>{if(!s)e.currentTarget.style.background="#FAFAFA";}}
                onMouseLeave={e=>{if(!s)e.currentTarget.style.background="transparent";}}

                  display:"flex",justifyContent:"space-between",alignItems:"center",

                <span>{disp(o)}</span>{s&&<FI name="check" size={14} color="#0A2B41"/>}
              </div>
            );
          })}
        </div>, document.body)}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   PROJECT EDIT PAGE（獨立詳情頁）

   Query list 因 7 欄，卡片內表格橫向捲動 + 操作欄凍結
══════════════════════════════════════════════════════════ */
/* 表單欄位容器（label + 選填 helper；half=半寬並排、否則整行） */
function FField({label,required,children,half,helper,error,action}){
  return(
    <div data-err={error?"1":undefined} style={half?{minWidth:0}:{gridColumn:"1 / -1",minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,minHeight:24,marginBottom:6}}>
        <label style={{fontSize:13,fontWeight:500,color:"#1F1F1F"}}>
          {label}{required&&<span style={{color:"#CF1322",marginLeft:4}}>*</span>}
        </label>
        {action}
      </div>
      {children}
      {error
        ? <div style={{fontSize:12,color:"#CF1322",marginTop:4}}>{error}</div>
        : helper&&<div style={{fontSize:12,color:"#8C8C8C",marginTop:4}}>{helper}</div>}
    </div>
  );
}
/* Checkbox — 依 younilab 頁面範本規格（16×16、radius4、navy 底白勾、半選白橫槓） */
function Cb({checked,indeterminate,onChange}){
  return <div onClick={e=>{e.stopPropagation();onChange&&onChange();}}
    style={{width:16,height:16,borderRadius:4,border:"1.5px solid "+(checked||indeterminate?"var(--primary)":"var(--border)"),
      background:checked||indeterminate?"var(--primary)":"#fff",display:"flex",alignItems:"center",justifyContent:"center",
      cursor:"pointer",transition:"all .12s",flexShrink:0}}>
    {checked&&<FI name="check" size={11} color="#fff"/>}
    {!checked&&indeterminate&&<div style={{width:8,height:2,background:"#fff",borderRadius:1}}/>}
  </div>;
}
/* Toggle 開關（navy 開 / 灰關） */
function Toggle({checked,onChange}){
  return(
    <div onClick={()=>onChange(!checked)}
      style={{width:40,height:22,borderRadius:11,background:checked?"#0A2B41":"#D9D9D9",
        position:"relative",cursor:"pointer",flexShrink:0,transition:"background .15s"}}>
      <div style={{width:18,height:18,borderRadius:"50%",background:"#fff",position:"absolute",top:2,
        left:checked?20:2,transition:"left .15s",boxShadow:"0 1px 2px rgba(0,0,0,0.2)"}}/>
    </div>
  );
}
/* 唯讀欄位展示（label + 純文字值；不可編輯，用於步驟2 回顯步驟1 資料） */
function ReadField({label,value,half,children}){
  return(
    <div style={half?{minWidth:0}:{gridColumn:"1 / -1",minWidth:0}}>
      <div style={{fontSize:13,fontWeight:500,color:"#8C8C8C",marginBottom:6}}>{label}</div>
      {children||<div style={{fontSize:14,color:"#1F1F1F",lineHeight:"22px",wordBreak:"break-all"}}>{value||<span style={{color:"#BFBFBF"}}>—</span>}</div>}
    </div>
  );
}
/* 文字輸入（focus navy 邊框 + ring；error 紅框） */
function Txt({placeholder,value,onChange,error}){
  const [f,setF]=useState(false);
  const bc=error?"#CF1322":(f?"#0A2B41":"#D9D9D9");
  const ring=error?"0 0 0 3px rgba(207,19,34,0.08)":(f?"0 0 0 3px rgba(10,43,65,0.08)":"none");
  return <input value={value||""} placeholder={placeholder}
    onChange={e=>onChange&&onChange(e.target.value)}
    onFocus={()=>setF(true)} onBlur={()=>setF(false)}
    style={{width:"100%",boxSizing:"border-box",height:40,padding:"0 12px",fontSize:14,fontFamily:"var(--font)",color:"#1F1F1F",background:"#fff",outline:"none",borderRadius:8,
      border:"1px solid "+bc,boxShadow:ring,transition:"all .15s"}}/>;
}
/* 競爭品牌 tag 輸入：Enter 或逗號新增、× 刪除、Backspace 刪末項；error 紅框 */
function TagInput({value=[],onChange,placeholder,error}){
  const [draft,setDraft]=useState("");
  const [f,setF]=useState(false);
  const add=(raw)=>{
    const t=raw.trim().replace(/,$/,"").trim();
    if(t&&!value.includes(t))onChange([...value,t]);
    setDraft("");
  };
  const removeAt=(i)=>onChange(value.filter((_,idx)=>idx!==i));
  const onKey=(e)=>{
    if(e.key==="Enter"||e.key===","){e.preventDefault();add(draft);}
    else if(e.key==="Backspace"&&!draft&&value.length){removeAt(value.length-1);}
  };
  const bc=error?"#CF1322":(f?"#0A2B41":"#D9D9D9");
  const ring=error?"0 0 0 3px rgba(207,19,34,0.08)":(f?"0 0 0 3px rgba(10,43,65,0.08)":"none");
  return(
    <div style={{width:"100%",boxSizing:"border-box",minHeight:40,padding:"5px 8px",
      display:"flex",flexWrap:"wrap",gap:6,alignItems:"center",background:"#fff",borderRadius:8,
      border:"1px solid "+bc,boxShadow:ring,transition:"all .15s"}}>
      {value.map((tag,i)=>(
        <span key={tag} style={{display:"inline-flex",alignItems:"center",gap:4,height:26,padding:"0 6px 0 10px",
          background:"#F5F7F8",border:"1px solid #E7EAEC",borderRadius:6,fontSize:13,color:"#1F1F1F",whiteSpace:"nowrap"}}>
          {tag}
          <span onClick={()=>removeAt(i)} style={{display:"inline-flex",cursor:"pointer",padding:2,borderRadius:4,color:"#8C8C8C"}}
            onMouseEnter={e=>e.currentTarget.style.color="#1F1F1F"} onMouseLeave={e=>e.currentTarget.style.color="#8C8C8C"}>
            <FI name="x" size={12}/>
          </span>
        </span>
      ))}
      <input value={draft} placeholder={value.length?"":placeholder}
        onChange={e=>setDraft(e.target.value)} onKeyDown={onKey}
        onFocus={()=>setF(true)} onBlur={()=>{setF(false);if(draft)add(draft);}}
        style={{flex:1,minWidth:120,height:28,border:"none",outline:"none",fontSize:14,
          fontFamily:"var(--font)",color:"#1F1F1F",background:"transparent"}}/>
    </div>
  );
}

    <div style={{display:"flex",flexDirection:"column",gap:10}}>
      {topics.map(t=>(

  const pad=isWide?"24px 32px":"16px 20px";
  const formCols=windowWidth>=768?"minmax(0,1fr) minmax(0,1fr)":"minmax(0,1fr)";
  const localeParts=(project?.locale||"").split("/").map(s=>s.trim());

  /* 帶入該專案已有設定 */
  const name=project?.name||"";
  const domain=project?.domain||"";
  const customer=project?.customer||"";
  const region=project?.region||localeParts[0]||"TW";
  const lang=project?.lang||localeParts[1]||"zh-TW";
  const alias=project?.alias||"";
  const brands=project?.competitors||["善存","DHC","GNC"];

  /* 第一步設定欄位（帶入專案已有設定） */
  const [genProvider,setGenProvider]=useState("Gemini");
  const [runProvider,setRunProvider]=useState("Gemini");
  const [keywords,setKeywords]=useState("維他命, 益生菌, 保健食品, 綜合維他命");
  const [topics,setTopics]=useState([
    {id:"t1",name:"產品採購",desc:"B2B 採購決策相關查詢"},
    {id:"t2",name:"規格比較",desc:"競品規格與價格比較"},
  ]);
  const [marketType,setMarketType]=useState("B2B 採購");
  const [maxQueries,setMaxQueries]=useState("8");
  const [audience,setAudience]=useState("B2B 採購");
  const [audienceDesc,setAudienceDesc]=useState("正在評估供應商、產品規格與導入風險的採購或決策者");
  const [intentCat,setIntentCat]=useState("商業評估");
  const [intentDesc,setIntentDesc]=useState("比較供應商、產品方案或導入條件");
  const [mentionBrand,setMentionBrand]=useState(true);
  const [mentionCompetitor,setMentionCompetitor]=useState(true);

  const card={background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,overflow:"hidden"};
  const cardHead={padding:"16px 24px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between"};
  const cardTitle={fontSize:15,fontWeight:600,color:"#1F1F1F"};

  /* 兩步驟：1=設定 / 2=結果清單 */
  const [step,setStep]=useState(1);

  /* 第二步結果清單（附件 8 筆示意），checked 記錄勾選 */
  const [results,setResults]=useState(QS_RESULTS);
  const [showEmptyAlert,setShowEmptyAlert]=useState(false);
  const allChecked=results.length>0&&results.every(r=>r.checked);
  const someChecked=results.some(r=>r.checked);
  const selectedCount=results.filter(r=>r.checked).length;
  const toggleAll=()=>setResults(rs=>rs.map(r=>({...r,checked:!allChecked})));
  const toggleOne=(id)=>setResults(rs=>rs.map(r=>r.id===id?{...r,checked:!r.checked}:r));
  const handleConfirm=()=>{
    if(selectedCount===0){ setShowEmptyAlert(true); return; }
    onConfirm&&onConfirm();
  };

  const locale=`${region}/${lang}`;

  return(
    <main style={{padding:pad,background:"var(--bg-page)",minHeight:"calc(100vh - 56px)"}}>
      <div style={{maxWidth:1200,margin:"0 auto"}}>

        {/* Page Header */}
        <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:20}}>
          <div onClick={()=>step===2?setStep(1):onBack()} title="返回"
            style={{width:36,height:36,borderRadius:8,border:"1px solid #D9D9D9",background:"#fff",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}
            onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
            <FI name="chevron-right" size={16} color="#595959" style={{transform:"rotate(180deg)"}}/>
          </div>
          <div style={{minWidth:0}}>
            <h1 style={{fontSize:20,fontWeight:600,margin:0,color:"var(--fg)",lineHeight:"28px"}}>Query Search</h1>
            <p style={{fontSize:13,color:"var(--fg-3)",margin:"4px 0 0",lineHeight:"20px"}}>{name?`專案：${name}`:"設定並生成 Query"}</p>
          </div>
          <div style={{flex:1}}/>
          {step===1 ? (
            <>
              <Btn variant="secondary" onClick={onBack}>返回</Btn>
              <Btn variant="primary" onClick={()=>setStep(2)}>執行 Query Search</Btn>
            </>
          ) : (
            <>
              <Btn variant="secondary" onClick={()=>setStep(1)}>返回</Btn>
              <Btn variant="primary" onClick={handleConfirm}>確認生成 Query</Btn>
            </>
          )}
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:16}}>

        {step===1 && (<>


            {/* ① 品牌基本資料（唯讀，回顯步驟1） */}
            <div style={card}>
              <div style={cardHead}><span style={cardTitle}>品牌基本資料</span></div>
              <div style={{padding:24,display:"grid",gridTemplateColumns:formCols,gap:"20px 24px"}}>
                <ReadField label="Project 名稱" half value={name}/>
                <ReadField label="網址/網域" half value={domain}/>
                <ReadField label="客戶" half value={customer}/>
                <ReadField label="地區" half value={region}/>
                <ReadField label="語系" half value={lang}/>
                <ReadField label="別名" half value={alias}/>
                <ReadField label="競品">
                  {brands.length
                    ? <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                        {brands.map(b=>(
                          <span key={b} style={{display:"inline-flex",alignItems:"center",height:26,padding:"0 10px",
                            background:"#F5F7F8",border:"1px solid #E7EAEC",borderRadius:6,fontSize:13,color:"#1F1F1F"}}>{b}</span>
                        ))}
                      </div>
                    : <div style={{fontSize:14,color:"#BFBFBF"}}>—</div>}
                </ReadField>
              </div>
            </div>

            {/* ② Provider */}
            <div style={card}>
              <div style={cardHead}><span style={cardTitle}>Provider</span></div>
              <div style={{padding:24,display:"grid",gridTemplateColumns:formCols,gap:"20px 24px"}}>
                <FField label="Research / Generation Provider" half>
                  <Select value={genProvider} onChange={setGenProvider} options={PROVIDER_OPTIONS}/>
                </FField>
                <FField label="Run Provider" half>
                  <Select value={runProvider} onChange={setRunProvider} options={PROVIDER_OPTIONS}/>
                </FField>
              </div>
            </div>

            {/* ③ Keywords */}
            <div style={card}>
              <div style={cardHead}>
                <span style={cardTitle}>Keywords</span>
                <Btn variant="secondary" size="sm"><FI name="sparkles" size={14} color="#0A2B41"/>AI生成</Btn>
              </div>
              <div style={{padding:24}}>
                <TextArea rows={5} value={keywords} onChange={setKeywords} placeholder="一行一個 keyword"/>
                <div style={{fontSize:12,color:"#8C8C8C",marginTop:6}}>一行一個 keyword，或用 AI 依專案資料自動生成。</div>
              </div>
            </div>

            {/* ④ Topics */}
            <div style={card}>
              <div style={cardHead}>
                <span style={cardTitle}>Topics</span>
                <div style={{display:"flex",gap:8}}>
                  <Btn variant="secondary" size="sm"><FI name="sparkles" size={14} color="#0A2B41"/>AI生成</Btn>
                  <Btn variant="secondary" size="sm" onClick={()=>setTopics([...topics,{id:"t"+Date.now(),name:"",desc:""}])}>新增 Topic</Btn>
                </div>
              </div>
              <div style={{padding:24}}>
                <TopicsList topics={topics} onChange={setTopics}/>
              </div>
            </div>

            {/* ⑤ 市場與受眾 */}
            <div style={card}>
              <div style={cardHead}><span style={cardTitle}>市場與受眾</span></div>
              <div style={{padding:24,display:"grid",gridTemplateColumns:formCols,gap:"20px 24px"}}>
                <FField label="Market Type" half>
                  <Select value={marketType} onChange={setMarketType} options={MARKET_OPTIONS}/>
                </FField>
                <FField label="Max Queries" half>
                  <Txt placeholder="8" value={maxQueries} onChange={setMaxQueries}/>
                </FField>
                <FField label="Audience" half>
                  <Txt placeholder="例如 B2B 採購" value={audience} onChange={setAudience}/>
                </FField>
                <FField label="Audience Description" half>
                  <Txt placeholder="描述目標受眾" value={audienceDesc} onChange={setAudienceDesc}/>
                </FField>
              </div>
            </div>

            {/* ⑥ Intent 與提及規則 */}
            <div style={card}>
              <div style={cardHead}><span style={cardTitle}>Intent 與提及規則</span></div>
              <div style={{padding:24,display:"grid",gridTemplateColumns:formCols,gap:"20px 24px"}}>
                <FField label="Intent 分類" half>
                  <Select value={intentCat} onChange={setIntentCat} options={INTENT_CAT_OPTIONS}/>
                </FField>
                <FField label="Intent 描述" half>
                  <Txt placeholder="描述 intent" value={intentDesc} onChange={setIntentDesc}/>
                </FField>
              </div>
            </div>

            {/* ⑦ 提示詞風格 */}
            <div style={card}>
              <div style={cardHead}><span style={cardTitle}>提示詞風格</span></div>
              <div style={{padding:"8px 24px"}}>
                {[
                  {on:mentionBrand,set:setMentionBrand,title:"提及自身品牌",desc:"生成的 query 需包含自家品牌名稱"},
                  {on:mentionCompetitor,set:setMentionCompetitor,title:"提及競品",desc:"生成的 query 需包含競爭品牌名稱"},
                ].map((r,i)=>(
                  <div key={r.title} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,
                    padding:"16px 0",borderTop:i>0?"1px solid #F0F0F0":"none"}}>
                    <div style={{minWidth:0}}>
                      <div style={{fontSize:14,fontWeight:500,color:"#1F1F1F",marginBottom:2}}>{r.title}</div>
                      <div style={{fontSize:12,color:"#8C8C8C"}}>{r.desc}</div>
                    </div>
                    <Toggle checked={r.on} onChange={r.set}/>
                  </div>
                ))}
              </div>
            </div>


        </>)}

        {step===2 && (
          <div style={card}>
            {/* 卡片標題列：生成結果 | 已選計數 + 重新生成 */}
            <div style={cardHead}>
              <span style={cardTitle}>生成結果</span>
              <div style={{display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:13,color:"var(--fg-3)"}}>已選 {selectedCount} / {results.length}</span>
                <Btn variant="secondary" size="sm">重新生成</Btn>
              </div>
            </div>
            {/* 表頭列：全選 + 欄位名稱 Query list（灰底） */}
            <div style={{display:"flex",alignItems:"center",gap:12,padding:"10px 24px",
              background:"#FAFAFA",borderBottom:"1px solid #F0F0F0"}}>
              <Cb checked={allChecked} indeterminate={someChecked&&!allChecked} onChange={toggleAll}/>
              <span style={{fontSize:12,fontWeight:500,color:"var(--fg-3)"}}>Query list</span>
            </div>
            {/* 資料列 */}
            <div>
              {results.map((r,i)=>(
                <div key={r.id} onClick={()=>toggleOne(r.id)}
                  style={{display:"flex",alignItems:"flex-start",gap:12,padding:"14px 24px",cursor:"pointer",
                    borderBottom:i===results.length-1?"none":"1px solid #F0F0F0",
                    background:r.checked?"#E6F4FF":"#fff",transition:"background .1s"}}>
                  <div style={{marginTop:2}}>
                    <Cb checked={r.checked} onChange={()=>toggleOne(r.id)}/>
                  </div>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:500,color:"#1F1F1F",lineHeight:"20px"}}>{r.query}</div>
                    <div style={{fontSize:12,color:"#8C8C8C",marginTop:2}}>{locale}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        </div>
      </div>

      {/* 未勾選提示彈窗 */}
      {showEmptyAlert && (
        <ConfirmDialog single confirmLabel="我知道了"
          title="尚未選擇 Query"
          message="請至少勾選一筆 Query，再進行生成。"
          onCancel={()=>setShowEmptyAlert(false)}/>
      )}
    </main>
  );
}

/* ══════════════════════════════════════════════════════════
   GEO PROJECTS PAGE
══════════════════════════════════════════════════════════ */
function GeoProjectsPage({windowWidth,onEdit,projects,setProjects}){
  const isWide=windowWidth>=1024;
  const pad=isWide?"24px 32px":"16px 20px";

  /* state（projects 由 App 提供，供編輯頁儲存回寫共享同一份資料） */
  const [search,setSearch]=useState("");
  const [page,setPage]=useState(1);
  const PER=10;
  /* 列表高度：依 DESIGN.md 版型，頁面隨內容自然增高、由整頁捲動
     （main 已有 minHeight:calc(100vh-56px) 保底一屏），不將表格框成固定高 */

  /* drawer */
  const [drawerOpen,setDrawerOpen]=useState(false);
  const [editing,setEditing]=useState(null);
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [archiveTarget,setArchiveTarget]=useState(null);  /* 下架確認 */
  const handleUpdate=(upd)=>{ setProjects(prev=>prev.map(p=>p.id===upd.id?upd:p)); };
  const confirmDelete=()=>{ if(deleteTarget){ setProjects(prev=>prev.filter(p=>p.id!==deleteTarget.id)); setDeleteTarget(null); } };
  /* 下架 = 狀態改 archived（可復原、資料保留），非刪除 */
  const confirmArchive=()=>{ if(archiveTarget){ setProjects(prev=>prev.map(p=>p.id===archiveTarget.id?{...p,status:"archived"}:p)); setArchiveTarget(null); } };
  const handleQuerySearch=(pr)=>{ /* Query Search 連結後續處理 */ };
  const handleCreate=(newProj)=>{
    setProjects(prev=>[newProj,...prev]);
    setPage(1);
  };

  /* filters (each Multi-Dropdown owns its own array) */
  const [fStatus,setFStatus]=useState([]);
  const [fLocale,setFLocale]=useState([]);
  const [fCustomer,setFCustomer]=useState([]);

  /* reset to page 1 when any filter/search changes */
  const updateFilter=(setter)=>(v)=>{setter(v);setPage(1);};

  /* derive option lists */
  const localeOf=l=>l.split(" ")[0];
  const ALL_STATUS  =["active","paused","archived"];
  const ALL_LOCALES =[...new Set(projects.map(p=>localeOf(p.locale)))];
  const ALL_CUSTOMERS=[...new Set(projects.map(p=>p.customer))].sort();

  /* filter projects */
  const filtered=projects.filter(p=>{
    const q=search.toLowerCase();
    if(q&&!p.name.toLowerCase().includes(q)&&!p.slug.toLowerCase().includes(q)&&!p.customer.toLowerCase().includes(q)) return false;
    if(fStatus.length&&!fStatus.includes(p.status)) return false;
    if(fLocale.length&&!fLocale.includes(localeOf(p.locale))) return false;
    if(fCustomer.length&&!fCustomer.includes(p.customer)) return false;
    return true;
  });
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER));
  const pageRows=filtered.slice((page-1)*PER,page*PER);

  /* clear all */
  const totalActive=fStatus.length+fLocale.length+fCustomer.length;
  const hasFilters=totalActive>0||search;
  const clearAll=()=>{
    setFStatus([]);setFLocale([]);setFCustomer([]);setSearch("");setPage(1);
  };

  return(
    <main style={{padding:pad,background:"var(--bg-page)",minHeight:"calc(100vh - 56px)"}}>
      <div style={{maxWidth:1200,margin:"0 auto"}}>

        {/* Page Header */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,marginBottom:20,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:200}}>
            <h1 style={{fontSize:20,fontWeight:600,margin:0,color:"var(--fg)",lineHeight:"28px"}}>Projects</h1>
            <p style={{fontSize:13,color:"var(--fg-3)",margin:"4px 0 0",lineHeight:"20px"}}>
              管理 GEO 分析的專案，含 locale、預算與狀態
            </p>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap"}}>
            <Btn variant="primary" onClick={()=>onEdit&&onEdit(null)}>
              <FI name="plus" size={14} color="#fff"/>新增專案
            </Btn>
          </div>
        </div>

        {/* Projects Card — 高度隨內容，整頁捲動 */}
        <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,overflow:"hidden"}}>

          {/* Toolbar — 搜尋 + 篩選；右側顯示筆數（參 younilab 頁面範本） */}
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:"1px solid #F0F0F0",flexWrap:"wrap"}}>
            {/* Search */}
            <div style={{position:"relative",width:220,flexShrink:0}}>
              <div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
                <FI name="search" size={14} color="#BFBFBF"/>
              </div>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}
                placeholder="搜尋專案、客戶…"
                style={{width:"100%",height:40,padding:"0 12px 0 34px",fontSize:14,color:"#1F1F1F",border:"1px solid #D9D9D9",borderRadius:8,outline:"none",background:"#fff",fontFamily:"var(--font)"}}
                onFocus={e=>e.target.style.borderColor="#0A2B41"} onBlur={e=>e.target.style.borderColor="#D9D9D9"}/>
            </div>
            {/* 3 Multi-Dropdowns */}
            <MultiDropdown label="狀態" options={ALL_STATUS}    selected={fStatus}   onChange={updateFilter(setFStatus)} optionLabel={v=>STATUS_LABEL[v]||v}/>
            <MultiDropdown label="地區" options={ALL_LOCALES}   selected={fLocale}   onChange={updateFilter(setFLocale)}/>
            <MultiDropdown label="客戶" options={ALL_CUSTOMERS} selected={fCustomer} onChange={updateFilter(setFCustomer)} searchable/>
            {/* Clear all */}
            {hasFilters&&(
              <span onClick={clearAll}
                style={{fontSize:13,color:"#8C8C8C",cursor:"pointer",marginLeft:4,transition:"color .12s"}}
                onMouseEnter={e=>e.currentTarget.style.color="#1F1F1F"}
                onMouseLeave={e=>e.currentTarget.style.color="#8C8C8C"}>
                清除全部
              </span>
            )}
            {/* 右側筆數 */}
            <div style={{flex:1}}/>
            <span style={{fontSize:13,color:"var(--fg-3)",flexShrink:0}}>共 {filtered.length} 筆</span>
          </div>

          {/* Table — flex:1 撐滿、內部捲動；表頭 sticky 凍結 */}
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:14,minWidth:920}}>
              <thead>
                <tr>
                  {[
                    {l:"Project", a:"left"},
                    {l:"客戶",    a:"left"},
                    {l:"地區",    a:"left"},
                    {l:"預算",    a:"right"},
                    {l:"狀態",    a:"left"},
                    {l:"操作",   a:"right", sticky:true},
                  ].map((h,i)=>(
                    /* Header row — 灰底；操作欄橫向凍結 */
                    <th key={i} style={{
                      textAlign:h.a,padding:"10px 16px",
                      fontWeight:500,color:"var(--fg-3)",fontSize:12,
                      borderBottom:"1px solid #F0F0F0",whiteSpace:"nowrap",
                      background:"#FAFAFA",
                      ...(h.sticky?{position:"sticky",right:0,zIndex:2,boxShadow:"-4px 0 8px -4px rgba(0,0,0,0.06)"}:{})
                    }}>
                      {h.l}
                    </th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {pageRows.length>0
                  ? pageRows.map((p,i)=>(
                      <ProjectRow key={p.id} project={p} isLast={i===pageRows.length-1} onEdit={(pr)=>onEdit&&onEdit(pr)} onQuerySearch={handleQuerySearch} onArchive={(pr)=>setArchiveTarget(pr)}/>
                    ))
                  : (
                    <tr><td colSpan={6} style={{padding:"56px 24px",textAlign:"center"}}>
                      <FI name="users" size={32} color="#D9D9D9" style={{margin:"0 auto 12px"}}/>
                      <div style={{fontSize:14,fontWeight:600,color:"var(--fg)",marginBottom:8}}>找不到符合條件的專案</div>
                      <div style={{fontSize:13,color:"var(--fg-3)",marginBottom:16}}>試試調整關鍵字或清除篩選條件</div>
                      <button onClick={clearAll}
                        style={{height:32,padding:"0 12px",borderRadius:8,border:"1px solid #D9D9D9",background:"#fff",color:"#595959",fontSize:13,fontFamily:"var(--font)",cursor:"pointer"}}>
                        清除所有篩選
                      </button>
                    </td></tr>
                  )
                }
              </tbody>
            </table>
          </div>

          {/* Pagination — 固定貼底 */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderTop:"1px solid #F0F0F0",flexWrap:"wrap",gap:8,flexShrink:0}}>
            <span style={{fontSize:13,color:"var(--fg-3)"}}>
              顯示 {filtered.length===0?0:(page-1)*PER+1}–{Math.min(page*PER,filtered.length)}，共 {filtered.length} 筆
            </span>
            <div style={{display:"flex",gap:4}}>
              <div onClick={()=>page>1&&setPage(p=>p-1)}
                style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:page>1?"pointer":"default",color:page>1?"#595959":"#D9D9D9",border:"1px solid "+(page>1?"#D9D9D9":"#F0F0F0")}}>‹</div>
              {Array.from({length:totalPages},(_,i)=>i+1).map(p=>(
                <div key={p} onClick={()=>setPage(p)}
                  style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:"pointer",background:p===page?"var(--primary)":"transparent",color:p===page?"#fff":"#595959",border:p===page?"none":"1px solid #D9D9D9"}}>
                  {p}
                </div>
              ))}
              <div onClick={()=>page<totalPages&&setPage(p=>p+1)}
                style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:page<totalPages?"pointer":"default",color:page<totalPages?"#595959":"#D9D9D9",border:"1px solid "+(page<totalPages?"#D9D9D9":"#F0F0F0")}}>›</div>
            </div>
          </div>
        </div>

      </div>

      {/* ── New Project Drawer ── */}
      <ProjectDrawer
        open={drawerOpen}
        editing={editing}
        onClose={()=>{setDrawerOpen(false);setEditing(null);}}
        onCreate={handleCreate}
        onUpdate={handleUpdate}
      />
      {deleteTarget&&(
        <ConfirmDialog
          title="刪除 Project"
          message={`確定要刪除「${deleteTarget.name}」嗎？此操作無法復原。`}
          onCancel={()=>setDeleteTarget(null)}
          onConfirm={confirmDelete}/>
      )}
      {archiveTarget&&(
        <ConfirmDialog
          title="下架 Project"
          message={`確定要下架「${archiveTarget.name}」嗎？下架後狀態將轉為「已下架」，資料仍會保留，可再重新啟用。`}
          confirmLabel="確定下架"
          onCancel={()=>setArchiveTarget(null)}
          onConfirm={confirmArchive}/>
      )}
    </main>
  );
}

function PlaceholderPage({label,windowWidth}){
  return(
    <main style={{padding:windowWidth>=1024?"24px 32px":"16px 20px",background:"var(--bg-page)",minHeight:"calc(100vh - 56px)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{maxWidth:1200,margin:"0 auto",textAlign:"center"}}>
        <div style={{width:64,height:64,borderRadius:16,background:"#E7EAEC",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px"}}>
          <FI name="grid" size={28} color="#8C8C8C"/>
        </div>
        <h2 style={{fontSize:18,fontWeight:600,color:"var(--fg)",margin:"0 0 8px"}}>{label}</h2>
        <p style={{fontSize:13,color:"var(--fg-3)",margin:0}}>此頁面正在開發中</p>
      </div>
    </main>
  );
}

/* ══════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════ */
function App(){
  const [activeId,setActiveId]=useState("geo-projects");
  /* nav group expanded state */
  const [expanded,setExpanded]=useState({geo:true});
  const [collapsed,setCollapsed]=useState(false);
  const [drawerOpen,setDrawer]=useState(false);
  const [userMenu,setUserMenu]=useState(false);
  const [searchOpen,setSearchOpen]=useState(false);
  const [ww,setWw]=useState(window.innerWidth);

  /* 由 URL ?id 帶入該專案設定 */
  const editId=new URLSearchParams(window.location.search).get("id");
  const editingProject=editId?(PROJECTS_DATA.find(p=>p.id===editId)||null):null;
  const backToList=()=>{ window.location.href="kinsan-Projects.html"; };
  const toOverview=()=>{ window.location.href="kinsan-Overview.html"; };

  useEffect(()=>{
    const f=()=>{
      const w=window.innerWidth;
      setWw(w);
      if(w>=1024){setCollapsed(false);setDrawer(false);}
      else if(w>=768){setCollapsed(true);setDrawer(false);}
      else{setDrawer(false);}
    };
    f();
    window.addEventListener("resize",f);
    return()=>window.removeEventListener("resize",f);
  },[]);

  const isMobile=ww<768;
  const isDrawerMode=isMobile;
  const sw=isDrawerMode?0:(collapsed?56:240);

  const onSelect=id=>{
    const GEO_LINKS={"geo-overview":"kinsan-Overview.html","geo-projects":"kinsan-Projects.html","geo-query-search":"kinsan-Query-Search.html"};
    if(GEO_LINKS[id]){ window.location.href=GEO_LINKS[id]; return; }
    setActiveId(id);setUserMenu(false);if(isDrawerMode)setDrawer(false);};
  const onToggle=id=>setExpanded(e=>({...e,[id]:!e[id]}));
  /* 麵包屑：… / Projects / Query Search */
  const crumbs=[...(CRUMBS["geo-projects"]||["Projects"]), "Query Search"];

  const renderPage=()=>(
    <QuerySearchPage windowWidth={ww} project={editingProject}
      onBack={backToList} onConfirm={toOverview}/>
  );

  /* Sidebar inner */
  const SidebarContent=()=>(
    <>
      {/* Logo area — 56px per spec, logo hidden when collapsed */}
      <div style={{height:56,padding:"0 14px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        {(!collapsed||isDrawerMode)&&<KinsanLogo/>}
        {/* Toggle — 28×28, centered when collapsed per spec */}
        {!isDrawerMode&&(
          <div onClick={()=>setCollapsed(c=>!c)} title={collapsed?"展開":"收合"}
            style={{width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,marginLeft:collapsed?"auto":0,marginRight:collapsed?"auto":0}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            {/* sidebar icon: 18px per spec */}
            <FI name="sidebar" size={18} color="#8C8C8C"/>
          </div>
        )}
        {isDrawerMode&&(
          <div onClick={()=>setDrawer(false)}
            style={{width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="x" size={18} color="#8C8C8C"/>
          </div>
        )}
      </div>
      {/* Nav — 12px top padding */}
      <nav style={{flex:1,padding:"12px 0",overflowY:"auto",overflowX:"hidden"}}>
        {NAV.map((item,i)=>(
          <NavItem key={item.id||item.label||i} item={item}
            activeId={activeId} onSelect={onSelect}
            collapsed={collapsed&&!isDrawerMode}
            expanded={expanded} onToggle={onToggle}/>
        ))}
      </nav>
    </>
  );

  return(
    <div>
      {/* Drawer overlay */}
      {isDrawerMode&&drawerOpen&&(
        <div onClick={()=>setDrawer(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:199}}/>
      )}

      {/* Sidebar */}
      {isDrawerMode?(
        <aside style={{width:240,background:"#fff",borderRight:"1px solid #E7EAEC",position:"fixed",top:0,left:0,bottom:0,display:"flex",flexDirection:"column",zIndex:200,transform:drawerOpen?"translateX(0)":"translateX(-100%)",transition:"transform 250ms ease",overflowY:"auto",overflowX:"hidden"}}>
          <SidebarContent/>
        </aside>
      ):(
        <aside style={{width:collapsed?56:240,background:"#fff",borderRight:"1px solid #E7EAEC",position:"fixed",top:0,left:0,bottom:0,display:"flex",flexDirection:"column",zIndex:100,transition:"width 200ms ease",overflowY:"auto",overflowX:"hidden"}}>
          <SidebarContent/>
        </aside>
      )}

      {/* Main */}
      <div style={{marginLeft:sw,transition:"margin-left 200ms ease",minHeight:"100vh"}}>

        {/* Top Header — 56px sticky per spec */}
        <header style={{height:56,background:"#fff",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",padding:"0 16px",gap:8,position:"sticky",top:0,zIndex:50}}>
          {/* Hamburger — mobile only */}
          {isDrawerMode&&(
            <div onClick={()=>setDrawer(o=>!o)}
              style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}
              onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <FI name="menu" size={18} color="#595959"/>
            </div>
          )}

          {/* Breadcrumbs — 14px per spec, separator #8C8C8C */}
          <nav style={{flex:1,display:"flex",alignItems:"center",gap:8,fontSize:14,overflow:"hidden",minWidth:0}}>
            {crumbs.map((c,i)=>(
              <React.Fragment key={i}>
                {i>0&&<span style={{color:"#8C8C8C",flexShrink:0,fontSize:14}}>/</span>}
                <span style={{
                  color:i===crumbs.length-1?"var(--fg)":"var(--fg-3)",
                  fontWeight:i===crumbs.length-1?500:400,
                  whiteSpace:"nowrap",
                  overflow:i===crumbs.length-1?"hidden":"visible",
                  textOverflow:"ellipsis",fontSize:14,
                }}>{c}</span>
              </React.Fragment>
            ))}
          </nav>

          {/* Right: search, bell, divider, avatar — per spec order */}
          <IconBtn name="search" title="搜尋 ⌘K" onClick={()=>setSearchOpen(true)}/>
          <IconBtn name="bell"   title="通知" badge/>
          <div style={{width:1,height:20,background:"#F0F0F0",margin:"0 2px",flexShrink:0}}/>

          {/* User menu */}
          <div onClick={()=>setUserMenu(o=>!o)}
            style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",position:"relative",flexShrink:0}}>
            <Avatar initials="S" size={28} bg="#0A2B41"/>
            {ww>=640&&<FI name="chevron-down" size={13} color="#8C8C8C"/>}
            {userMenu&&(
              <>
                <div onClick={e=>{e.stopPropagation();setUserMenu(false);}} style={{position:"fixed",inset:0,zIndex:99}}/>
                <div style={{position:"absolute",top:40,right:0,width:200,background:"#fff",border:"1px solid #F0F0F0",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.08)",padding:6,zIndex:100}}>
                  <div style={{padding:"8px 10px",borderBottom:"1px solid #F0F0F0",marginBottom:4}}>
                    <div style={{fontSize:13,fontWeight:600}}>金三 顧問</div>
                    <div style={{fontSize:11,color:"#8C8C8C"}}>kinsan@example.com</div>
                  </div>
                  {[["user","個人設定"],["settings","帳號設定"],["log-out","登出"]].map(([ic,lbl])=>(
                    <div key={lbl} onClick={()=>setUserMenu(false)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:6,cursor:"pointer",fontSize:13,color:"#595959"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <FI name={ic} size={14} color="#8C8C8C"/>{lbl}
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </header>

        {/* 全域搜尋 popup（Command Palette，靜態示意） */}
        {searchOpen&&(
          <React.Fragment>
            <div onClick={()=>setSearchOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300}}/>
            <div style={{position:"fixed",top:"18vh",left:"50%",transform:"translateX(-50%)",width:560,maxWidth:"92vw",background:"#fff",
              borderRadius:12,boxShadow:"0 16px 48px rgba(0,0,0,0.18)",zIndex:301,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid #F0F0F0"}}>
                <FI name="search" size={18} color="#8C8C8C"/>
                <input autoFocus placeholder="搜尋專案、客戶、報表…"
                  style={{flex:1,border:"none",outline:"none",fontSize:15,fontFamily:"var(--font)",color:"#1F1F1F"}}
                  onKeyDown={e=>{if(e.key==="Escape")setSearchOpen(false);}}/>
                <kbd style={{fontSize:11,color:"#8C8C8C",background:"#F5F5F5",border:"1px solid #E7EAEC",borderRadius:4,padding:"2px 6px"}}>Esc</kbd>
              </div>
              <div style={{padding:8,maxHeight:"48vh",overflowY:"auto"}}>
                <div style={{fontSize:11,fontWeight:600,color:"#8C8C8C",padding:"6px 10px 4px",letterSpacing:"0.04em"}}>專案</div>
                {["品牌 GEO 追蹤","電商關鍵字監測","競品分析專案"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="folder" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
                <div style={{fontSize:11,fontWeight:600,color:"#8C8C8C",padding:"10px 10px 4px",letterSpacing:"0.04em"}}>客戶</div>
                {["Acme 電商","未來科技"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="briefcase" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
              </div>
            </div>
          </React.Fragment>
        )}

        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
