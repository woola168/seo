/* ══════════════════════════════════════════════════════════
   NAV COMPONENTS — exactly per younilab-設計規範 Sidebar spec
   Icons: 20px for nav items per Iconography spec
   Active group: fontWeight 600, chevron #0A2B41
   Sub-item: padding 8px 16px (wider horizontal)
   Section header: padding-top 20px
══════════════════════════════════════════════════════════ */
function NavSection({label}){
  return <div style={{fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",color:"#BFBFBF",padding:"20px 16px 6px"}}>{label}</div>;
}

function NavItem({item,activeId,onSelect,collapsed,expanded,onToggle,sub=false}){
  const [hov,setHov] = useState(false);

  /* active: direct match OR any child matches */
  const isActive = activeId===item.id
    || (item.children&&item.children.some(c=>c.id===activeId));
  const isExp = expanded[item.id];

  if(item.type==="section") return collapsed ? null : <NavSection label={item.label}/>;

  const handleClick = () => {
    if(item.children) onToggle(item.id);
    else onSelect(item.id);
  };

  /* Colour + weight rules (per spec + Figma)
     Group 有子選單時：active 只改顏色/字重，背景保持透明 */
  const hasChildren = !!item.children;
  const fg       = isActive ? "#0A2B41" : "#595959";
  const iconCol  = isActive ? "#0A2B41" : "#8C8C8C";
  const bgCol    = isActive
    ? (hasChildren ? "transparent" : "#E7EAEC")  /* group = 無底色 */
    : hov ? "#FAFAFA" : "transparent";
  const fw       = isActive ? (hasChildren ? 600 : 500) : 400;

  return (
    <>
      <div onClick={handleClick}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        title={collapsed&&!sub ? item.label : undefined}
        style={{
          display:"flex", alignItems:"center",
          gap: (collapsed&&!sub) ? 0 : 8,
          /* Sub: 8px 16px / Parent: 10px 12px */
          padding: sub ? "8px 16px" : (collapsed ? "10px 0" : "10px 12px"),
          margin:"1px 8px", borderRadius:8, cursor:"pointer",
          justifyContent:(collapsed&&!sub)?"center":"flex-start",
          background: bgCol,
          color: fg,
          fontWeight: fw,
          /* Sub 13px / Parent 14px */
          fontSize: sub ? 13 : 14,
          transition:"all .12s",
          position:"relative",
        }}>
        {/* ── Icon: 20px for nav items per spec Iconography 尺寸階 ── */}
        {!sub && !collapsed && <FI name={item.icon} size={20} color={iconCol}/>}
        {!sub && collapsed  && <FI name={item.icon} size={20} color={iconCol}/>}
        {/* Sub-item: 前綴圓點 5×5 active #0A2B41 / default #BFBFBF / marginLeft 6px */}
        {sub && (
          <div style={{width:5,height:5,borderRadius:"50%",background:isActive?"#0A2B41":"#BFBFBF",marginLeft:6,flexShrink:0}}/>
        )}
        {!collapsed && <span style={{flex:1,whiteSpace:"nowrap"}}>{item.label}</span>}
        {/* Badge */}
        {!collapsed && !sub && item.badge && (
          <span style={{minWidth:18,height:18,borderRadius:9,background:item.badgeColor||"#F5222D",color:"#fff",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 5px",flexShrink:0}}>
            {item.badge}
          </span>
        )}
        {/* Badge dot (collapsed) */}
        {collapsed && !sub && item.badge && (
          <div style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:"50%",background:item.badgeColor||"#F5222D",border:"1.5px solid #fff"}}/>
        )}
        {/* Chevron — active group: #0A2B41, else #BFBFBF (per Figma) */}
        {!collapsed && item.children && (
          <FI name={isExp?"chevron-up":"chevron-right"} size={14}
            color={isActive?"#0A2B41":"#BFBFBF"}/>
        )}
      </div>
      {/* Children — paddingLeft:10 per spec */}
      {item.children && isExp && !collapsed && (
        <div style={{paddingLeft:10}}>
          {item.children.map(c=>(
            <NavItem key={c.id} item={{...c,type:"item",icon:""}} activeId={activeId}
              onSelect={onSelect} collapsed={false} expanded={{}} onToggle={()=>{}} sub/>
          ))}
        </div>
      )}
    </>
  );
}

/* Button — per spec sizes & variants */
function Btn({children,variant="primary",size="md",onClick,style={}}){
  const [hov,setHov]=useState(false);
  const h=size==="sm"?32:size==="lg"?44:40;
  const px=size==="sm"?12:size==="lg"?20:16;
  const fs=size==="sm"?12:size==="lg"?15:14;
  const base={height:h,padding:`0 ${px}px`,borderRadius:8,fontSize:fs,fontWeight:500,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,outline:"none",transition:"all .15s",whiteSpace:"nowrap",fontFamily:"var(--font)",border:"none"};
  const v={
    primary:  {border:"1px solid var(--primary)",background:hov?"var(--primary-hover)":"var(--primary)",color:"#fff"},
    secondary:{border:"1px solid var(--border)",background:hov?"var(--bg-2)":"#fff",color:"var(--fg)"},
    ghost:    {border:"1px solid transparent",background:hov?"var(--bg-2)":"transparent",color:"var(--fg-2)"},
  }[variant]||{};
  return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,...v,...style}}>{children}</button>;
}

/* ══════════════════════════════════════════════════════════
   BAR CHART — pure SVG per younilab-設計規範 Ch-Bar spec
   規格: VIZ_MAIN #1677FF, rx:4, barW ≤36 ~56% col
         水平 gridline 1px #F0F0F0, X-axis 11px #8C8C8C
         Y-axis ticks 11px #BFBFBF, tooltip #1F1F1F bg
   自適應: 透過 ResizeObserver 偵測容器尺寸，撐滿父層
══════════════════════════════════════════════════════════ */
function BarChart({data}){
  const [tip,setTip]=useState(null);
  const wrapRef=useRef(null);
  const [size,setSize]=useState({w:560,h:220});

  useEffect(()=>{
    if(!wrapRef.current) return;
    const ro=new ResizeObserver(entries=>{
      for(const e of entries){
        const{width,height}=e.contentRect;
        setSize({w:Math.max(280,width),h:Math.max(180,height)});
      }
    });
    ro.observe(wrapRef.current);
    return()=>ro.disconnect();
  },[]);

  const W=size.w,H=size.h;
  const pad={t:12,r:12,b:28,l:32};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const max=Math.ceil(Math.max(...data.map(d=>d.v))/5)*5||10;
  const ticks=Array.from({length:5},(_,i)=>Math.round(max*(i/4)));
  const bw=iw/data.length;
  const barW=Math.min(36,bw*0.56);
  const ypos=v=>pad.t+ih-(ih*v)/max;

  return(
    <div ref={wrapRef} style={{width:"100%",height:"100%",position:"relative"}}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}
        style={{display:"block",fontFamily:"var(--font)"}}>
        {/* Horizontal gridlines */}
        {ticks.map(t=>(
          <g key={t}>
            <line x1={pad.l} y1={ypos(t)} x2={W-pad.r} y2={ypos(t)} stroke="#F0F0F0" strokeWidth="1"/>
            <text x={pad.l-6} y={ypos(t)+4} textAnchor="end" fontSize="11" fill="#BFBFBF">{t}</text>
          </g>
        ))}
        {/* Bars */}
        {data.map((d,i)=>{
          const cx=pad.l+bw*i+bw/2;
          const bh=(ih*d.v)/max;
          return(
            <g key={i}
              onMouseEnter={()=>setTip({x:cx,y:ypos(d.v),v:d.v})}
              onMouseLeave={()=>setTip(null)}
              style={{cursor:"pointer"}}>
              <rect x={cx-barW/2} y={ypos(d.v)} width={barW} height={bh} rx="4" fill="var(--viz-main)"/>
              <text x={cx} y={H-8} textAnchor="middle" fontSize="11" fill="#8C8C8C">{d.d}</text>
            </g>
          );
        })}
        {/* Tooltip */}
        {tip&&(
          <g style={{pointerEvents:"none"}}>
            <rect x={tip.x-20} y={tip.y-30} width="40" height="22" rx="6" fill="#1F1F1F"/>
            <text x={tip.x} y={tip.y-15} textAnchor="middle" fontSize="11" fill="#fff" fontWeight="600">{tip.v}</text>
          </g>
        )}
      </svg>
    </div>
  );
}

/* 以篩選條件為 seed 的穩定偽隨機（同條件永遠同結果）*/
function seededRand(seed){
  let h=2166136261;
  for(let i=0;i<seed.length;i++){ h^=seed.charCodeAt(i); h=Math.imul(h,16777619); }
  return ()=>{ h+=0x6D2B79F5; let t=h; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; };
}

/* 依篩選條件生成資料 */
function genData(timeId,region,customRange,topics,platforms,metas){
  const opt=TIME_OPTIONS.find(t=>t.id===timeId)||TIME_OPTIONS[0];
  let days=opt.days;
  if(timeId==="custom"&&customRange.start&&customRange.end){
    days=Math.max(1,Math.round((new Date(customRange.end)-new Date(customRange.start))/86400000)+1);
  }
  const seed=timeId+"|"+region+"|"+(customRange.start||"")+(customRange.end||"")+"|"+topics.join(",")+"|"+platforms.join(",")+"|"+metas.join(",");
  const rnd=seededRand(seed);
  const regionFactor = region==="全部地區" ? 1 : (0.08 + rnd()*0.25);
  const topicFactor = topics.length===0 ? 1 : (topics.length/TOPIC_OPTIONS.length)*0.85+0.15;
  const platFactor  = platforms.length===0 ? 1 : (platforms.length/PLATFORM_OPTIONS.length)*0.8+0.2;
  const metaFactor  = metas.length===0 ? 1 : 0.55+rnd()*0.3;
  const filterFactor = regionFactor*topicFactor*platFactor*metaFactor;

  /* 標籤 */
  const labels=[];
  const base=new Date("2026-07-12");
  const showDaily = days<=14;
  const buckets = showDaily ? days : Math.ceil(days/7);
  for(let i=buckets-1;i>=0;i--){
    if(showDaily){
      const d=new Date(base); d.setDate(d.getDate()-i);
      labels.push((d.getMonth()+1)+"/"+d.getDate());
    } else {
      labels.push("第 "+(buckets-i)+" 週");
    }
  }

  /* 評價傾向 */
  const mult = showDaily ? 1 : 7;
  const pos=labels.map(()=>Math.round((20+rnd()*30)*mult*filterFactor));
  /* 負向：先定總量（≈20），再分配到各區間，避免累加放大 */
  const negTarget=Math.max(3,Math.round((16+rnd()*8)*filterFactor));
  const weights=labels.map(()=>rnd()<0.55?rnd()*0.3:rnd());
  const wSum=weights.reduce((a,b)=>a+b,0)||1;
  let allocated=0;
  const neg=weights.map((w,i)=>{
    if(i===weights.length-1) return Math.max(0,negTarget-allocated);
    const v=Math.round(negTarget*(w/wSum));
    allocated+=v;
    return v;
  });
  const posTotal=pos.reduce((a,b)=>a+b,0);
  const negTotal=neg.reduce((a,b)=>a+b,0);

  /* 能見度趨勢 */
  /* ⑤⑥ 只吃時間+地區（不吃主題/平台/Metadata）*/
  const trSeed=timeId+"|"+region+"|"+(customRange.start||"")+(customRange.end||"");
  const trRnd=seededRand(trSeed);
  const trFactor = region==="全部地區" ? 1 : (0.1+trRnd()*0.3);

  /* AI 流量表現（放大數值供 demo）*/
  const traffic=labels.map(()=>{
    const sessions=Math.round((180+trRnd()*520)*trFactor*(showDaily?1:5));
    const pct=+((0.8+trRnd()*2.4)*trFactor).toFixed(2);
    return {sessions,pct};
  });

  /* AI 平台分布 */
  const platformDist=AI_PLATFORMS.map(p=>{
    const jitter=(trRnd()-0.5)*8;
    return {...p, value:Math.max(2,Math.round(p.share+jitter))};
  });
  const pTotal=platformDist.reduce((a,b)=>a+b.value,0);
  platformDist.forEach(p=>{ p.pct=+((p.value/pTotal)*100).toFixed(1); });
  const totalSessions=traffic.reduce((a,t)=>a+t.sessions,0);

  /* 引用來源（依引用次數排序）*/
  const citations=CITATION_SOURCES.map(u=>{
    const cites=Math.round(8+trRnd()*38*trFactor);
    const queries=Math.max(1,Math.round(trRnd()*4));
    return {...u, cites, queries,
      rate:+(2+trRnd()*8).toFixed(1),
      share:+(0.8+trRnd()*3.2).toFixed(1),
      rivals:"n/a"};
  }).sort((a,b)=>b.cites-a.cites);

  /* 監控網址 */
  const monitored=MONITORED_URLS.map(u=>{
    const cites=Math.round(trRnd()*30*trFactor);
    const queries=Math.round(trRnd()*5);
    return {...u, cites, queries,
      rate:+(cites>0?(2+trRnd()*7):0).toFixed(1),
      share:+(cites>0?(0.4+trRnd()*2.6):0).toFixed(1),
      rivals:"n/a"};
  });

  const brands=BRAND_META.map((b,bi)=>{
    const bump=(rnd()-0.5)*(b.self?6:2);
    return {...b,data:labels.map(()=>Math.max(0.3,+(b.baseVis+bump+(rnd()-0.5)*(b.self?7:2)).toFixed(1)))};
  });
  const kpi={
    mention:Math.round(80*filterFactor*(days/7)),
    mentionTotal:Math.round(217*filterFactor*(days/7)),
    rank:+(1.0+rnd()*1.2).toFixed(1),
    vis:+(brands[0].data.reduce((a,b)=>a+b,0)/labels.length).toFixed(1),
    sov:+(50+rnd()*25).toFixed(1),
    citeShare:+(10+rnd()*12).toFixed(1),
    citeCount:Math.round(187*filterFactor*(days/7)),
    citePages:Math.round(297*filterFactor*(days/7)),
    avgCiteRate:+(4+rnd()*4).toFixed(1),
    competitorBest:+(1.0+rnd()*0.3).toFixed(1),
    industryAvg:+(9+rnd()*5).toFixed(1),
    secondSov:+(10+rnd()*6).toFixed(1),
  };
  return {labels,pos,neg,posTotal,negTotal,brands,kpi,showDaily,days,traffic,platformDist,totalSessions,citations,monitored,empty:posTotal+negTotal===0};
}



/* ─── 垂直準線 plugin（hover 時貫穿圖表的參考線）─── */
const crosshairPlugin={

    const active=chart.tooltip?._active;
    if(!active||!active.length) return;
    const {ctx,chartArea}=chart;
    const x=active[0].element.x;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x,chartArea.top);
    ctx.lineTo(x,chartArea.bottom);
    ctx.lineWidth=1;
    ctx.strokeStyle="#BFBFBF";
    ctx.stroke();
    ctx.restore();
  }
};

/* ─── 圖表漸層工具 ─── */
/* 垂直漸層（長條用）：上深下淺 */
function vGradient(ctx,area,deep,light,fallback){
  if(!area) return fallback||deep;
  const g=ctx.createLinearGradient(0,area.top,0,area.bottom);
  g.addColorStop(0,deep);
  g.addColorStop(1,light);
  return g;
}
/* 對角漸層（環圈每段用）：左上深、右下淺 */
function dGradient(ctx,area,deep,light,fallback){
  if(!area) return fallback||deep;
  const g=ctx.createLinearGradient(area.left,area.top,area.right,area.bottom);
  g.addColorStop(0,deep);
  g.addColorStop(1,light);
  return g;
}

/* ─── 日曆（完整月曆，支援區間選擇，對齊規範）─── */
function Calendar({start,end,onSelect}){
  const [view,setView]=useState(new Date("2026-07-01"));
  const y=view.getFullYear(), m=view.getMonth();
  const first=new Date(y,m,1).getDay();
  const daysInM=new Date(y,m+1,0).getDate();
  const today=new Date("2026-07-13");
  const fmt=(d)=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const cells=[];
  for(let i=0;i<first;i++) cells.push(null);
  for(let d=1;d<=daysInM;d++) cells.push(new Date(y,m,d));

  const inRange=(d)=>{
    if(!start||!end) return false;
    const s=new Date(start), e=new Date(end);
    return d>s&&d<e;
  };
  const isEdge=(d)=>{
    const ds=fmt(d);
    return ds===start||ds===end;
  };

  return(
    <div style={{width:280,background:"#fff",border:"1px solid #D9D9D9",borderRadius:12,padding:12,boxShadow:"0 4px 16px rgba(0,0,0,0.08)"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
        <div onClick={()=>setView(new Date(y,m-1,1))} aria-label="上個月"
          style={{width:28,height:28,border:"1px solid #E7EAEC",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
          <FI name="chevron-left" size={14} color="#595959"/>
        </div>
        <div style={{fontSize:14,fontWeight:600,color:"#1F1F1F"}}>{y} 年 {m+1} 月</div>
        <div onClick={()=>setView(new Date(y,m+1,1))} aria-label="下個月"
          style={{width:28,height:28,border:"1px solid #E7EAEC",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}>
          <FI name="chevron-right" size={14} color="#595959"/>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        {["日","一","二","三","四","五","六"].map(d=>(
          <div key={d} style={{height:24,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#BFBFBF"}}>{d}</div>
        ))}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2}}>
        {cells.map((d,i)=>{
          if(!d) return <div key={"e"+i} style={{height:32}}/>;
          const ds=fmt(d);
          const edge=isEdge(d);
          const mid=inRange(d);
          const isToday=fmt(today)===ds;
          return(
            <div key={ds} onClick={()=>onSelect(ds)}
              onMouseEnter={e=>{if(!edge&&!mid)e.currentTarget.style.background="#FAFAFA";}}
              onMouseLeave={e=>{if(!edge&&!mid)e.currentTarget.style.background="transparent";}}
              style={{height:32,display:"flex",alignItems:"center",justifyContent:"center",borderRadius:6,cursor:"pointer",fontSize:13,
                background:edge?"#0A2B41":(mid?"#E7EAEC":"transparent"),
                color:edge?"#fff":"#1F1F1F",
                fontWeight:(edge||isToday)?600:400,
                border:isToday&&!edge?"1px solid #0A2B41":"1px solid transparent",
                transition:"all .12s"}}>
              {d.getDate()}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ─── 自訂區間選擇器 ─── */
function DateRangePicker({range,onChange,onClose}){
  const [tmp,setTmp]=useState({start:range.start||"",end:range.end||""});
  const pick=(ds)=>{
    if(!tmp.start||(tmp.start&&tmp.end)) setTmp({start:ds,end:""});
    else if(ds<tmp.start) setTmp({start:ds,end:tmp.start});
    else setTmp({...tmp,end:ds});
  };
  return(
    <div style={{position:"absolute",top:"calc(100% + 4px)",left:0,zIndex:130}}>
      <div style={{background:"#fff",border:"1px solid #D9D9D9",borderRadius:12,padding:12,boxShadow:"0 4px 16px rgba(0,0,0,0.08)"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,fontSize:13}}>
          <div style={{flex:1,height:36,border:"1px solid #D9D9D9",borderRadius:8,display:"flex",alignItems:"center",padding:"0 10px",color:tmp.start?"#1F1F1F":"#BFBFBF"}}>
            {tmp.start||"開始日期"}
          </div>
          <span style={{color:"#8C8C8C"}}>至</span>
          <div style={{flex:1,height:36,border:"1px solid #D9D9D9",borderRadius:8,display:"flex",alignItems:"center",padding:"0 10px",color:tmp.end?"#1F1F1F":"#BFBFBF"}}>
            {tmp.end||"結束日期"}
          </div>
        </div>
        <Calendar start={tmp.start} end={tmp.end} onSelect={pick}/>
        <div style={{display:"flex",justifyContent:"flex-end",gap:8,marginTop:10}}>
          <button onClick={onClose}
            style={{height:32,padding:"0 12px",borderRadius:6,fontSize:13,fontFamily:"var(--font)",border:"1px solid #D9D9D9",background:"#fff",color:"#434343",cursor:"pointer"}}>取消</button>
          <button onClick={()=>{ if(tmp.start&&tmp.end){ onChange(tmp); onClose(); } }}
            disabled={!tmp.start||!tmp.end}
            style={{height:32,padding:"0 12px",borderRadius:6,fontSize:13,fontFamily:"var(--font)",border:"none",
              background:(tmp.start&&tmp.end)?"#0A2B41":"#D9D9D9",color:"#fff",cursor:(tmp.start&&tmp.end)?"pointer":"not-allowed"}}>套用</button>
        </div>
      </div>
    </div>
  );
}

/* ─── 能見度趨勢圖 ─── */
function TrendChart({data}){
  const ref=useRef(null);
  const inst=useRef(null);
  const [hidden,setHidden]=useState([]);

  useEffect(()=>{
    if(!window.Chart||!ref.current||data.empty) return;
    const shown=data.brands.filter((b,i)=>!hidden.includes(i));
    const maxV=Math.max(...shown.flatMap(b=>b.data),1);
    const maxY=Math.ceil(maxV*1.2/5)*5;
    if(inst.current) inst.current.destroy();
    inst.current=new window.Chart(ref.current,{
      type:"line",
      plugins:[crosshairPlugin],
      data:{labels:data.labels,datasets:shown.map(b=>({
        label:b.name,data:b.data,borderColor:b.color,backgroundColor:b.color,
        borderWidth:2.5,
        pointRadius:0,
        pointHoverRadius:5,
        pointBackgroundColor:b.color,pointBorderColor:b.color,
        pointHoverBackgroundColor:b.color,pointHoverBorderColor:b.color,pointHoverBorderWidth:0,
        pointHitRadius:10,
        tension:0.3
      }))},
      options:{responsive:true,maintainAspectRatio:false,
        interaction:{mode:"index",intersect:false,axis:"x"},
        plugins:{legend:{display:false},
          tooltip:{backgroundColor:"#1F1F1F",padding:12,cornerRadius:6,
            boxWidth:8,boxHeight:8,boxPadding:4,usePointStyle:true,
            titleFont:{size:12,weight:"600"},titleMarginBottom:8,
            bodyFont:{size:13},bodySpacing:6,
            callbacks:{
              title:(x)=>x[0].label,
              labelPointStyle:()=>({pointStyle:"circle",rotation:0}),
              label:(x)=>" "+x.dataset.label+"  "+x.raw+"%"}}},
        scales:{x:{ticks:{color:"#8C8C8C",font:{size:11},maxRotation:0,autoSkip:true,maxTicksLimit:10},grid:{display:false},border:{display:false}},
                y:{beginAtZero:true,max:maxY,ticks:{color:"#BFBFBF",font:{size:11},callback:(v)=>v+"%"},grid:{color:"#F0F0F0"},border:{display:false}}}}
    });
    return()=>{ if(inst.current) inst.current.destroy(); };
  },[hidden,data]);

  const toggle=(i)=>setHidden(prev=>{
    const next=prev.includes(i)?prev.filter(x=>x!==i):[...prev,i];
    return next.length===data.brands.length?prev:next;
  });

  return(
    <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,padding:"20px 24px"}}>
      <div style={{fontSize:16,fontWeight:600,color:"var(--fg)",marginBottom:3}}>能見度分數趨勢</div>
      <div style={{fontSize:13,color:"var(--fg-3)",marginBottom:14}}>點擊圖例可隱藏／顯示品牌，刻度會自動調整</div>
      {data.empty ? <EmptyState/> : (
        <>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
            {data.brands.map((b,i)=>{
              const off=hidden.includes(i);
              const avg=(b.data.reduce((a,x)=>a+x,0)/b.data.length).toFixed(1);
              return(
                <div key={b.name} onClick={()=>toggle(i)}
                  style={{display:"flex",alignItems:"center",gap:6,fontSize:12,padding:"5px 10px",cursor:"pointer",
                    border:"1px solid "+(off?"#F0F0F0":"#E7EAEC"),borderRadius:6,
                    background:off?"#FAFAFA":"#fff",color:off?"#BFBFBF":"#595959",
                    textDecoration:off?"line-through":"none",transition:"all .12s"}}>
                  <span style={{width:10,height:10,borderRadius:3,background:off?"#D9D9D9":b.color,flexShrink:0}}/>
                  {b.name} {avg}%
                </div>
              );
            })}
          </div>
          <div style={{position:"relative",width:"100%",height:250}}><canvas ref={ref}/></div>
        </>
      )}
    </div>
  );
}

         backgroundColor:(x)=>{const{ctx,chartArea}=x.chart; return vGradient(ctx,chartArea,"#D68C24","#FFE7BA","#FDB338");}});

  useEffect(()=>{
    if(!window.Chart||!ref.current) return;
    if(inst.current) inst.current.destroy();
    inst.current=new window.Chart(ref.current,{
      type:"bar",
      data:{labels:data.labels,datasets:[
        {data:data.traffic.map(t=>t.sessions),
         maxBarThickness:40,borderRadius:{topLeft:4,topRight:4},
         backgroundColor:(x)=>{const{ctx,chartArea}=x.chart; return vGradient(ctx,chartArea,"#1677FF","#BAE0FF","#69B1FF");}},

            titleFont:{size:12},bodyFont:{size:13},
            callbacks:{
              title:(x)=>x[0].label,
              label:(x)=>["AI 工作階段："+x.raw.toLocaleString(),
                          "佔總流量："+data.traffic[x.dataIndex].pct+"%"]}}},
        scales:{
          x:{ticks:{color:"#8C8C8C",font:{size:11},maxRotation:0,autoSkip:true,maxTicksLimit:10},grid:{display:false},border:{display:false}},
          y:{beginAtZero:true,ticks:{color:"#BFBFBF",font:{size:11},callback:(v)=>v.toLocaleString()},
             grid:{color:"#F0F0F0"},border:{display:false}},

/* ─── 網址表格（引用來源 / 監控網址 共用）─── */
function UrlTable({title,subtitle,rows:src,showTabs=true,showSearch=true}){
  const [view,setView]=useState("url");
  const [q,setQ]=useState("");

  const rows=useMemo(()=>{
    if(view==="url"){
      return src.filter(u=>{
        if(!q) return true;
        const s=q.toLowerCase();
        return u.title.toLowerCase().includes(s)||u.url.toLowerCase().includes(s)||u.tag.toLowerCase().includes(s);
      });
    }
    const map={};
    src.forEach(u=>{
      if(!map[u.domain]) map[u.domain]={domain:u.domain,cites:0,queries:0,rateSum:0,shareSum:0,n:0,type:u.type,tag:u.tag,mentioned:false,rivals:"n/a"};
      const g=map[u.domain];
      g.cites+=u.cites; g.queries+=u.queries; g.rateSum+=u.rate; g.shareSum+=u.share; g.n++;
      if(u.mentioned) g.mentioned=true;
    });
    return Object.values(map)
      .map(g=>({...g, rate:+(g.rateSum/g.n).toFixed(1), share:+(g.shareSum/g.n).toFixed(1)}))
      .sort((a,b)=>b.cites-a.cites)
      .filter(g=>!q||g.domain.toLowerCase().includes(q.toLowerCase()));
  },[view,q,src]);

  const Tab=({id,label})=>{
    const on=view===id;
    return(
      <div onClick={()=>setView(id)}
        style={{fontSize:13,padding:"6px 16px",borderRadius:6,cursor:"pointer",
          background:on?"#fff":"transparent",color:on?"#0A2B41":"#8C8C8C",fontWeight:on?500:400,
          boxShadow:on?"0 1px 2px rgba(0,0,0,0.06)":"none",transition:"all .12s",whiteSpace:"nowrap"}}>
        {label}
      </div>
    );
  };

  return(
    <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,padding:"20px 24px"}}>
      <div style={{fontSize:16,fontWeight:600,color:"var(--fg)",marginBottom:3}}>{title}</div>
      <div style={{fontSize:13,color:"var(--fg-3)",marginBottom:16}}>{subtitle}</div>

      {(showTabs||showSearch)&&(
        <div style={{display:"flex",alignItems:"center",justifyContent:showTabs?"space-between":"flex-end",gap:12,marginBottom:16,flexWrap:"wrap"}}>
          {showTabs&&(
            <div style={{display:"flex",gap:2,background:"#F5F5F5",borderRadius:8,padding:2,flexShrink:0}}>
              <Tab id="url" label="By Url"/><Tab id="domain" label="By Domain"/>
            </div>
          )}
          {showSearch&&(
            <div style={{display:"flex",alignItems:"center",gap:8,height:36,padding:"0 12px",
              border:"1px solid #D9D9D9",borderRadius:8,background:"#fff",minWidth:200}}>
              <FI name="search" size={14} color="#BFBFBF"/>
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="搜尋"
                style={{flex:1,border:"none",outline:"none",fontSize:13,fontFamily:"var(--font)",color:"#1F1F1F",background:"transparent",minWidth:0}}/>
            </div>
          )}
        </div>
      )}

      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13,tableLayout:"fixed",minWidth:1020}}>
          <colgroup>
            <col style={{width:48}}/><col style={{width:300}}/><col style={{width:90}}/>
            <col style={{width:110}}/><col style={{width:80}}/><col style={{width:90}}/>
            <col style={{width:90}}/><col style={{width:120}}/><col style={{width:100}}/><col style={{width:160}}/>
          </colgroup>
          <thead>
            <tr style={{borderBottom:"1px solid #F0F0F0"}}>
              <th style={{textAlign:"left",padding:"10px 8px",fontWeight:500,color:"var(--fg-3)",fontSize:12}}>索引</th>
              <th style={{textAlign:"left",padding:"10px 8px",fontWeight:500,color:"var(--fg-3)",fontSize:12}}>{view==="url"?"頁面":"網域"}</th>
              <th style={{textAlign:"right",padding:"10px 8px",fontWeight:500,color:"var(--fg-3)",fontSize:12}}>引用次數</th>

          </thead>
          <tbody>

                    style={{borderBottom:"1px solid #F0F0F0",cursor:"pointer",background:exp?"#FAFAFA":"transparent"}}
                    onMouseEnter={e=>{if(!exp)e.currentTarget.style.background="#FAFAFA";}}
                    onMouseLeave={e=>{if(!exp)e.currentTarget.style.background="transparent";}}>
                    <td style={{padding:"12px 8px"}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <FI name={exp?"chevron-down":"chevron-right"} size={14} color="#8C8C8C"/>
                        <div>
                          <div style={{fontWeight:500,color:"var(--fg)"}}>{t.topic}</div>
                          <div style={{fontSize:11,color:"var(--fg-3)",marginTop:2}}>{t.count} 追蹤問題清單</div>
                        </div>
                      </div>
                    </td>
                    <td style={{padding:"12px 8px",textAlign:"right",color:"var(--fg)"}}>{t.vis}<span style={{fontSize:10}}>%</span></td>
                    <td style={{padding:"12px 8px",textAlign:"right",color:"var(--fg)"}}>{t.sov}<span style={{fontSize:10}}>%</span></td>
                    <td style={{padding:"12px 8px",textAlign:"right",color:"var(--fg)"}}>{t.cites}</td>
                  </tr>
                  {exp&&t.queries.map(qr=>(
                    <tr key={qr.q} style={{borderBottom:"1px solid #F0F0F0"}}>
                      <td style={{padding:"12px 8px 12px 38px",color:"var(--fg-2)"}}>
                        <span style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",display:"block"}}>{qr.q}</span>
                      </td>
                      <td style={{padding:"12px 8px",textAlign:"right",color:qr.vis==="n/a"?"#BFBFBF":"var(--fg)"}}>
                        {qr.vis==="n/a"?"n/a":<>{qr.vis}<span style={{fontSize:10}}>%</span></>}
                      </td>
                      <td style={{padding:"12px 8px",textAlign:"right",color:qr.sov==="n/a"?"#BFBFBF":"var(--fg)"}}>
                        {qr.sov==="n/a"?"n/a":<>{qr.sov}<span style={{fontSize:10}}>%</span></>}
                      </td>
                      <td style={{padding:"12px 8px",textAlign:"right",color:"var(--fg)"}}>{qr.cites}</td>
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

            {crumbs.map((c,i)=>(
              <React.Fragment key={i}>
                {i>0&&<span style={{color:"#8C8C8C",flexShrink:0,fontSize:14}}>/</span>}
                <span style={{
                  color:i===crumbs.length-1?"var(--fg)":"var(--fg-3)",
                  fontWeight:i===crumbs.length-1?500:400,
                  whiteSpace:"nowrap",
                  overflow:i===crumbs.length-1?"hidden":"visible",
                  textOverflow:"ellipsis",fontSize:14,
                }}>{c}</span>
              </React.Fragment>
            ))}
          </nav>

          {/* Right: search, bell, divider, avatar — per spec order */}
          <IconBtn name="search" title="搜尋 ⌘K" onClick={()=>setSearchOpen(true)}/>
          <IconBtn name="bell"   title="通知" badge/>
          <div style={{width:1,height:20,background:"#F0F0F0",margin:"0 2px",flexShrink:0}}/>

          {/* User menu */}
          <div onClick={()=>setUserMenu(o=>!o)}
            style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",position:"relative",flexShrink:0}}>
            <Avatar initials="S" size={28} bg="#0A2B41"/>
            {ww>=640&&<FI name="chevron-down" size={13} color="#8C8C8C"/>}
            {userMenu&&(
              <>
                <div onClick={e=>{e.stopPropagation();setUserMenu(false);}} style={{position:"fixed",inset:0,zIndex:99}}/>
                <div style={{position:"absolute",top:40,right:0,width:200,background:"#fff",border:"1px solid #F0F0F0",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.08)",padding:6,zIndex:100}}>
                  <div style={{padding:"8px 10px",borderBottom:"1px solid #F0F0F0",marginBottom:4}}>
                    <div style={{fontSize:13,fontWeight:600}}>金三 顧問</div>
                    <div style={{fontSize:11,color:"#8C8C8C"}}>kinsan@example.com</div>
                  </div>
                  {[["user","個人設定"],["settings","帳號設定"],["log-out","登出"]].map(([ic,lbl])=>(
                    <div key={lbl} onClick={()=>setUserMenu(false)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:6,cursor:"pointer",fontSize:13,color:"#595959"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <FI name={ic} size={14} color="#8C8C8C"/>{lbl}
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </header>

        {/* 全域搜尋 popup（Command Palette，靜態示意） */}
        {searchOpen&&(
          <>
            <div onClick={()=>setSearchOpen(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.35)",zIndex:300}}/>
            <div style={{position:"fixed",top:"18vh",left:"50%",transform:"translateX(-50%)",width:560,maxWidth:"92vw",background:"#fff",
              borderRadius:12,boxShadow:"0 16px 48px rgba(0,0,0,0.18)",zIndex:301,overflow:"hidden"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid #F0F0F0"}}>
                <FI name="search" size={18} color="#8C8C8C"/>
                <input autoFocus placeholder="搜尋專案、報表…"
                  style={{flex:1,border:"none",outline:"none",fontSize:15,fontFamily:"var(--font)",color:"#1F1F1F"}}
                  onKeyDown={e=>{if(e.key==="Escape")setSearchOpen(false);}}/>
                <kbd style={{fontSize:11,color:"#8C8C8C",background:"#F5F5F5",border:"1px solid #E7EAEC",borderRadius:4,padding:"2px 6px"}}>Esc</kbd>
              </div>
              <div style={{padding:8,maxHeight:"48vh",overflowY:"auto"}}>
                <div style={{fontSize:11,fontWeight:600,color:"#8C8C8C",padding:"6px 10px 4px",letterSpacing:"0.04em"}}>專案</div>
                {["品牌 GEO 追蹤"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="folder" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
                {["電商關鍵字監測"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="folder" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
                <div style={{fontSize:11,fontWeight:600,color:"#8C8C8C",padding:"6px 10px 4px",letterSpacing:"0.04em"}}>報表</div>
                {["本月成效總覽"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="file-text" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
                {["競品分析報告"].map(t=>(
                  <div key={t} onClick={()=>setSearchOpen(false)}
                    style={{display:"flex",alignItems:"center",gap:10,padding:"9px 10px",borderRadius:6,cursor:"pointer",fontSize:14,color:"#1F1F1F"}}
                    onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <FI name="file-text" size={15} color="#8C8C8C"/>{t}
                  </div>
                ))}
              </div>
            </div>
          </>
        )}


        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
