/* ══════════════════════════════════════════════════════════
   NAV COMPONENTS — exactly per younilab-設計規範 Sidebar spec
   Icons: 20px for nav items per Iconography spec
   Active group: fontWeight 600, chevron #0A2B41
   Sub-item: padding 8px 16px (wider horizontal)
   Section header: padding-top 20px
══════════════════════════════════════════════════════════ */
function NavSection({label}){
  return <div style={{fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",color:"#BFBFBF",padding:"20px 16px 6px"}}>{label}</div>;
}

function NavItem({item,activeId,onSelect,collapsed,expanded,onToggle,sub=false}){
  const [hov,setHov] = useState(false);

  /* active: direct match OR any child matches */
  const isActive = activeId===item.id
    || (item.children&&item.children.some(c=>c.id===activeId));
  const isExp = expanded[item.id];

  if(item.type==="section") return collapsed ? null : <NavSection label={item.label}/>;

  const handleClick = () => {
    if(item.children) onToggle(item.id);
    else onSelect(item.id);
  };

  /* Colour + weight rules (per spec + Figma)
     Group 有子選單時：active 只改顏色/字重，背景保持透明 */
  const hasChildren = !!item.children;
  const fg       = isActive ? "#0A2B41" : "#595959";
  const iconCol  = isActive ? "#0A2B41" : "#8C8C8C";
  const bgCol    = isActive
    ? (hasChildren ? "transparent" : "#E7EAEC")  /* group = 無底色 */
    : hov ? "#FAFAFA" : "transparent";
  const fw       = isActive ? (hasChildren ? 600 : 500) : 400;

  return (
    <>
      <div onClick={handleClick}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        title={collapsed&&!sub ? item.label : undefined}
        style={{
          display:"flex", alignItems:"center",
          gap: (collapsed&&!sub) ? 0 : 8,
          /* Sub: 8px 16px / Parent: 10px 12px */
          padding: sub ? "8px 16px" : (collapsed ? "10px 0" : "10px 12px"),
          margin:"1px 8px", borderRadius:8, cursor:"pointer",
          justifyContent:(collapsed&&!sub)?"center":"flex-start",
          background: bgCol,
          color: fg,
          fontWeight: fw,
          /* Sub 13px / Parent 14px */
          fontSize: sub ? 13 : 14,
          transition:"all .12s",
          position:"relative",
        }}>
        {/* ── Icon: 20px for nav items per spec Iconography 尺寸階 ── */}
        {!sub && !collapsed && <FI name={item.icon} size={20} color={iconCol}/>}
        {!sub && collapsed  && <FI name={item.icon} size={20} color={iconCol}/>}
        {/* Sub-item: 前綴圓點 5×5 active #0A2B41 / default #BFBFBF / marginLeft 6px */}
        {sub && (
          <div style={{width:5,height:5,borderRadius:"50%",background:isActive?"#0A2B41":"#BFBFBF",marginLeft:6,flexShrink:0}}/>
        )}
        {!collapsed && <span style={{flex:1,whiteSpace:"nowrap"}}>{item.label}</span>}
        {/* Badge */}
        {!collapsed && !sub && item.badge && (
          <span style={{minWidth:18,height:18,borderRadius:9,background:item.badgeColor||"#F5222D",color:"#fff",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 5px",flexShrink:0}}>
            {item.badge}
          </span>
        )}
        {/* Badge dot (collapsed) */}
        {collapsed && !sub && item.badge && (
          <div style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:"50%",background:item.badgeColor||"#F5222D",border:"1.5px solid #fff"}}/>
        )}
        {/* Chevron — active group: #0A2B41, else #BFBFBF (per Figma) */}
        {!collapsed && item.children && (
          <FI name={isExp?"chevron-up":"chevron-right"} size={14}
            color={isActive?"#0A2B41":"#BFBFBF"}/>
        )}
      </div>
      {/* Children — paddingLeft:10 per spec */}
      {item.children && isExp && !collapsed && (
        <div style={{paddingLeft:10}}>
          {item.children.map(c=>(
            <NavItem key={c.id} item={{...c,type:"item",icon:""}} activeId={activeId}
              onSelect={onSelect} collapsed={false} expanded={{}} onToggle={()=>{}} sub/>
          ))}
        </div>
      )}
    </>
  );
}

function Avatar({initials,size=28,bg="#8B6500"}){

}

/* Button — per spec sizes & variants */
function Btn({children,variant="primary",size="md",onClick,style={}}){
  const [hov,setHov]=useState(false);
  const h=size==="sm"?32:size==="lg"?44:40;
  const px=size==="sm"?12:size==="lg"?20:16;
  const fs=size==="sm"?12:size==="lg"?15:14;
  const base={height:h,padding:`0 ${px}px`,borderRadius:8,fontSize:fs,fontWeight:500,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,outline:"none",transition:"all .15s",whiteSpace:"nowrap",fontFamily:"var(--font)",border:"none"};
  const v={
    primary:  {border:"1px solid var(--primary)",background:hov?"var(--primary-hover)":"var(--primary)",color:"#fff"},
    secondary:{border:"1px solid var(--border)",background:hov?"var(--bg-2)":"#fff",color:"var(--fg)"},
    ghost:    {border:"1px solid transparent",background:hov?"var(--bg-2)":"transparent",color:"var(--fg-2)"},
  }[variant]||{};
  return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,...v,...style}}>{children}</button>;
}

        {/* Top Header icons: 18px per spec */}
        <FI name={name} size={18} color="#595959"/>
      </div>
      {badge&&<div style={{position:"absolute",top:5,right:6,width:8,height:8,borderRadius:"50%",background:"#F5222D",border:"1.5px solid #fff",pointerEvents:"none"}}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════
   BAR CHART — pure SVG per younilab-設計規範 Ch-Bar spec
   規格: VIZ_MAIN #1677FF, rx:4, barW ≤36 ~56% col
         水平 gridline 1px #F0F0F0, X-axis 11px #8C8C8C
         Y-axis ticks 11px #BFBFBF, tooltip #1F1F1F bg
   自適應: 透過 ResizeObserver 偵測容器尺寸，撐滿父層
══════════════════════════════════════════════════════════ */
function BarChart({data}){
  const [tip,setTip]=useState(null);
  const wrapRef=useRef(null);
  const [size,setSize]=useState({w:560,h:220});

  useEffect(()=>{
    if(!wrapRef.current) return;
    const ro=new ResizeObserver(entries=>{
      for(const e of entries){
        const{width,height}=e.contentRect;
        setSize({w:Math.max(280,width),h:Math.max(180,height)});
      }
    });
    ro.observe(wrapRef.current);
    return()=>ro.disconnect();
  },[]);

  const W=size.w,H=size.h;
  const pad={t:12,r:12,b:28,l:32};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const max=Math.ceil(Math.max(...data.map(d=>d.v))/5)*5||10;
  const ticks=Array.from({length:5},(_,i)=>Math.round(max*(i/4)));
  const bw=iw/data.length;
  const barW=Math.min(36,bw*0.56);
  const ypos=v=>pad.t+ih-(ih*v)/max;

  return(
    <div ref={wrapRef} style={{width:"100%",height:"100%",position:"relative"}}>
      <svg width={W} height={H} viewBox={`0 0 ${W} ${H}`}
        style={{display:"block",fontFamily:"var(--font)"}}>
        {/* Horizontal gridlines */}
        {ticks.map(t=>(
          <g key={t}>
            <line x1={pad.l} y1={ypos(t)} x2={W-pad.r} y2={ypos(t)} stroke="#F0F0F0" strokeWidth="1"/>
            <text x={pad.l-6} y={ypos(t)+4} textAnchor="end" fontSize="11" fill="#BFBFBF">{t}</text>
          </g>
        ))}
        {/* Bars */}
        {data.map((d,i)=>{
          const cx=pad.l+bw*i+bw/2;
          const bh=(ih*d.v)/max;
          return(
            <g key={i}
              onMouseEnter={()=>setTip({x:cx,y:ypos(d.v),v:d.v})}
              onMouseLeave={()=>setTip(null)}
              style={{cursor:"pointer"}}>
              <rect x={cx-barW/2} y={ypos(d.v)} width={barW} height={bh} rx="4" fill="var(--viz-main)"/>
              <text x={cx} y={H-8} textAnchor="middle" fontSize="11" fill="#8C8C8C">{d.d}</text>
            </g>
          );
        })}
        {/* Tooltip */}
        {tip&&(
          <g style={{pointerEvents:"none"}}>
            <rect x={tip.x-20} y={tip.y-30} width="40" height="22" rx="6" fill="#1F1F1F"/>
            <text x={tip.x} y={tip.y-15} textAnchor="middle" fontSize="11" fill="#fff" fontWeight="600">{tip.v}</text>
          </g>
        )}
      </svg>
    </div>
  );
}
