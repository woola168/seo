);

/* ── Form Field ── */
function InputField({label,type,value,onChange,placeholder,error,rightEl}){
  const [focused,setFocused]=useState(false);
  return(
    <div style={{marginBottom:18}}>
      <label style={{display:"block",fontSize:13,fontWeight:500,color:"#1F1F1F",marginBottom:6}}>{label}</label>
      <div style={{position:"relative"}}>
        <input
          value={value} onChange={e=>onChange(e.target.value)}
          type={type} placeholder={placeholder}
          onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
          style={{
            width:"100%", boxSizing:"border-box", height:40,
            padding:rightEl?"0 40px 0 12px":"0 12px",
            fontSize:14, fontFamily:"var(--font)", color:"#1F1F1F",
            background:"#fff", outline:"none", borderRadius:8,
            border:"1px solid "+(error?"#F5222D":focused?"#0A2B41":"#D9D9D9"),
            boxShadow: error&&focused ? "0 0 0 3px rgba(245,34,45,0.08)"
                      : focused       ? "0 0 0 3px rgba(10,43,65,0.08)"
                      : "none",
            transition:"border-color .15s,box-shadow .15s",
          }}/>
        {rightEl&&(
          <div onClick={rightEl.onClick}
            style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",display:"flex",cursor:"pointer",userSelect:"none"}}>
            {rightEl.icon}
          </div>
        )}
      </div>
      {error&&(
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:13,color:"#CF1322",marginTop:6}}>
          <FI name="alert-circle" size={14} color="#CF1322"/>{error}
        </div>
      )}
    </div>
  );
}

/* ── Login Page ── */
function LoginPage(){
  const [email,setEmail]       =useState("");
  const [pw,setPw]             =useState("");
  const [showPw,setShowPw]     =useState(false);
  const [remember,setRemember] =useState(false);
  const [loading,setLoading]   =useState(false);
  const [emailErr,setEmailErr] =useState("");
  const [pwErr,setPwErr]       =useState("");

  const validate=()=>{
    let ok=true;
    if(!email){setEmailErr("請輸入信箱");ok=false;}
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){setEmailErr("信箱格式不正確");ok=false;}
    else setEmailErr("");
    if(!pw){setPwErr("請輸入密碼");ok=false;}
    else setPwErr("");
    return ok;
  };

  const handleLogin=()=>{
    if(!validate()) return;
    setLoading(true);
    setTimeout(()=>setLoading(false),800);
  };

  return(
    <div style={{display:"flex",minHeight:"100vh",fontFamily:"var(--font)"}}>

      {/* ── Left: Brand Panel ── */}
      <div className="login-left" style={{flex:1,position:"relative",overflow:"hidden",minHeight:"100vh",minWidth:0}}>
        {/* Background image */}
        <img src={BG_IMG} alt=""
          style={{width:"100%",height:"100%",objectFit:"cover",objectPosition:"center",display:"block",position:"absolute",inset:0}}/>
        {/* Gradient overlay — darken bottom for readability */}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(180deg,rgba(4,17,27,0.25) 0%,rgba(4,17,27,0.6) 100%)",zIndex:1}}/>
        {/* No bottom text per requirement */}
      </div>

      {/* ── Right: Form Panel ── */}
      <div className="login-right"
        style={{width:480,flexShrink:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"48px 40px",background:"#fff",position:"relative",minHeight:"100vh"}}>

        <div style={{width:"100%",maxWidth:340}}>

          {/* Heading — no small logo per requirement */}
          <h1 style={{fontSize:26,fontWeight:700,color:"#1F1F1F",letterSpacing:"-0.01em",margin:"0 0 6px"}}>歡迎回來</h1>
          <p style={{fontSize:14,color:"#8C8C8C",margin:"0 0 28px",lineHeight:"22px"}}>KINSAN SEO 文案管理系統</p>

          {/* Google OAuth */}
          <button
            style={{width:"100%",height:44,border:"1px solid #D9D9D9",borderRadius:8,background:"#fff",color:"#1F1F1F",fontSize:14,fontWeight:500,fontFamily:"var(--font)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"background .15s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
            onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
            <GoogleIcon/>
            使用 Google 帳號登入
          </button>

          {/* OR divider */}
          <div style={{display:"flex",alignItems:"center",gap:12,margin:"20px 0"}}>
            <div style={{flex:1,height:1,background:"#F0F0F0"}}/>
            <span style={{fontSize:12,color:"#BFBFBF",whiteSpace:"nowrap"}}>或使用帳號密碼</span>
            <div style={{flex:1,height:1,background:"#F0F0F0"}}/>
          </div>

          {/* Email */}
          <InputField
            label="信箱" type="email" value={email}
            onChange={v=>{setEmail(v);setEmailErr("");}}
            placeholder="your@email.com" error={emailErr}/>

          {/* Password */}
          <InputField
            label="密碼" type={showPw?"text":"password"} value={pw}
            onChange={v=>{setPw(v);setPwErr("");}}
            placeholder="輸入密碼" error={pwErr}
            rightEl={{
              icon:<FI name={showPw?"eye-off":"eye"} size={16} color="#8C8C8C"/>,
              onClick:()=>setShowPw(v=>!v),
            }}/>

          {/* Remember me + Forgot */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
            <div onClick={()=>setRemember(v=>!v)}
              style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",userSelect:"none"}}>
              <div style={{
                width:16,height:16,borderRadius:4,
                border:"1.5px solid "+(remember?"#0A2B41":"#D9D9D9"),
                background:remember?"#0A2B41":"#fff",
                display:"flex",alignItems:"center",justifyContent:"center",
                transition:"all .12s",flexShrink:0,
              }}>
                {remember&&<FI name="check" size={11} color="#fff"/>}
              </div>
              <span style={{fontSize:13,color:"#595959"}}>記住我</span>
            </div>
            <span style={{fontSize:13,color:"#1677FF",cursor:"pointer"}}
              onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"}
              onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>
              忘記密碼？
            </span>
          </div>

          {/* Login Button — primary lg: height 44, fontSize 15 */}
          <button onClick={handleLogin} disabled={loading}
            style={{
              width:"100%",height:44,border:"none",borderRadius:8,
              background:loading?"#2E4A5E":"#0A2B41",
              color:"#fff",fontSize:15,fontWeight:500,
              fontFamily:"var(--font)",
              cursor:loading?"not-allowed":"pointer",
              transition:"background .15s",
              display:"flex",alignItems:"center",justifyContent:"center",gap:8,
            }}
            onMouseEnter={e=>{if(!loading)e.currentTarget.style.background="#2E4A5E";}}
            onMouseLeave={e=>{if(!loading)e.currentTarget.style.background="#0A2B41";}}>
            {loading?(
              <>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round"
                  style={{animation:"spin .7s linear infinite"}}>
                  <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
                </svg>
                登入中…
              </>
            ):"登入"}
          </button>

          {/* Sign up */}
          <div style={{textAlign:"center",fontSize:13,color:"#8C8C8C",marginTop:24}}>
            還沒有帳號？<span style={{color:"#1677FF",fontWeight:500,cursor:"pointer"}}
              onMouseEnter={e=>e.currentTarget.style.textDecoration="underline"}
              onMouseLeave={e=>e.currentTarget.style.textDecoration="none"}>
              申請試用
            </span>
          </div>
        </div>

        {/* Footer — system status + version */}
        <div style={{position:"absolute",bottom:20,left:"50%",transform:"translateX(-50%)",display:"flex",alignItems:"center",gap:8,fontSize:12,color:"#BFBFBF",whiteSpace:"nowrap"}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:"#52C41A",flexShrink:0}}/>
          <span>系統狀態：正常</span>
          <span>·</span>
          <span>v1.0.0</span>
        </div>
      </div>
    </div>
  );
}

/* spinner keyframe via style tag */
const style=document.createElement("style");
style.textContent="@keyframes spin{to{transform:rotate(360deg)}}";
document.head.appendChild(style);

ReactDOM.createRoot(document.getElementById("root")).render(<LoginPage/>);
</script>
</body>
</html>
