<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinsan SEO — 權限管理（切版參照）</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   Design Tokens（對應 DESIGN.md，工程轉 React 時抽成 CSS variables / theme）
   ═══════════════════════════════════════════ */
:root {
  --primary:#0A2B41; --primary-hover:#2E4A5E; --primary-light:#E7EAEC;
  --info:#1677FF; --info-light:#E6F4FF; --info-text:#0958D9;
  --success-text:#389E0D; --warning-text:#D68C24; --error-text:#CF1322;
  --fg:#1F1F1F; --fg-2:#595959; --fg-3:#8C8C8C; --fg-4:#BFBFBF;
  --bg-page:#F5F5F5; --bg:#FFFFFF; --bg-2:#FAFAFA;
  --border:#D9D9D9; --border-subtle:#F0F0F0;
  --radius-card:12px; --radius-md:8px; --radius-sm:6px;
  --font:'Inter','Noto Sans TC',-apple-system,sans-serif;
  --mono:'IBM Plex Mono','Menlo',monospace;
  --sidebar-w:240px; --sidebar-w-collapsed:56px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg-page); color:var(--fg); -webkit-font-smoothing:antialiased; }
.ic { display:block; flex-shrink:0; }
/* ═══ 統一卷軸樣式（細灰、常駐）═══ */
* { scrollbar-width:thin; scrollbar-color:#D9D9D9 transparent; }   /* Firefox */
::-webkit-scrollbar { width:8px; height:8px; }                      /* 縱向 + 橫向同寬 */
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#D9D9D9; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:#BFBFBF; }
::-webkit-scrollbar-corner { background:transparent; }

/* ═══ Layout shell ═══ */
.app { display:flex; height:100vh; overflow:hidden; }

/* ═══ Sidebar → <Sidebar/> ═══ */
.sidebar { width:var(--sidebar-w); background:var(--bg); border-right:1px solid var(--border-subtle);
  position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; z-index:100; }
.sidebar__logo { height:56px; padding:0 14px; border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.sidebar__logo img { height:24px; width:auto; display:block; }
.sidebar__collapse { width:28px; height:28px; border-radius:var(--radius-sm); display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--fg-3); transition:background .12s; }
.sidebar__collapse:hover { background:var(--border-subtle); }
.sidebar__nav { flex:1; padding:4px 0; overflow-y:auto; }
.nav-group__title { font-size:12px; font-weight:400; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--fg-4); padding:16px 16px 6px; }
.nav-item { display:flex; align-items:center; gap:8px; padding:10px 12px; margin:1px 8px;
  border-radius:var(--radius-md); cursor:pointer; font-size:14px; color:var(--fg-2); transition:background .12s; }
.nav-item:hover { background:var(--bg-2); }
.nav-item .ic { color:var(--fg-3); }
.nav-item--active { background:var(--primary-light); color:var(--primary); font-weight:500; }
.nav-item--active .ic { color:var(--primary); }

/* ═══ Main ═══ */
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; overflow:hidden; }

/* ═══ Top Header → <TopHeader/> ═══ */
.topbar { height:56px; background:var(--bg); border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; padding:0 24px; gap:8px; position:sticky; top:0; z-index:50; }
.topbar__crumbs { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fg-3); }
.topbar__crumbs .sep { color:var(--border); }
.topbar__crumbs .cur { color:var(--fg); font-weight:500; }
.topbar__spacer { flex:1; }
.topbar__btn { width:32px; height:32px; border-radius:var(--radius-sm); display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--fg-2); position:relative; transition:background .12s; }
.topbar__btn:hover { background:var(--border-subtle); }
.topbar__badge { position:absolute; top:3px; right:4px; min-width:16px; height:16px; padding:0 4px;
  border-radius:999px; background:var(--error-text); color:#fff; font-size:10px; font-weight:600;
  display:flex; align-items:center; justify-content:center; border:1.5px solid #fff; }
.topbar__divider { width:1px; height:20px; background:var(--border-subtle); margin:0 4px; }
.topbar__user { display:flex; align-items:center; gap:4px; cursor:pointer; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--primary-hover); color:#fff;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ═══ Content ═══ */
.content { flex:1; padding:24px 32px; overflow:hidden; display:flex; flex-direction:column; min-height:0; }
.page-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:20px; flex-wrap:wrap; flex-shrink:0; }
.page-header__main { flex:1; min-width:240px; }
.page-header__title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-header__title { font-size:20px; font-weight:600; color:var(--fg); }
.page-header__desc { font-size:13px; color:var(--fg-3); margin-top:4px; }
.page-header__actions { display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
.btn { height:40px; padding:0 16px; border-radius:var(--radius-md); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; white-space:nowrap; }
.btn--primary { border:1px solid var(--primary); background:var(--primary); color:#fff; }
.btn--primary:hover { background:var(--primary-hover); }
.btn--secondary { border:1px solid var(--border); background:var(--bg); color:var(--fg); }
.btn--secondary:hover { background:var(--bg-2); }
.btn--ghost { border:1px solid var(--border); background:var(--bg); color:var(--fg-3); }

/* ═══ Stat Card → <StatCard/>（規範 C 版：圖標色塊 + 標籤 + 數字 + 副指標）═══ */
.stat-row { display:flex; gap:16px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:0; background:var(--bg); border:1px solid var(--primary-light);
  border-radius:var(--radius-card); padding:16px 18px; }
.stat-card__head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.stat-card__badge { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-card__label { font-size:13px; color:var(--fg-3); }
.stat-card__value { font-size:26px; font-weight:600; color:var(--fg); line-height:1.1; margin-bottom:8px; }
.stat-card__subs { display:flex; gap:14px; font-size:12px; color:var(--fg-3); }
.stat-card__subs b { font-weight:600; }
/* 語意色塊（淺底 + 圖示色）*/
.tint-info   { background:var(--info-light); color:var(--info); }
.tint-warn   { background:#FFFCF0; color:var(--warning-text); }
.tint-error  { background:#FFF1F0; color:var(--error-text); }
.tint-success{ background:#F6FFED; color:var(--success-text); }

/* ═══ Sidebar 收合狀態（.app--collapsed 切換）═══ */
.app--collapsed .sidebar { width:var(--sidebar-w-collapsed); }
.app--collapsed .main { margin-left:var(--sidebar-w-collapsed); }
.sidebar, .main { transition:width 200ms ease, margin-left 200ms ease; }
.sidebar { overflow:hidden; }
.app--collapsed .sidebar__logo { justify-content:center; }
.app--collapsed .sidebar__logo img { display:none; }
.app--collapsed .nav-group__title { display:none; }
.app--collapsed .nav-item { justify-content:center; padding:10px 0; }
.app--collapsed .nav-item span { display:none; }
.c-info { color:var(--info); } .c-success { color:var(--success-text); }

/* ═══ Top Header 使用者下拉 → <UserMenu/> ═══ */
.topbar__user { position:relative; }
.user-menu { position:absolute; top:38px; right:0; width:200px; background:var(--bg);
  border:1px solid var(--border-subtle); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.08);
  padding:6px; z-index:200; display:none; }
.user-menu--open { display:block; }
.user-menu__head { padding:8px 10px; border-bottom:1px solid var(--border-subtle); margin-bottom:4px; }
.user-menu__name { font-size:13px; font-weight:600; color:var(--fg); }
.user-menu__email { font-size:11px; color:var(--fg-3); }
.user-menu__item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px;
  cursor:pointer; font-size:13px; color:var(--fg-2); }
.user-menu__item:hover { background:var(--bg-2); }
.user-menu__item--danger { color:var(--error-text); }

/* ═══ Command Palette → <CommandPalette/> ═══ */
.cmdk-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1200; display:none;
  align-items:flex-start; justify-content:center; padding-top:120px; }
.cmdk-overlay--open { display:flex; }
.cmdk { width:560px; max-width:90vw; background:var(--bg); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.15); overflow:hidden; }
.cmdk__input { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border-subtle); }
.cmdk__input input { flex:1; border:none; outline:none; font-size:15px; font-family:inherit; color:var(--fg); background:transparent; }
.cmdk__input input::placeholder { color:var(--fg-4); }
.cmdk__esc { font-size:11px; color:var(--fg-3); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
.cmdk__list { padding:8px; max-height:360px; overflow-y:auto; }
.cmdk__section { font-size:11px; color:var(--fg-4); text-transform:uppercase; letter-spacing:0.06em; padding:8px 10px 4px; }
.cmdk__item { display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--fg); }
.cmdk__item:hover { background:var(--bg-2); }

/* ═══ 權限管理頁專用 ═══ */
.breadcrumb { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fg-3); margin-bottom:12px; }
.breadcrumb .sep { color:var(--border); }
.breadcrumb .cur { color:var(--fg); font-weight:500; }

/* Tabs → <Tabs/> */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--border-subtle); margin-bottom:20px; flex-shrink:0; }
.tab { padding:10px 16px; font-size:14px; color:var(--fg-3); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; transition:color .12s; }
.tab:hover { color:var(--fg-2); }
.tab--active { color:var(--primary); font-weight:500; border-bottom-color:var(--primary); }

/* Toolbar */
.toolbar { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; flex-shrink:0; }
.toolbar__search { position:relative; width:280px; }
.toolbar__search input { width:100%; height:40px; padding:0 12px 0 36px; font-size:14px; font-family:inherit;
  color:var(--fg); border:1px solid var(--border); border-radius:var(--radius-md); outline:none; }
.toolbar__search input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(10,43,65,0.08); }
.toolbar__search .ic { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--fg-4); }
.select { height:40px; padding:0 12px; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--border);
  border-radius:var(--radius-md); cursor:pointer; display:inline-flex; align-items:center; gap:8px; white-space:nowrap; }
.select .ic { color:var(--fg-3); }
.toolbar__spacer { flex:1; }

/* Card + Table */
.card { background:var(--bg); border:1px solid var(--border); border-radius:var(--radius-card); flex:1; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.table-scroll { overflow:auto; flex:1; min-height:0; }       /* A：填滿剩餘高度，只有此區垂直卷動 */
.table-scroll thead th { position:sticky; top:0; z-index:2; background:var(--bg); }
.table-scroll thead th.col-action { z-index:3; }              /* 操作欄表頭：橫向+縱向都固定 */
table { width:100%; border-collapse:collapse; font-size:14px; min-width:980px; }
thead th { text-align:left; padding:12px 16px; font-weight:500; color:var(--fg-2); font-size:13px;
  border-bottom:1px solid var(--border); white-space:nowrap; }
thead th.col-action { text-align:right; position:sticky; right:0; background:var(--bg); box-shadow:-4px 0 8px -4px rgba(0,0,0,0.08); }
tbody td { padding:0 16px; height:56px; border-bottom:1px solid var(--border-subtle); color:var(--fg-2); white-space:nowrap; vertical-align:middle; }
tbody tr:last-child td { border-bottom:none; }
tbody tr:hover { background:var(--bg-2); }
tbody tr:hover td.col-action { background:var(--bg-2); }
td.col-name { color:var(--fg); font-weight:500; }
td.col-email { font-family:var(--mono); font-size:13px; }
td.col-action { position:sticky; right:0; background:var(--bg); box-shadow:-4px 0 8px -4px rgba(0,0,0,0.08); }
.row-actions { display:flex; justify-content:flex-end; gap:8px; }
.row-act { width:24px; height:24px; border-radius:50%; background:var(--border-subtle); display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--fg-2); transition:background .12s; position:relative; }
.row-act:hover { background:#E5E5E5; color:#434343; }

/* Badge */
.badge { display:inline-block; width:max-content; font-size:12px; font-weight:500; padding:2px 8px; border-radius:999px; white-space:nowrap; }
.badge-purple { background:#F5F3FF; color:#7C3AED; border:1px solid #DDD6FE; }
.badge-blue   { background:#E6F4FF; color:#0958D9; border:1px solid #91CAFF; }
.badge-success{ background:#F6FFED; color:#389E0D; border:1px solid #B7EB8F; }
.badge-muted{ background:#F5F5F5; color:#8C8C8C; border:1px solid #D9D9D9; }
.col-status { min-width:80px; }
.col-role { min-width:88px; }
.muted-time { color:var(--fg-3); font-size:13px; }

/* 更多選單 */
/* 更多選單改 fixed，避免被 overflow 容器裁切 */
.more-menu { position:fixed; width:140px; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,0.12); z-index:1000; display:none; text-align:left; }
.more-menu--open { display:block; }
/* 篩選下拉 */
.select { position:relative; }
.select-menu { position:absolute; top:44px; left:0; min-width:140px; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,0.1); z-index:60; display:none; }
.select-menu--open { display:block; }
.select-menu__item { padding:8px 10px; border-radius:6px; cursor:pointer; font-size:13px; color:var(--fg-2); white-space:nowrap; }
.select-menu__item:hover { background:var(--bg-2); }
.select-menu__item--active { color:var(--primary); font-weight:500; background:var(--primary-light); }
.select--active { border-color:var(--primary); color:var(--primary); }
/* Pagination */
.pagination { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-top:1px solid var(--border-subtle); flex-shrink:0; }
.pagination__info { font-size:13px; color:var(--fg-3); }
.pagination__pages { display:flex; gap:4px; }
.page-btn { min-width:32px; height:32px; padding:0 8px; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:13px; cursor:pointer; background:transparent; color:var(--fg-2); border:1px solid var(--border); }
.page-btn--active { background:var(--primary); color:#fff; border:none; }
.page-btn--disabled { color:var(--fg-4); cursor:not-allowed; }
/* 空狀態 */
.empty-row td { text-align:center; color:var(--fg-4); font-size:14px; height:120px; }
.more-menu--open { display:block; }
.more-menu__item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px; cursor:pointer;
  font-size:13px; color:var(--fg-2); white-space:nowrap; }
.more-menu__item:hover { background:var(--bg-2); }
.more-menu__item--danger { color:var(--error-text); }
</style>
</head>

        <div class="toolbar__search"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx='11' cy='11' r='8'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg><input id="kw" placeholder="搜尋姓名或 Email…" oninput="applyFilter()"/></div>
        <div class="select" id="sel-role" onclick="toggleSelect(event,'role')">所有角色 <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points='6 9 12 15 18 9'/></svg>
          <div class="select-menu" id="menu-role"></div>
        </div>
        <div class="select" id="sel-dept" onclick="toggleSelect(event,'dept')">所有部門 <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points='6 9 12 15 18 9'/></svg>
          <div class="select-menu" id="menu-dept"></div>
        </div>
        <div class="select" id="sel-status" onclick="toggleSelect(event,'status')">所有狀態 <svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points='6 9 12 15 18 9'/></svg>
          <div class="select-menu" id="menu-status"></div>
        </div>
        <div class="toolbar__spacer"></div>
        <button class="btn btn--primary"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1='12' y1='5' x2='12' y2='19'/><line x1='5' y1='12' x2='19' y2='12'/></svg>新增員工</button>
      </div>

      <!-- 表格（操作欄 sticky 最右；中間欄位過多可橫向拖曳）-->
      <div class="card">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>姓名</th><th>Email</th><th>角色</th><th>部門</th><th>狀態</th><th>最後登入</th>
                <th class="col-action">操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <!-- Pagination → <Pagination/> -->
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<script>
  // 切版參照用的最小互動；React 版改用 state 管理
  function toggleSidebar(){ document.querySelector('.app').classList.toggle('app--collapsed'); }
  function toggleUserMenu(e){ e.stopPropagation(); document.getElementById('user-menu').classList.toggle('user-menu--open'); }
  document.addEventListener('click', function(){ document.getElementById('user-menu').classList.remove('user-menu--open'); });
  // Command Palette
  function openPalette(){ document.getElementById('cmdk').classList.add('cmdk-overlay--open'); setTimeout(()=>document.getElementById('cmdk-input').focus(),50); }
  function closePalette(e){ if(!e || e.target.id==='cmdk') document.getElementById('cmdk').classList.remove('cmdk-overlay--open'); }
  document.addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); openPalette(); }
    if(e.key==='Escape'){ document.getElementById('cmdk').classList.remove('cmdk-overlay--open'); }
  });


  // ════ 權限管理：資料 + 篩選 + 分頁（切版參照用簡化版；React 改 state）════
  const STAFF = [
    {name:"RayKoo", email:"ray.jh.koo@gmail.com", role:"開發者", dept:"決策層", status:"啟用", login:"2026/06/10 下午 04:01"},
    {name:"seventychi", email:"seven.tychi@gmail.com", role:"開發者", dept:"決策層", status:"啟用", login:"2026/06/15 上午 12:46"},
    {name:"吳菀婷", email:"moeki0216@gmail.com", role:"部門主管", dept:"SEO 策略部", status:"啟用", login:"2026/06/03 下午 05:38"},
    {name:"溫鵬皓", email:"johnsonwen007@gmail.com", role:"部門主管", dept:"決策層", status:"啟用", login:"2026/06/14 下午 02:28"},
    {name:"陳俊達", email:"admin@kinsan-seo.com", role:"開發者", dept:"決策層", status:"啟用", login:"2026/04/02 下午 02:40"},
    {name:"陳俊達", email:"kinsan712@gmail.com", role:"開發者", dept:"決策層", status:"停用", login:"2026/05/23 下午 02:15"},
    {name:"林佳穎", email:"jiaying.lin@gmail.com", role:"成員", dept:"SEO 策略部", status:"啟用", login:"2026/06/12 上午 09:20"},
    {name:"周大為", email:"dawei.chou@gmail.com", role:"成員", dept:"內容部", status:"停用", login:"2026/05/30 下午 06:10"},
    {name:"黃詩涵", email:"shihan.huang@gmail.com", role:"部門主管", dept:"內容部", status:"啟用", login:"2026/06/14 上午 11:05"},
    {name:"李冠霖", email:"guanlin.lee@gmail.com", role:"成員", dept:"決策層", status:"啟用", login:"2026/06/13 下午 03:42"},
    {name:"張雅筑", email:"yachu.chang@gmail.com", role:"成員", dept:"SEO 策略部", status:"啟用", login:"2026/06/11 上午 10:15"},
    {name:"王俊傑", email:"chunchieh.wang@gmail.com", role:"部門主管", dept:"SEO 策略部", status:"啟用", login:"2026/06/09 下午 02:30"},
    {name:"陳怡君", email:"yichun.chen@gmail.com", role:"成員", dept:"內容部", status:"啟用", login:"2026/06/08 上午 08:45"},
    {name:"林志豪", email:"chihhao.lin@gmail.com", role:"成員", dept:"決策層", status:"停用", login:"2026/05/28 下午 04:20"},
    {name:"吳宗翰", email:"tsunghan.wu@gmail.com", role:"開發者", dept:"決策層", status:"啟用", login:"2026/06/14 下午 05:50"},
    {name:"許雅雯", email:"yawen.hsu@gmail.com", role:"成員", dept:"SEO 策略部", status:"啟用", login:"2026/06/13 上午 11:30"},
    {name:"鄭家豪", email:"chiahao.cheng@gmail.com", role:"部門主管", dept:"內容部", status:"啟用", login:"2026/06/10 下午 01:15"},
    {name:"楊婷婷", email:"tingting.yang@gmail.com", role:"成員", dept:"內容部", status:"啟用", login:"2026/06/12 下午 03:00"},
    {name:"劉建宏", email:"chienhung.liu@gmail.com", role:"成員", dept:"決策層", status:"停用", login:"2026/05/25 上午 09:10"},
    {name:"蔡欣怡", email:"hsinyi.tsai@gmail.com", role:"成員", dept:"SEO 策略部", status:"啟用", login:"2026/06/14 上午 07:55"},
    {name:"郭志明", email:"chihming.kuo@gmail.com", role:"開發者", dept:"決策層", status:"啟用", login:"2026/06/15 上午 01:20"},
    {name:"洪美惠", email:"meihui.hung@gmail.com", role:"成員", dept:"內容部", status:"啟用", login:"2026/06/11 下午 06:40"},
    {name:"謝佩珊", email:"peishan.hsieh@gmail.com", role:"成員", dept:"SEO 策略部", status:"停用", login:"2026/05/29 下午 02:05"},
    {name:"曾國強", email:"kuochiang.tseng@gmail.com", role:"部門主管", dept:"決策層", status:"啟用", login:"2026/06/13 上午 10:50"},
  ];
  const ROLE_BADGE = {"開發者":"purple","部門主管":"blue","成員":"blue"};
  let filters = {kw:"", role:"", dept:"", status:""};
  let page = 1; const PER = 20;

  function uniq(key){ return [...new Set(STAFF.map(s=>s[key]))]; }
  function buildSelectMenu(type, key, label){
    const menu = document.getElementById('menu-'+type);
    const opts = ['', ...uniq(key)];
    menu.innerHTML = opts.map(v=>`<div class="select-menu__item${filters[type]===v?' select-menu__item--active':''}" onclick="pickFilter(event,'${type}','${v.replace(/'/g,"")}','${label}')">${v===''?('所有'+label):v}</div>`).join('');
  }
  function toggleSelect(e, type){
    e.stopPropagation();
    document.querySelectorAll('.select-menu').forEach(m=>{ if(m.id!=='menu-'+type) m.classList.remove('select-menu--open'); });
    document.getElementById('menu-'+type).classList.toggle('select-menu--open');
  }
  function pickFilter(e, type, val, label){
    e.stopPropagation();
    filters[type] = val;
    const sel = document.getElementById('sel-'+type);
    // 更新顯示文字（保留 chevron）
    sel.childNodes[0].textContent = (val===''?('所有'+label):val) + ' ';
    sel.classList.toggle('select--active', val!=='');
    buildSelectMenu(type, type==='role'?'role':type==='dept'?'dept':'status', label);
    document.getElementById('menu-'+type).classList.remove('select-menu--open');
    page = 1; render();
  }
  function applyFilter(){ filters.kw = document.getElementById('kw').value.trim().toLowerCase(); page=1; render(); }

  function getFiltered(){
    return STAFF.filter(s=>{
      if(filters.kw && !(s.name.toLowerCase().includes(filters.kw)||s.email.toLowerCase().includes(filters.kw))) return false;
      if(filters.role && s.role!==filters.role) return false;
      if(filters.dept && s.dept!==filters.dept) return false;
      if(filters.status && s.status!==filters.status) return false;
      return true;
    });
  }
  function ic(p,c){ return `<svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${c||'#8C8C8C'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`; }
  const P = {
    eye:"<path d='M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z'/><circle cx='12' cy='12' r='3'/>",
    edit:"<path d='M17 3a2.828 2.828 0 114 4L7.5 20.5 2 22l1.5-5.5L17 3z'/>",
    trash:"<polyline points='3 6 5 6 21 6'/><path d='M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2'/>",
    more:"<circle cx='12' cy='12' r='1'/><circle cx='19' cy='12' r='1'/><circle cx='5' cy='12' r='1'/>",
    key:"<path d='M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4'/>",
    slash:"<circle cx='12' cy='12' r='10'/><line x1='4.93' y1='4.93' x2='19.07' y2='19.07'/>",
    logout:"<path d='M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4'/><polyline points='16 17 21 12 16 7'/><line x1='21' y1='12' x2='9' y2='12'/>",
  };
  function render(){
    const all = getFiltered();
    const totalPages = Math.max(1, Math.ceil(all.length/PER));
    if(page>totalPages) page=totalPages;
    const rows = all.slice((page-1)*PER, page*PER);
    const tb = document.getElementById('tbody');
    if(rows.length===0){
      tb.innerHTML = `<tr class="empty-row"><td colspan="7">沒有符合條件的員工</td></tr>`;
    } else {
      tb.innerHTML = rows.map((s,i)=>`
        <tr>
          <td class="col-name">${s.name}</td>
          <td class="col-email">${s.email}</td>
          <td class="col-role"><span class="badge badge-${ROLE_BADGE[s.role]}">${s.role}</span></td>
          <td>${s.dept}</td>
          <td class="col-status"><span class="badge ${s.status==='啟用'?'badge-success':'badge-muted'}">${s.status}</span></td>
          <td class="muted-time">${s.login}</td>
          <td class="col-action"><div class="row-actions">
            <div class="row-act" title="查看">${ic(P.eye)}</div>
            <div class="row-act" title="編輯">${ic(P.edit)}</div>
            <div class="row-act" title="刪除">${ic(P.trash)}</div>
            <div class="row-act" title="更多" onclick="toggleMore(event,${i})">${ic(P.more)}</div>
          </div></td>
        </tr>`).join('');
    }
    // 分頁
    const pag = document.getElementById('pagination');
    const from = all.length===0?0:(page-1)*PER+1, to = Math.min(page*PER, all.length);
    let pages = '';
    pages += `<div class="page-btn ${page===1?'page-btn--disabled':''}" onclick="${page===1?'':'goPage('+(page-1)+')'}">‹</div>`;
    for(let p=1;p<=totalPages;p++) pages += `<div class="page-btn ${p===page?'page-btn--active':''}" onclick="goPage(${p})">${p}</div>`;
    pages += `<div class="page-btn ${page===totalPages?'page-btn--disabled':''}" onclick="${page===totalPages?'':'goPage('+(page+1)+')'}">›</div>`;
    pag.innerHTML = `<span class="pagination__info">顯示 ${from}–${to}，共 ${all.length} 筆</span><div class="pagination__pages">${pages}</div>`;
  }
  function goPage(p){ page=p; render(); }

  // 更多選單：開啟時移到 <body>（徹底脫離表格 overflow 容器，不被裁切）
  function closeAllMore(){
    const m = document.getElementById('floating-more');
    if(m) m.remove();
  }
  function toggleMore(e, i){
    e.stopPropagation();
    const existed = document.getElementById('floating-more');
    closeAllMore();
    document.querySelectorAll('.select-menu').forEach(m=>m.classList.remove('select-menu--open'));
    if(existed && existed.dataset.row==String(i)) return;   // 點同一顆 → 收合
    const btn = e.currentTarget.getBoundingClientRect();
    const menu = document.createElement('div');
    menu.id = 'floating-more'; menu.dataset.row = i;
    menu.className = 'more-menu more-menu--open';
    menu.style.top = (btn.bottom+4)+'px';
    menu.style.left = (btn.right-140)+'px';
    menu.innerHTML = `
      <div class="more-menu__item">${ic(P.key)}重設密碼</div>
      <div class="more-menu__item">${ic(P.slash)}停用</div>
      <div class="more-menu__item">${ic(P.logout)}離職交接</div>`;
    menu.addEventListener('click', e2=>e2.stopPropagation());
    document.body.appendChild(menu);
  }
  document.addEventListener('click', function(){
    closeAllMore();
    document.querySelectorAll('.select-menu').forEach(m=>m.classList.remove('select-menu--open'));
  });
  window.addEventListener('scroll', closeAllMore, true);   // 卷動時關閉（位置會跑掉）

  // 初始化
  buildSelectMenu('role','role','角色');
  buildSelectMenu('dept','dept','部門');
  buildSelectMenu('status','status','狀態');
  render();
</script>
</body>
</html>
