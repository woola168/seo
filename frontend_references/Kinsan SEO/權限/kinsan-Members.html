/* ══════════════════════════════════════════════════════════
   NAV COMPONENTS — exactly per younilab-設計規範 Sidebar spec
   Icons: 20px for nav items per Iconography spec
   Active group: fontWeight 600, chevron #0A2B41
   Sub-item: padding 8px 16px (wider horizontal)
   Section header: padding-top 20px
══════════════════════════════════════════════════════════ */
function NavSection({label}){
  return <div style={{fontSize:11,fontWeight:500,letterSpacing:"0.06em",textTransform:"uppercase",color:"#BFBFBF",padding:"20px 16px 6px"}}>{label}</div>;
}

function NavItem({item,activeId,onSelect,collapsed,expanded,onToggle,sub=false}){
  const [hov,setHov] = useState(false);

  /* active: direct match OR any child matches */
  const isActive = activeId===item.id
    || (item.children&&item.children.some(c=>c.id===activeId));
  const isExp = expanded[item.id];

  if(item.type==="section") return collapsed ? null : <NavSection label={item.label}/>;

  const handleClick = () => {
    if(item.children) onToggle(item.id);
    else onSelect(item.id);
  };

  /* Colour + weight rules (per spec + Figma)
     Group 有子選單時：active 只改顏色/字重，背景保持透明 */
  const hasChildren = !!item.children;
  const fg       = isActive ? "#0A2B41" : "#595959";
  const iconCol  = isActive ? "#0A2B41" : "#8C8C8C";
  const bgCol    = isActive
    ? (hasChildren ? "transparent" : "#E7EAEC")  /* group = 無底色 */
    : hov ? "#FAFAFA" : "transparent";
  const fw       = isActive ? (hasChildren ? 600 : 500) : 400;

  return (
    <>
      <div onClick={handleClick}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        title={collapsed&&!sub ? item.label : undefined}
        style={{
          display:"flex", alignItems:"center",
          gap: (collapsed&&!sub) ? 0 : 8,
          /* Sub: 8px 16px / Parent: 10px 12px */
          padding: sub ? "8px 16px" : (collapsed ? "10px 0" : "10px 12px"),
          margin:"1px 8px", borderRadius:8, cursor:"pointer",
          justifyContent:(collapsed&&!sub)?"center":"flex-start",
          background: bgCol,
          color: fg,
          fontWeight: fw,
          /* Sub 13px / Parent 14px */
          fontSize: sub ? 13 : 14,
          transition:"all .12s",
          position:"relative",
        }}>
        {/* ── Icon: 20px for nav items per spec Iconography 尺寸階 ── */}
        {!sub && !collapsed && <FI name={item.icon} size={20} color={iconCol}/>}
        {!sub && collapsed  && <FI name={item.icon} size={20} color={iconCol}/>}
        {/* Sub-item: 前綴圓點 5×5 active #0A2B41 / default #BFBFBF / marginLeft 6px */}
        {sub && (
          <div style={{width:5,height:5,borderRadius:"50%",background:isActive?"#0A2B41":"#BFBFBF",marginLeft:6,flexShrink:0}}/>
        )}
        {!collapsed && <span style={{flex:1,whiteSpace:"nowrap"}}>{item.label}</span>}
        {/* Badge */}
        {!collapsed && !sub && item.badge && (
          <span style={{minWidth:18,height:18,borderRadius:9,background:item.badgeColor||"#F5222D",color:"#fff",fontSize:11,fontWeight:600,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 5px",flexShrink:0}}>
            {item.badge}
          </span>
        )}
        {/* Badge dot (collapsed) */}
        {collapsed && !sub && item.badge && (
          <div style={{position:"absolute",top:7,right:7,width:7,height:7,borderRadius:"50%",background:item.badgeColor||"#F5222D",border:"1.5px solid #fff"}}/>
        )}
        {/* Chevron — active group: #0A2B41, else #BFBFBF (per Figma) */}
        {!collapsed && item.children && (
          <FI name={isExp?"chevron-up":"chevron-right"} size={14}
            color={isActive?"#0A2B41":"#BFBFBF"}/>
        )}
      </div>
      {/* Children — paddingLeft:10 per spec */}
      {item.children && isExp && !collapsed && (
        <div style={{paddingLeft:10}}>
          {item.children.map(c=>(
            <NavItem key={c.id} item={{...c,type:"item",icon:""}} activeId={activeId}
              onSelect={onSelect} collapsed={false} expanded={{}} onToggle={()=>{}} sub/>
          ))}
        </div>
      )}
    </>
  );
}

/* Button — per spec sizes & variants */
function Btn({children,variant="primary",size="md",onClick,style={}}){
  const [hov,setHov]=useState(false);
  const h=size==="sm"?32:size==="lg"?44:40;
  const px=size==="sm"?12:size==="lg"?20:16;
  const fs=size==="sm"?12:size==="lg"?15:14;
  const base={height:h,padding:`0 ${px}px`,borderRadius:8,fontSize:fs,fontWeight:500,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,outline:"none",transition:"all .15s",whiteSpace:"nowrap",fontFamily:"var(--font)",border:"none"};
  const v={
    primary:  {border:"1px solid var(--primary)",background:hov?"var(--primary-hover)":"var(--primary)",color:"#fff"},
    secondary:{border:"1px solid var(--border)",background:hov?"var(--bg-2)":"#fff",color:"var(--fg)"},
    ghost:    {border:"1px solid transparent",background:hov?"var(--bg-2)":"transparent",color:"var(--fg-2)"},
  }[variant]||{};
  return <button onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{...base,...v,...style}}>{children}</button>;
}

/* Top Header Icon Button — 18px icon, 32×32, radius 6 per spec */
function IconBtn({name,title,badge,onClick}){
  const [hov,setHov]=useState(false);
  return(
    <div style={{position:"relative"}}>
      <div title={title} onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",background:hov?"#F0F0F0":"transparent",transition:"background .12s",flexShrink:0}}>
        {/* Top Header icons: 18px per spec */}
        <FI name={name} size={18} color="#595959"/>
      </div>
      {badge&&<div style={{position:"absolute",top:5,right:6,width:8,height:8,borderRadius:"50%",background:"#F5222D",border:"1.5px solid #fff",pointerEvents:"none"}}/>}
    </div>
  );
}

/* ─── Multi-Select Dropdown ───
   即點即用，無需 apply 動作
   按鈕樣式：
     default: 白底灰框
     active (有選):  bg #E6F4FF / border #91CAFF / text #0958D9
   面板：position:fixed, 含搜尋框（>=8 項才顯示）+ 全選/全不選 + checkbox list
─────────────────────────────────────────── */
function MultiDropdown({label,options,selected,onChange,searchable=false}){
  const [open,setOpen]=useState(false);
  const [pos,setPos]=useState(null);
  const [q,setQ]=useState("");
  const btnRef=useRef(null);
  const isActive=selected.length>0;
  const showSearch=searchable&&options.length>=8;

  const toggle=()=>{
    if(!open){
      const r=btnRef.current?.getBoundingClientRect();
      if(r) setPos({top:r.bottom+4,left:r.left});
      setQ("");
    }
    setOpen(o=>!o);
  };
  const close=()=>setOpen(false);
  const toggleOpt=(v)=>onChange(selected.includes(v)?selected.filter(x=>x!==v):[...selected,v]);
  const filteredOpts=q?options.filter(o=>o.toLowerCase().includes(q.toLowerCase())):options;
  const allSelected=options.every(o=>selected.includes(o));
  const toggleAll=()=>onChange(allSelected?[]:[...options]);

  /* close on scroll */
  useEffect(()=>{
    const h=()=>{if(open)close();};
    window.addEventListener("scroll",h,true);
    return()=>window.removeEventListener("scroll",h,true);
  },[open]);

  /* button label: "Status" / "Status · 2" */
  const buttonLabel=isActive?`${label} · ${selected.length}`:label;

  return(
    <>
      <button ref={btnRef} onClick={toggle}
        style={{
          height:40,padding:"0 12px",borderRadius:8,
          display:"inline-flex",alignItems:"center",gap:6,
          fontSize:14,cursor:"pointer",fontFamily:"var(--font)",flexShrink:0,
          transition:"all .15s",whiteSpace:"nowrap",
          background:open||isActive?"#E6F4FF":"#fff",
          border:"1px solid "+(open||isActive?"#91CAFF":"#D9D9D9"),
          color:open||isActive?"#0958D9":"#1F1F1F",
          fontWeight:isActive?500:400,
        }}>
        {buttonLabel}
        <FI name="chevron-down" size={12} color={open||isActive?"#0958D9":"#8C8C8C"}/>
      </button>
      {open&&pos&&(
        <>
          <div onClick={close} style={{position:"fixed",inset:0,zIndex:99}}/>
          <div style={{
            position:"fixed",top:pos.top,left:pos.left,
            minWidth:220,maxWidth:300,
            background:"#fff",border:"1px solid #E7EAEC",borderRadius:10,
            boxShadow:"0 4px 16px rgba(0,0,0,0.08)",
            zIndex:100,padding:8,
            maxHeight:"calc(100vh - 120px)",overflowY:"auto",
          }} onClick={e=>e.stopPropagation()}>
            {/* Search — only when ≥8 options */}
            {showSearch&&(
              <div style={{position:"relative",marginBottom:8}}>
                <div style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
                  <FI name="search" size={12} color="#BFBFBF"/>
                </div>
                <input value={q} onChange={e=>setQ(e.target.value)} autoFocus
                  placeholder={`搜尋 ${label}…`}
                  style={{width:"100%",height:32,padding:"0 10px 0 28px",fontSize:13,color:"#1F1F1F",border:"1px solid #D9D9D9",borderRadius:6,outline:"none",background:"#fff",fontFamily:"var(--font)"}}
                  onFocus={e=>e.target.style.borderColor="#0A2B41"}
                  onBlur={e=>e.target.style.borderColor="#D9D9D9"}/>
              </div>
            )}
            {/* All toggle — only when ≥3 options & no search query */}
            {options.length>=3&&!q&&(
              <div onClick={toggleAll}
                style={{display:"flex",alignItems:"center",gap:6,padding:"6px 8px",borderRadius:6,fontSize:12,color:"#1677FF",cursor:"pointer",fontWeight:500,marginBottom:2}}
                onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {allSelected?"取消全選":"全選"}
              </div>
            )}
            {/* Options */}
            <div>
              {filteredOpts.length>0
                ? filteredOpts.map(opt=>(
                    <div key={opt} onClick={()=>toggleOpt(opt)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:6,cursor:"pointer",fontSize:13,color:"#434343"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <div style={{width:16,height:16,borderRadius:4,border:`1.5px solid ${selected.includes(opt)?"#0A2B41":"#D9D9D9"}`,background:selected.includes(opt)?"#0A2B41":"#fff",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .12s"}}>
                        {selected.includes(opt)&&<FI name="check" size={11} color="#fff"/>}
                      </div>
                      <span>{opt}</span>
                    </div>
                  ))
                : <div style={{padding:"16px 8px",fontSize:12,color:"#BFBFBF",textAlign:"center"}}>找不到相符項目</div>
              }
            </div>
          </div>
        </>
      )}
    </>
  );
}

/* Auto-select pattern:
   篩選欄位數 ≤ 3 → 使用多 Dropdown（即點即用，每欄位獨立）
   篩選欄位數 > 3 → 應改回 Filter Panel（一鍵展開整版）
   本頁有 3 個欄位（Status / Locale / Customer），剛好用 Multi-Dropdown */

/* ─── Project Drawer — per younilab Drawer spec
   width 480px (規範 default 400 → 加寬容納 3-col grid)
   header 20px 24px / body 20px 24px / footer 16px 24px
   overlay rgba(0,0,0,0.4) + blur(2px)
   slideIn 250ms ease from right
─────────────────────────────────────────── */
function StaffDrawer({open,onClose,onSubmit,deptOptions,onCreateDept,editStaff}){
  const [vis,setVis]=useState(false);
  const [name,setName]=useState("");
  const [email,setEmail]=useState("");
  const [role,setRole]=useState("開發者");
  const [dept,setDept]=useState("SEO 策略部");
  const [errors,setErrors]=useState({});

  /* inline 新增部門模式 */
  const [showNewDept,setShowNewDept]=useState(false);
  const [newDeptName,setNewDeptName]=useState("");
  const [newDeptDesc,setNewDeptDesc]=useState("");
  const [newDeptErrors,setNewDeptErrors]=useState({});

  const isEdit=!!editStaff;

  /* 開啟時：若 edit 模式，預填 editStaff 資料 */
  useEffect(()=>{
    if(open){
      if(editStaff){
        setName(editStaff.name);
        setEmail(editStaff.email);
        setRole(editStaff.role);
        setDept(editStaff.dept);
      } else {
        setName("");setEmail("");setRole("開發者");setDept("SEO 策略部");
      }
      setErrors({});
      setShowNewDept(false);
      setNewDeptName("");setNewDeptDesc("");setNewDeptErrors({});
      const t=setTimeout(()=>setVis(true),10);
      return()=>clearTimeout(t);
    } else {
      setVis(false);
    }
  },[open,editStaff]);

  useEffect(()=>{
    if(!open) return;
    const h=e=>{if(e.key==="Escape") handleClose();};
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
    // eslint-disable-next-line
  },[open]);

  const handleClose=()=>{
    setVis(false);
    setTimeout(()=>{
      onClose();
      setName("");setEmail("");setRole("開發者");setDept("SEO 策略部");
      setErrors({});
      setShowNewDept(false);
      setNewDeptName("");setNewDeptDesc("");setNewDeptErrors({});
    },250);
  };

  const validate=()=>{
    const e={};
    if(!name.trim())  e.name="請輸入姓名";
    if(!email.trim()) e.email="請輸入 Email";
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) e.email="Email 格式不正確";
    setErrors(e);
    return Object.keys(e).length===0;
  };

  const handleSubmit=()=>{
    if(!validate()) return;
    if(isEdit){
      onSubmit({
        ...editStaff,
        name:name.trim(),
        email:email.trim(),
        role,
        dept,
      });
    } else {
      onSubmit({
        id:"s"+Date.now(),
        name:name.trim(),
        email:email.trim(),
        role,
        dept,
        status:"啟用",
        lastLogin:"—",
      });
    }
    handleClose();
  };

  if(!open) return null;

  return(
    <>
      <div onClick={handleClose}
        style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",backdropFilter:"blur(2px)",zIndex:300,opacity:vis?1:0,transition:"opacity 250ms ease"}}/>
      <div role="dialog" aria-modal="true"
        style={{position:"fixed",top:0,right:0,bottom:0,width:480,maxWidth:"90vw",background:"#fff",boxShadow:"-4px 0 24px rgba(0,0,0,0.1)",zIndex:301,display:"flex",flexDirection:"column",transform:vis?"translateX(0)":"translateX(100%)",transition:"transform 250ms ease"}}>

        {/* Header */}
        <div style={{padding:"20px 24px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12,flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:600,color:"#1F1F1F"}}>{isEdit?"編輯成員":"建立成員"}</div>
          <div onClick={handleClose}
            style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"background .12s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="x" size={18} color="#595959"/>
          </div>
        </div>

        {/* Body — 一行一欄 */}
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>

          {/* 1. 姓名 */}
          <Field label="姓名" required error={errors.name}>
            <input value={name}
              onChange={e=>{setName(e.target.value);setErrors({...errors,name:undefined});}}
              placeholder="請輸入成員姓名"
              style={inputStyle(errors.name)}
              onFocus={e=>!errors.name&&(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
              onBlur={e=>(e.target.style.borderColor=errors.name?"#F5222D":"#D9D9D9",e.target.style.boxShadow="none")}/>
          </Field>

          {/* 2. Email */}
          <Field label="Email" required error={errors.email}>
            <input type="email" value={email}
              onChange={e=>{setEmail(e.target.value);setErrors({...errors,email:undefined});}}
              placeholder="example@kinsan.com"
              style={inputStyle(errors.email)}
              onFocus={e=>!errors.email&&(e.target.style.borderColor="#0A2B41",e.target.style.boxShadow="0 0 0 3px rgba(10,43,65,0.08)")}
              onBlur={e=>(e.target.style.borderColor=errors.email?"#F5222D":"#D9D9D9",e.target.style.boxShadow="none")}/>
          </Field>

          {/* 3. 角色 */}
          <Field label="角色" required>
            <Select value={role} onChange={setRole} options={ROLE_OPTIONS}/>
          </Field>

          {/* 4. 部門 — 含 inline 快建 */}
          <Field label="部門" required>
            {showNewDept
              ? (
                /* inline 新建表單 */
                <div style={{border:"1px solid #D9D9D9",borderRadius:8,padding:14,background:"#FAFAFA"}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#1F1F1F",marginBottom:10}}>建立新部門</div>
                  {/* 部門名稱 */}
                  <div style={{marginBottom:10}}>
                    <label style={{display:"block",fontSize:12,color:"#595959",marginBottom:4}}>
                      部門名稱<span style={{color:"#F5222D",marginLeft:2}}>*</span>
                    </label>
                    <input value={newDeptName}
                      onChange={e=>{setNewDeptName(e.target.value);setNewDeptErrors({...newDeptErrors,name:undefined});}}
                      placeholder="例如：產品部"
                      style={inputStyle(newDeptErrors.name)}/>
                    {newDeptErrors.name&&(
                      <div style={{fontSize:12,color:"#F5222D",marginTop:4}}>{newDeptErrors.name}</div>
                    )}
                  </div>
                  {/* 描述 */}
                  <div style={{marginBottom:12}}>
                    <label style={{display:"block",fontSize:12,color:"#595959",marginBottom:4}}>
                      描述<span style={{color:"#F5222D",marginLeft:2}}>*</span>
                    </label>
                    <textarea value={newDeptDesc}
                      onChange={e=>{setNewDeptDesc(e.target.value);setNewDeptErrors({...newDeptErrors,desc:undefined});}}
                      rows={2}
                      placeholder="說明此部門的職責"
                      style={{
                        width:"100%",minHeight:64,padding:"8px 12px",
                        fontSize:14,color:"#1F1F1F",
                        border:`1px solid ${newDeptErrors.desc?"#F5222D":"#D9D9D9"}`,
                        borderRadius:8,outline:"none",background:"#fff",
                        fontFamily:"var(--font)",lineHeight:1.5,resize:"vertical",
                        boxSizing:"border-box",
                      }}/>
                    {newDeptErrors.desc&&(
                      <div style={{fontSize:12,color:"#F5222D",marginTop:4}}>{newDeptErrors.desc}</div>
                    )}
                  </div>
                  {/* 操作: 取消 / 建立並選用 */}
                  <div style={{display:"flex",justifyContent:"flex-end",gap:8}}>
                    <Btn variant="secondary" size="sm" onClick={()=>{
                      setShowNewDept(false);
                      setNewDeptName("");setNewDeptDesc("");setNewDeptErrors({});
                    }}>取消</Btn>
                    <Btn variant="primary" size="sm" onClick={()=>{
                      const e={};
                      if(!newDeptName.trim()) e.name="請輸入部門名稱";
                      if(!newDeptDesc.trim()) e.desc="請輸入描述";
                      /* 重名檢查 */
                      if(newDeptName.trim()&&deptOptions.includes(newDeptName.trim())){
                        e.name="部門名稱已存在";
                      }
                      setNewDeptErrors(e);
                      if(Object.keys(e).length>0) return;
                      /* 通知 parent 新增 + 自動選用 */
                      const nm=newDeptName.trim();
                      onCreateDept({name:nm,description:newDeptDesc.trim()});
                      setDept(nm);
                      setShowNewDept(false);
                      setNewDeptName("");setNewDeptDesc("");setNewDeptErrors({});
                    }}>建立並選用</Btn>
                  </div>
                </div>
              )
              : (
                /* 正常模式: Select + 新增按鈕 */
                <div style={{display:"flex",gap:8,alignItems:"stretch"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <Select value={dept} onChange={setDept} options={deptOptions}/>
                  </div>
                  <Btn variant="secondary" onClick={()=>setShowNewDept(true)}>
                    <FI name="plus" size={14} color="#595959"/>新增部門
                  </Btn>
                </div>
              )
            }
          </Field>
        </div>

        {/* Footer */}
        <div style={{padding:"16px 24px",borderTop:"1px solid #F0F0F0",display:"flex",justifyContent:"flex-end",gap:8,flexShrink:0}}>
          <Btn variant="secondary" onClick={handleClose}>取消</Btn>
          <Btn variant="primary" onClick={handleSubmit}>確認</Btn>
        </div>
      </div>
    </>
  );
}

/* ── Section Header — overline 11px / 600 / uppercase 規範
   支援自訂 style，方便調整 marginTop（分組間距） ── */
function SectionHeader({children,style={}}){
  return(
    <div style={{
      fontSize:11,fontWeight:600,
      color:"#8C8C8C",
      letterSpacing:"0.06em",textTransform:"uppercase",
      marginBottom:14,
      ...style,
    }}>{children}</div>
  );
}

/* ── Section Divider — 1px / #F0F0F0 / 20px vertical margin
   ⚠️ 目前 ProjectDrawer 用距離取代，保留元件供未來頁面用 ── */
function SectionDivider(){
  return <div style={{height:1,background:"#F0F0F0",margin:"20px 0"}}/>;
}

/* ── Field wrapper ── 
   marginBottom 20px 為統一垂直節奏
   noGap=true：grid 容器內的子 Field，外層 grid 已用 gap 控制，內部不再加 mb */
function Field({label,required,hint,error,children,noGap}){
  return(
    <div style={{marginBottom:noGap?0:20}}>
      <div style={{display:"flex",alignItems:"baseline",justifyContent:"space-between",marginBottom:6}}>
        <label style={{fontSize:13,fontWeight:500,color:"#1F1F1F"}}>
          {label}
          {required&&<span style={{color:"#F5222D",marginLeft:3}}>*</span>}
        </label>
        {hint&&<span style={{fontSize:11,color:"#BFBFBF"}}>{hint}</span>}
      </div>
      {children}
      {error&&(
        <div style={{display:"flex",alignItems:"center",gap:4,marginTop:6,fontSize:12,color:"#CF1322"}}>
          <FI name="alert-circle" size={12} color="#CF1322"/>
          {error}
        </div>
      )}
    </div>
  );
}

/* ── Confirm Dialog — modal 確認視窗（刪除類危險操作） ── */
function ConfirmDialog({open,title,message,confirmLabel="確認",confirmVariant="danger",onConfirm,onCancel}){
  const [vis,setVis]=useState(false);

  useEffect(()=>{
    if(open){const t=setTimeout(()=>setVis(true),10);return()=>clearTimeout(t);}
    else setVis(false);
  },[open]);

  useEffect(()=>{
    if(!open) return;
    const h=e=>{if(e.key==="Escape") onCancel();};
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[open,onCancel]);

  if(!open) return null;

  /* confirm 按鈕配色: 統一用 navy primary（站台不使用紅色按鈕） */
  const confirmBg="#0A2B41";
  const confirmHover="#2E4A5E";

  return(
    <>
      {/* Overlay */}
      <div onClick={onCancel}
        style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",backdropFilter:"blur(2px)",zIndex:400,opacity:vis?1:0,transition:"opacity 200ms ease"}}/>
      {/* Modal */}
      <div role="dialog" aria-modal="true"
        style={{
          position:"fixed",top:"50%",left:"50%",
          transform:`translate(-50%,-50%) scale(${vis?1:0.96})`,
          opacity:vis?1:0,
          width:400,maxWidth:"calc(100vw - 32px)",
          background:"#fff",borderRadius:12,
          boxShadow:"0 12px 40px rgba(0,0,0,0.16)",
          zIndex:401,
          transition:"opacity 200ms ease, transform 200ms ease",
          display:"flex",flexDirection:"column",
        }}>
        {/* Body */}
        <div style={{padding:"24px 24px 8px"}}>
          <div style={{fontSize:16,fontWeight:600,color:"#1F1F1F",marginBottom:8}}>{title}</div>
          <div style={{fontSize:14,color:"#595959",lineHeight:1.6}}>{message}</div>
        </div>
        {/* Footer */}
        <div style={{padding:"16px 24px 20px",display:"flex",justifyContent:"flex-end",gap:8}}>
          <button onClick={onCancel}
            style={{height:36,padding:"0 16px",borderRadius:8,border:"1px solid #D9D9D9",background:"#fff",color:"#434343",fontSize:14,fontFamily:"var(--font)",cursor:"pointer",transition:"background .12s"}}
            onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
            onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
            取消
          </button>
          <button onClick={onConfirm}
            style={{height:36,padding:"0 16px",borderRadius:8,border:"none",background:confirmBg,color:"#fff",fontSize:14,fontWeight:500,fontFamily:"var(--font)",cursor:"pointer",transition:"background .12s"}}
            onMouseEnter={e=>e.currentTarget.style.background=confirmHover}
            onMouseLeave={e=>e.currentTarget.style.background=confirmBg}>
            {confirmLabel}
          </button>
        </div>
      </div>
    </>
  );
}

/* ── Input style helper ── */
const inputStyle=(error)=>({
  width:"100%",height:40,padding:"0 12px",
  fontSize:14,color:"#1F1F1F",
  border:`1px solid ${error?"#F5222D":"#D9D9D9"}`,
  borderRadius:8,outline:"none",background:"#fff",
  fontFamily:"var(--font)",
  transition:"border-color .12s, box-shadow .12s",
  boxSizing:"border-box",
});

/* ── Native-styled Select ── */
function Select({value,onChange,options}){
  const [hov,setHov]=useState(false);
  return(
    <div style={{position:"relative"}}>
      <select value={value} onChange={e=>onChange(e.target.value)}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{
          width:"100%",height:40,padding:"0 32px 0 12px",
          fontSize:14,color:"#1F1F1F",
          border:`1px solid ${hov?"#C4CDD3":"#D9D9D9"}`,
          borderRadius:8,outline:"none",background:"#fff",
          fontFamily:"var(--font)",cursor:"pointer",
          appearance:"none",WebkitAppearance:"none",
          transition:"border-color .12s",
          boxSizing:"border-box",
        }}>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      {/* Custom chevron */}
      <div style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
        <FI name="chevron-down" size={14} color="#8C8C8C"/>
      </div>
    </div>
  );
}

/* ─── Row Action Button — younilab-設計規範 spec
   24×24 圓形 / bg #F0F0F0 → hover #E5E5E5
   icon 14px #595959 → hover #434343 / 統一灰階
   Tooltip: bottom 32px, #1F1F1F bg, 12px, radius 6
─────────────────────────────────────────────── */
function RowAction({name,label,onClick}){
  const [hov,setHov]=useState(false);
  return(
    <div style={{position:"relative",flexShrink:0}}>
      {hov&&(
        <div style={{position:"absolute",bottom:32,left:"50%",transform:"translateX(-50%)",background:"#1F1F1F",color:"#fff",fontSize:12,padding:"5px 10px",borderRadius:6,whiteSpace:"nowrap",zIndex:60,pointerEvents:"none"}}>
          {label}
        </div>
      )}
      <div onClick={e=>{e.stopPropagation();onClick&&onClick(e);}}
        onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
        style={{width:24,height:24,borderRadius:"50%",background:hov?"#E5E5E5":"#F0F0F0",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"background .12s"}}>
        <FI name={name} size={14} color={hov?"#434343":"#595959"}/>
      </div>
    </div>
  );
}

/* ─── Project Row — sticky right action column ─── */
function StaffRow({staff,isLast,onEdit,onDelete}){

  const bb=isLast?"none":"1px solid #F5F5F5";

    <tr onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{background:hov?"#FAFAFA":"#fff",transition:"background .1s",height:56}}>

        <span style={{fontSize:14,fontWeight:600,color:"var(--fg)"}}>{staff.name}</span>
      </td>
      {/* Email */}
      <td style={{padding:"8px 16px",borderBottom:bb,fontSize:13,fontFamily:"var(--mono)",color:"var(--fg-2)",whiteSpace:"nowrap",verticalAlign:"middle"}}>{staff.email}</td>
      {/* 角色 */}
      <td style={{padding:"8px 16px",borderBottom:bb,whiteSpace:"nowrap",verticalAlign:"middle"}}><RoleBadge role={staff.role}/></td>
      {/* 部門 */}
      <td style={{padding:"8px 16px",borderBottom:bb,fontSize:13,color:"var(--fg-2)",whiteSpace:"nowrap",verticalAlign:"middle"}}>{staff.dept}</td>
      {/* 狀態 */}
      <td style={{padding:"8px 16px",borderBottom:bb,whiteSpace:"nowrap",verticalAlign:"middle"}}><ProjStatusBadge status={staff.status}/></td>
      {/* 最後登入 */}
      <td style={{padding:"8px 16px",borderBottom:bb,fontSize:13,fontFamily:"var(--mono)",color:"var(--fg-3)",whiteSpace:"nowrap",verticalAlign:"middle"}}>{staff.lastLogin}</td>
      {/* Actions — 檢視 / 編輯 / 刪除 */}
      <td style={{padding:"8px 16px",borderBottom:bb,position:"sticky",right:0,background:hov?"#FAFAFA":"#fff",boxShadow:"-4px 0 8px -4px rgba(0,0,0,0.06)",verticalAlign:"middle"}}>
        <div style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:8}}>
          <RowAction name="eye"     label="檢視"/>
          <RowAction name="edit-2"  label="編輯" onClick={()=>onEdit(staff)}/>
          <RowAction name="trash-2" label="刪除" onClick={()=>onDelete(staff)}/>
        </div>
      </td>
    </tr>
  );
}

/* ══════════════════════════════════════════════════════════
   PERMISSIONS / STAFF PAGE
══════════════════════════════════════════════════════════ */
function PermissionsStaffPage({windowWidth}){
  const isWide=windowWidth>=1024;
  const pad=isWide?"24px 32px":"16px 20px";

  const [staff,setStaff]=useState(STAFF_DATA);
  /* 部門 options 用 state 管理，支援 inline 新增 (本檔 session 內有效，不跨檔同步) */
  const [deptOptions,setDeptOptions]=useState(DEPT_OPTIONS);
  const [search,setSearch]=useState("");
  const [page,setPage]=useState(1);
  const PER=10;
  const MIN_TABLE_H=PER*56;

  /* drawer: 雙模式 — 新增 (editingStaff=null) / 編輯 (editingStaff=staff) */
  const [drawerOpen,setDrawerOpen]=useState(false);
  const [editingStaff,setEditingStaff]=useState(null);

  const openCreate=()=>{setEditingStaff(null);setDrawerOpen(true);};
  const openEdit=(s)=>{setEditingStaff(s);setDrawerOpen(true);};
  const closeDrawer=()=>{setDrawerOpen(false);setEditingStaff(null);};

  /* 統一處理新增 / 編輯 */
  const handleSubmit=(s)=>{
    setStaff(prev=>{
      const exists=prev.some(x=>x.id===s.id);
      if(exists){
        return prev.map(x=>x.id===s.id?s:x);
      } else {
        setPage(1);
        return [s,...prev];
      }
    });
  };

  /* 刪除確認 modal */
  const [deleteTarget,setDeleteTarget]=useState(null);
  const askDelete=(s)=>setDeleteTarget(s);
  const cancelDelete=()=>setDeleteTarget(null);
  const confirmDelete=()=>{
    if(!deleteTarget) return;
    setStaff(prev=>prev.filter(x=>x.id!==deleteTarget.id));
    setDeleteTarget(null);
  };

  /* inline 新建部門 → 加入 deptOptions */
  const handleCreateDept=({name,description})=>{
    setDeptOptions(prev=>prev.includes(name)?prev:[...prev,name]);
    /* 註：description 目前僅 demo 用，未真正寫入 Departments 資料庫 */
  };

  /* filters: 角色 / 部門 / 狀態 */
  const [fRole,setFRole]=useState([]);
  const [fDept,setFDept]=useState([]);
  const [fStatus,setFStatus]=useState([]);
  const updateFilter=(setter)=>(v)=>{setter(v);setPage(1);};

  const ALL_ROLES = ROLE_OPTIONS;
  const ALL_DEPTS = deptOptions;
  const ALL_STATUS= ["啟用","停用"];

  /* filter staff: search 姓名 + email */
  const filtered=staff.filter(s=>{
    const q=search.toLowerCase();
    if(q&&!s.name.toLowerCase().includes(q)&&!s.email.toLowerCase().includes(q)) return false;
    if(fRole.length&&!fRole.includes(s.role)) return false;
    if(fDept.length&&!fDept.includes(s.dept)) return false;
    if(fStatus.length&&!fStatus.includes(s.status)) return false;
    return true;
  });
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER));
  const pageRows=filtered.slice((page-1)*PER,page*PER);

  const totalActive=fRole.length+fDept.length+fStatus.length;
  const hasFilters=totalActive>0||search;
  const clearAll=()=>{
    setFRole([]);setFDept([]);setFStatus([]);
    setSearch("");setPage(1);
  };

  return(
    <main style={{padding:pad,background:"var(--bg-page)",minHeight:"calc(100vh - 56px)"}}>
      <div style={{maxWidth:1200,margin:"0 auto"}}>

        {/* Page Header */}
        <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:16,marginBottom:20,flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:200}}>
            <h1 style={{fontSize:20,fontWeight:600,margin:0,color:"var(--fg)",lineHeight:"28px"}}>成員管理</h1>
            <p style={{fontSize:13,color:"var(--fg-3)",margin:"4px 0 0",lineHeight:"20px"}}>
              管理成員帳號、角色與部門
            </p>
          </div>
          <div style={{display:"flex",gap:8,flexShrink:0,flexWrap:"wrap"}}>
            <Btn variant="primary" onClick={openCreate}>
              <FI name="plus" size={14} color="#fff"/>新增成員
            </Btn>
          </div>
        </div>

        {/* Staff Card */}
        <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12}}>

          <div style={{padding:"16px 20px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <span style={{fontSize:15,fontWeight:600,color:"var(--fg)"}}>成員管理</span>
            <span style={{fontSize:12,color:"var(--fg-3)"}}>共 {staff.length} 筆</span>
          </div>

          {/* Toolbar */}
          <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 16px",borderBottom:"1px solid #F0F0F0",flexWrap:"wrap",minHeight:64}}>
            <div style={{position:"relative",width:220,flexShrink:0}}>
              <div style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",pointerEvents:"none"}}>
                <FI name="search" size={14} color="#BFBFBF"/>
              </div>
              <input value={search} onChange={e=>{setSearch(e.target.value);setPage(1);}}
                placeholder="搜尋姓名、Email…"
                style={{width:"100%",height:40,padding:"0 12px 0 34px",fontSize:14,color:"#1F1F1F",border:"1px solid #D9D9D9",borderRadius:8,outline:"none",background:"#fff",fontFamily:"var(--font)"}}
                onFocus={e=>e.target.style.borderColor="#0A2B41"} onBlur={e=>e.target.style.borderColor="#D9D9D9"}/>
            </div>
            <MultiDropdown label="角色" options={ALL_ROLES}  selected={fRole}   onChange={updateFilter(setFRole)}/>
            <MultiDropdown label="部門" options={ALL_DEPTS}  selected={fDept}   onChange={updateFilter(setFDept)}/>
            <MultiDropdown label="狀態" options={ALL_STATUS} selected={fStatus} onChange={updateFilter(setFStatus)}/>
            {hasFilters&&(
              <span onClick={clearAll}
                style={{fontSize:13,color:"#8C8C8C",cursor:"pointer",marginLeft:4,transition:"color .12s"}}
                onMouseEnter={e=>e.currentTarget.style.color="#1F1F1F"}
                onMouseLeave={e=>e.currentTarget.style.color="#8C8C8C"}>
                清除全部
              </span>
            )}
          </div>

          {/* Table */}
          <div style={{overflowX:"auto",minHeight:MIN_TABLE_H}}>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:14,minWidth:980}}>
              <thead>
                <tr>
                  {[
                    {l:"姓名",     a:"left"},
                    {l:"Email",    a:"left"},
                    {l:"角色",     a:"left"},
                    {l:"部門",     a:"left"},
                    {l:"狀態",     a:"left"},
                    {l:"最後登入", a:"left"},
                    {l:"Actions",  a:"right", sticky:true},
                  ].map((h,i)=>(
                    <th key={i} style={{
                      textAlign:h.a,padding:"10px 16px",
                      fontWeight:500,color:"var(--fg-3)",fontSize:12,
                      borderBottom:"1px solid #F0F0F0",whiteSpace:"nowrap",
                      background:"#FAFAFA",
                      ...(h.sticky?{position:"sticky",right:0,boxShadow:"-4px 0 8px -4px rgba(0,0,0,0.06)"}:{})
                    }}>{h.l}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {pageRows.length>0
                  ? pageRows.map((s,i)=>(
                      <StaffRow key={s.id} staff={s} isLast={i===pageRows.length-1} onEdit={openEdit} onDelete={askDelete}/>
                    ))
                  : (
                    <tr><td colSpan={7} style={{padding:"56px 24px",textAlign:"center"}}>
                      <FI name="users" size={32} color="#D9D9D9" style={{margin:"0 auto 12px"}}/>
                      <div style={{fontSize:14,fontWeight:600,color:"var(--fg)",marginBottom:8}}>找不到符合條件的成員</div>
                      <div style={{fontSize:13,color:"var(--fg-3)",marginBottom:16}}>試試調整關鍵字或清除篩選條件</div>
                      <button onClick={clearAll}
                        style={{height:32,padding:"0 12px",borderRadius:8,border:"1px solid #D9D9D9",background:"#fff",color:"#595959",fontSize:13,fontFamily:"var(--font)",cursor:"pointer"}}>
                        清除所有篩選
                      </button>
                    </td></tr>
                  )
                }
              </tbody>
            </table>
          </div>

          {/* Pagination */}
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 16px",borderTop:"1px solid #F0F0F0",flexWrap:"wrap",gap:8}}>
            <span style={{fontSize:13,color:"var(--fg-3)"}}>
              顯示 {filtered.length===0?0:(page-1)*PER+1}–{Math.min(page*PER,filtered.length)}，共 {filtered.length} 筆
            </span>
            <div style={{display:"flex",gap:4}}>
              <div onClick={()=>page>1&&setPage(p=>p-1)}
                style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:page>1?"pointer":"default",color:page>1?"#595959":"#D9D9D9",border:"1px solid "+(page>1?"#D9D9D9":"#F0F0F0")}}>‹</div>
              {Array.from({length:totalPages},(_,i)=>i+1).map(p=>(
                <div key={p} onClick={()=>setPage(p)}
                  style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:"pointer",background:p===page?"var(--primary)":"transparent",color:p===page?"#fff":"#595959",border:p===page?"none":"1px solid #D9D9D9"}}>
                  {p}
                </div>
              ))}
              <div onClick={()=>page<totalPages&&setPage(p=>p+1)}
                style={{minWidth:32,height:32,padding:"0 8px",borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,cursor:page<totalPages?"pointer":"default",color:page<totalPages?"#595959":"#D9D9D9",border:"1px solid "+(page<totalPages?"#D9D9D9":"#F0F0F0")}}>›</div>
            </div>
          </div>
        </div>

      </div>

      {/* Drawer — 新增 / 編輯 */}
      <StaffDrawer
        open={drawerOpen}
        onClose={closeDrawer}
        onSubmit={handleSubmit}
        editStaff={editingStaff}
        deptOptions={deptOptions}
        onCreateDept={handleCreateDept}
      />

      {/* 刪除確認 modal */}
      <ConfirmDialog
        open={!!deleteTarget}
        title="刪除成員"
        message={deleteTarget?`確定要刪除「${deleteTarget.name}」嗎？此操作無法復原。`:""}
        confirmLabel="刪除"
        confirmVariant="danger"
        onConfirm={confirmDelete}
        onCancel={cancelDelete}
      />
    </main>
  );
}

function PlaceholderPage({label,windowWidth}){
  return(
    <main style={{padding:windowWidth>=1024?"24px 32px":"16px 20px",background:"var(--bg-page)",minHeight:"calc(100vh - 56px)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{maxWidth:1200,margin:"0 auto",textAlign:"center"}}>
        <div style={{width:64,height:64,borderRadius:16,background:"#E7EAEC",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px"}}>
          <FI name="grid" size={28} color="#8C8C8C"/>
        </div>
        <h2 style={{fontSize:18,fontWeight:600,color:"var(--fg)",margin:"0 0 8px"}}>{label}</h2>
        <p style={{fontSize:13,color:"var(--fg-3)",margin:0}}>此頁面正在開發中</p>
      </div>
    </main>
  );
}

/* ══════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════ */
function App(){
  const [activeId,setActiveId]=useState("permissions-staff");
  /* nav group expanded state */
  const [expanded,setExpanded]=useState({permissions:true});
  const [collapsed,setCollapsed]=useState(false);
  const [drawerOpen,setDrawer]=useState(false);
  const [userMenu,setUserMenu]=useState(false);
  const [ww,setWw]=useState(window.innerWidth);

  useEffect(()=>{
    const f=()=>{
      const w=window.innerWidth;
      setWw(w);
      if(w>=1024){setCollapsed(false);setDrawer(false);}
      else if(w>=768){setCollapsed(true);setDrawer(false);}
      else{setDrawer(false);}
    };
    f();
    window.addEventListener("resize",f);
    return()=>window.removeEventListener("resize",f);
  },[]);

  const isMobile=ww<768;
  const isDrawerMode=isMobile;
  const sw=isDrawerMode?0:(collapsed?56:240);

  const onSelect=id=>{setActiveId(id);setUserMenu(false);if(isDrawerMode)setDrawer(false);};
  const onToggle=id=>setExpanded(e=>({...e,[id]:!e[id]}));
  const crumbs=CRUMBS[activeId]||[activeId];

  const renderPage=()=>{
    if(activeId==="permissions-staff") return <PermissionsStaffPage windowWidth={ww}/>;
    const label=CRUMBS[activeId]?.slice(-1)[0]||activeId;
    return <PlaceholderPage label={label} windowWidth={ww}/>;
  };

  /* Sidebar inner */
  const SidebarContent=()=>(
    <>
      {/* Logo area — 56px per spec, logo hidden when collapsed */}
      <div style={{height:56,padding:"0 14px",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
        {(!collapsed||isDrawerMode)&&<KinsanLogo/>}
        {/* Toggle — 28×28, centered when collapsed per spec */}
        {!isDrawerMode&&(
          <div onClick={()=>setCollapsed(c=>!c)} title={collapsed?"展開":"收合"}
            style={{width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,marginLeft:collapsed?"auto":0,marginRight:collapsed?"auto":0}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            {/* sidebar icon: 18px per spec */}
            <FI name="sidebar" size={18} color="#8C8C8C"/>
          </div>
        )}
        {isDrawerMode&&(
          <div onClick={()=>setDrawer(false)}
            style={{width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
            onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="x" size={18} color="#8C8C8C"/>
          </div>
        )}
      </div>
      {/* Nav — 12px top padding */}
      <nav style={{flex:1,padding:"12px 0",overflowY:"auto",overflowX:"hidden"}}>
        {NAV.map((item,i)=>(
          <NavItem key={item.id||item.label||i} item={item}
            activeId={activeId} onSelect={onSelect}
            collapsed={collapsed&&!isDrawerMode}
            expanded={expanded} onToggle={onToggle}/>
        ))}
      </nav>
    </>
  );

  return(
    <div>
      {/* Drawer overlay */}
      {isDrawerMode&&drawerOpen&&(
        <div onClick={()=>setDrawer(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.4)",zIndex:199}}/>
      )}

      {/* Sidebar */}
      {isDrawerMode?(
        <aside style={{width:240,background:"#fff",borderRight:"1px solid #E7EAEC",position:"fixed",top:0,left:0,bottom:0,display:"flex",flexDirection:"column",zIndex:200,transform:drawerOpen?"translateX(0)":"translateX(-100%)",transition:"transform 250ms ease",overflowY:"auto",overflowX:"hidden"}}>
          <SidebarContent/>
        </aside>
      ):(
        <aside style={{width:collapsed?56:240,background:"#fff",borderRight:"1px solid #E7EAEC",position:"fixed",top:0,left:0,bottom:0,display:"flex",flexDirection:"column",zIndex:100,transition:"width 200ms ease",overflowY:"auto",overflowX:"hidden"}}>
          <SidebarContent/>
        </aside>
      )}

      {/* Main */}
      <div style={{marginLeft:sw,transition:"margin-left 200ms ease",height:"100vh",display:"flex",flexDirection:"column"}}>

        {/* Top Header — 56px per spec */}
        <header style={{height:56,background:"#fff",borderBottom:"1px solid #F0F0F0",display:"flex",alignItems:"center",padding:"0 16px",gap:8,flexShrink:0,zIndex:50}}>
          {/* Hamburger — mobile only */}
          {isDrawerMode&&(
            <div onClick={()=>setDrawer(o=>!o)}
              style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0}}
              onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"}
              onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
              <FI name="menu" size={18} color="#595959"/>
            </div>
          )}

          {/* Breadcrumbs — 14px per spec, separator #8C8C8C */}
          <nav style={{flex:1,display:"flex",alignItems:"center",gap:8,fontSize:14,overflow:"hidden",minWidth:0}}>
            {crumbs.map((c,i)=>(
              <React.Fragment key={i}>
                {i>0&&<span style={{color:"#8C8C8C",flexShrink:0,fontSize:14}}>/</span>}
                <span style={{
                  color:i===crumbs.length-1?"var(--fg)":"var(--fg-3)",
                  fontWeight:i===crumbs.length-1?500:400,
                  whiteSpace:"nowrap",
                  overflow:i===crumbs.length-1?"hidden":"visible",
                  textOverflow:"ellipsis",fontSize:14,
                }}>{c}</span>
              </React.Fragment>
            ))}
          </nav>

          {/* Right: search, bell, divider, avatar — per spec order */}
          <IconBtn name="search" title="搜尋 ⌘K"/>
          <IconBtn name="bell"   title="通知" badge/>
          <div style={{width:1,height:20,background:"#F0F0F0",margin:"0 2px",flexShrink:0}}/>

          {/* User menu */}
          <div onClick={()=>setUserMenu(o=>!o)}
            style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer",position:"relative",flexShrink:0}}>
            <Avatar initials="S" size={28} bg="#0A2B41"/>
            {ww>=640&&<FI name="chevron-down" size={13} color="#8C8C8C"/>}
            {userMenu&&(
              <>
                <div onClick={e=>{e.stopPropagation();setUserMenu(false);}} style={{position:"fixed",inset:0,zIndex:99}}/>
                <div style={{position:"absolute",top:40,right:0,width:200,background:"#fff",border:"1px solid #F0F0F0",borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.08)",padding:6,zIndex:100}}>
                  <div style={{padding:"8px 10px",borderBottom:"1px solid #F0F0F0",marginBottom:4}}>
                    <div style={{fontSize:13,fontWeight:600}}>金三 顧問</div>
                    <div style={{fontSize:11,color:"#8C8C8C"}}>kinsan@example.com</div>
                  </div>
                  {[["user","個人設定"],["settings","帳號設定"],["log-out","登出"]].map(([ic,lbl])=>(
                    <div key={lbl} onClick={()=>setUserMenu(false)}
                      style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:6,cursor:"pointer",fontSize:13,color:"#595959"}}
                      onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"}
                      onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <FI name={ic} size={14} color="#8C8C8C"/>{lbl}
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
        </header>

        {renderPage()}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
