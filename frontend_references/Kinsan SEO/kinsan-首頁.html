<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kinsan SEO — 後台（切版參照）</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   Design Tokens（對應 DESIGN.md，工程轉 React 時抽成 CSS variables / theme）
   ═══════════════════════════════════════════ */
:root {
  --primary:#0A2B41; --primary-hover:#2E4A5E; --primary-light:#E7EAEC;
  --info:#1677FF; --info-light:#E6F4FF; --info-text:#0958D9;
  --success-text:#389E0D; --warning-text:#D68C24; --error-text:#CF1322;
  --fg:#1F1F1F; --fg-2:#595959; --fg-3:#8C8C8C; --fg-4:#BFBFBF;
  --bg-page:#F5F5F5; --bg:#FFFFFF; --bg-2:#FAFAFA;
  --border:#D9D9D9; --border-subtle:#F0F0F0;
  --radius-card:12px; --radius-md:8px; --radius-sm:6px;
  --font:'Inter','Noto Sans TC',-apple-system,sans-serif;
  --mono:'IBM Plex Mono','Menlo',monospace;
  --sidebar-w:240px; --sidebar-w-collapsed:56px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:var(--font); background:var(--bg-page); color:var(--fg); -webkit-font-smoothing:antialiased; }
.ic { display:block; flex-shrink:0; }
/* ═══ 統一卷軸樣式（細灰、常駐）═══ */
* { scrollbar-width:thin; scrollbar-color:#D9D9D9 transparent; }   /* Firefox */
::-webkit-scrollbar { width:8px; height:8px; }                      /* 縱向 + 橫向同寬 */
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#D9D9D9; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:#BFBFBF; }
::-webkit-scrollbar-corner { background:transparent; }

/* ═══ Layout shell ═══ */
.app { display:flex; height:100vh; overflow:hidden; }

/* ═══ Sidebar → <Sidebar/> ═══ */
.sidebar { width:var(--sidebar-w); background:var(--bg); border-right:1px solid var(--border-subtle);
  position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; z-index:100; }
.sidebar__logo { height:56px; padding:0 14px; border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.sidebar__logo img { height:24px; width:auto; display:block; }
.sidebar__collapse { width:28px; height:28px; border-radius:var(--radius-sm); display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--fg-3); transition:background .12s; }
.sidebar__collapse:hover { background:var(--border-subtle); }
.sidebar__nav { flex:1; padding:4px 0; overflow-y:auto; }
.nav-group__title { font-size:12px; font-weight:400; letter-spacing:0.06em; text-transform:uppercase;
  color:var(--fg-4); padding:16px 16px 6px; }
.nav-item { display:flex; align-items:center; gap:8px; padding:10px 12px; margin:1px 8px;
  border-radius:var(--radius-md); cursor:pointer; font-size:14px; color:var(--fg-2); transition:background .12s; }
.nav-item:hover { background:var(--bg-2); }
.nav-item .ic { color:var(--fg-3); }
.nav-item--active { background:var(--primary-light); color:var(--primary); font-weight:500; }
.nav-item--active .ic { color:var(--primary); }

/* ═══ Main ═══ */
.main { margin-left:var(--sidebar-w); flex:1; display:flex; flex-direction:column; min-width:0; height:100vh; overflow:hidden; }

/* ═══ Top Header → <TopHeader/> ═══ */
.topbar { height:56px; background:var(--bg); border-bottom:1px solid var(--border-subtle);
  display:flex; align-items:center; padding:0 24px; gap:8px; position:sticky; top:0; z-index:50; }
.topbar__crumbs { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--fg-3); }
.topbar__crumbs .sep { color:var(--border); }
.topbar__crumbs .cur { color:var(--fg); font-weight:500; }
.topbar__spacer { flex:1; }
.topbar__btn { width:32px; height:32px; border-radius:var(--radius-sm); display:flex; align-items:center;
  justify-content:center; cursor:pointer; color:var(--fg-2); position:relative; transition:background .12s; }
.topbar__btn:hover { background:var(--border-subtle); }
.topbar__badge { position:absolute; top:3px; right:4px; min-width:16px; height:16px; padding:0 4px;
  border-radius:999px; background:var(--error-text); color:#fff; font-size:10px; font-weight:600;
  display:flex; align-items:center; justify-content:center; border:1.5px solid #fff; }
.topbar__divider { width:1px; height:20px; background:var(--border-subtle); margin:0 4px; }
.topbar__user { display:flex; align-items:center; gap:4px; cursor:pointer; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--primary-hover); color:#fff;
  font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

/* ═══ Content ═══ */
.content { flex:1; padding:24px 32px; overflow-y:auto; }
.page-header { display:flex; align-items:flex-start; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.page-header__main { flex:1; min-width:240px; }
.page-header__title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.page-header__title { font-size:20px; font-weight:600; color:var(--fg); }
.page-header__desc { font-size:13px; color:var(--fg-3); margin-top:4px; }
.page-header__actions { display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
.btn { height:40px; padding:0 16px; border-radius:var(--radius-md); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:all .15s; white-space:nowrap; }
.btn--primary { border:1px solid var(--primary); background:var(--primary); color:#fff; }
.btn--primary:hover { background:var(--primary-hover); }
.btn--secondary { border:1px solid var(--border); background:var(--bg); color:var(--fg); }
.btn--secondary:hover { background:var(--bg-2); }
.btn--ghost { border:1px solid var(--border); background:var(--bg); color:var(--fg-3); }

/* ═══ Stat Card → <StatCard/>（規範 C 版：圖標色塊 + 標籤 + 數字 + 副指標）═══ */
.stat-row { display:flex; gap:16px; flex-wrap:wrap; }
.stat-card { flex:1; min-width:0; background:var(--bg); border:1px solid var(--primary-light);
  border-radius:var(--radius-card); padding:16px 18px; }
.stat-card__head { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.stat-card__badge { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.stat-card__label { font-size:13px; color:var(--fg-3); }
.stat-card__value { font-size:26px; font-weight:600; color:var(--fg); line-height:1.1; margin-bottom:8px; }
.stat-card__subs { display:flex; gap:14px; font-size:12px; color:var(--fg-3); }
.stat-card__subs b { font-weight:600; }
/* 語意色塊（淺底 + 圖示色）*/
.tint-info   { background:var(--info-light); color:var(--info); }
.tint-warn   { background:#FFFCF0; color:var(--warning-text); }
.tint-error  { background:#FFF1F0; color:var(--error-text); }
.tint-success{ background:#F6FFED; color:var(--success-text); }

/* ═══ Sidebar 收合狀態（.app--collapsed 切換）═══ */
.app--collapsed .sidebar { width:var(--sidebar-w-collapsed); }
.app--collapsed .main { margin-left:var(--sidebar-w-collapsed); }
.sidebar, .main { transition:width 200ms ease, margin-left 200ms ease; }
.sidebar { overflow:hidden; }
.app--collapsed .sidebar__logo { justify-content:center; }
.app--collapsed .sidebar__logo img { display:none; }
.app--collapsed .nav-group__title { display:none; }
.app--collapsed .nav-item { justify-content:center; padding:10px 0; }
.app--collapsed .nav-item span { display:none; }
.c-info { color:var(--info); } .c-success { color:var(--success-text); }

/* ═══ Top Header 使用者下拉 → <UserMenu/> ═══ */
.topbar__user { position:relative; }
.user-menu { position:absolute; top:38px; right:0; width:200px; background:var(--bg);
  border:1px solid var(--border-subtle); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,0.08);
  padding:6px; z-index:200; display:none; }
.user-menu--open { display:block; }
.user-menu__head { padding:8px 10px; border-bottom:1px solid var(--border-subtle); margin-bottom:4px; }
.user-menu__name { font-size:13px; font-weight:600; color:var(--fg); }
.user-menu__email { font-size:11px; color:var(--fg-3); }
.user-menu__item { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:6px;
  cursor:pointer; font-size:13px; color:var(--fg-2); }
.user-menu__item:hover { background:var(--bg-2); }
.user-menu__item--danger { color:var(--error-text); }

/* ═══ Command Palette → <CommandPalette/> ═══ */
.cmdk-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:1200; display:none;
  align-items:flex-start; justify-content:center; padding-top:120px; }
.cmdk-overlay--open { display:flex; }
.cmdk { width:560px; max-width:90vw; background:var(--bg); border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,0.15); overflow:hidden; }
.cmdk__input { display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border-subtle); }
.cmdk__input input { flex:1; border:none; outline:none; font-size:15px; font-family:inherit; color:var(--fg); background:transparent; }
.cmdk__input input::placeholder { color:var(--fg-4); }
.cmdk__esc { font-size:11px; color:var(--fg-3); border:1px solid var(--border); border-radius:4px; padding:2px 6px; }
.cmdk__list { padding:8px; max-height:360px; overflow-y:auto; }
.cmdk__section { font-size:11px; color:var(--fg-4); text-transform:uppercase; letter-spacing:0.06em; padding:8px 10px 4px; }
.cmdk__item { display:flex; align-items:center; gap:10px; padding:10px 10px; border-radius:8px; cursor:pointer; font-size:14px; color:var(--fg); }
.cmdk__item:hover { background:var(--bg-2); }

</style>
</head>

<script>
  // 切版參照用的最小互動；React 版改用 state 管理
  function toggleSidebar(){ document.querySelector('.app').classList.toggle('app--collapsed'); }
  function toggleUserMenu(e){ e.stopPropagation(); document.getElementById('user-menu').classList.toggle('user-menu--open'); }
  document.addEventListener('click', function(){ document.getElementById('user-menu').classList.remove('user-menu--open'); });
  // Command Palette
  function openPalette(){ document.getElementById('cmdk').classList.add('cmdk-overlay--open'); setTimeout(()=>document.getElementById('cmdk-input').focus(),50); }
  function closePalette(e){ if(!e || e.target.id==='cmdk') document.getElementById('cmdk').classList.remove('cmdk-overlay--open'); }
  document.addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key==='k'){ e.preventDefault(); openPalette(); }
    if(e.key==='Escape'){ document.getElementById('cmdk').classList.remove('cmdk-overlay--open'); }
  });
</script>
