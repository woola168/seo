<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 — Kinsan SEO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary:#0A2B41; --primary-hover:#2E4A5E; --primary-light:#E7EAEC;
  --accent:#FDB338; --info:#1677FF; --info-light:#E6F4FF; --success:#52C41A;
  --error:#F5222D; --error-light:#FFF1F0; --error-border:#FFA39E; --error-text:#CF1322;
  --text-primary:#1F1F1F; --text-secondary:#595959; --text-desc:#8C8C8C; --text-disabled:#BFBFBF;
  --surface:#FFFFFF; --surface-2:#FAFAFA; --border:#D9D9D9; --border-subtle:#F0F0F0;
}
body { font-family:'Inter','Noto Sans TC',-apple-system,sans-serif; background:var(--surface); color:var(--text-primary); min-height:100vh; display:flex; -webkit-font-smoothing:antialiased; }
.shell { display:flex; width:100%; min-height:100vh; }

/* LEFT illustration */
.panel-left { flex:1; position:relative; overflow:hidden; background:#04111B; min-height:100vh; }
.panel-left img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
.panel-brand { position:absolute; left:48px; bottom:48px; z-index:2; }
.panel-brand-name { font-size:24px; font-weight:700; color:#fff; letter-spacing:-0.01em; }
.panel-brand-tagline { font-size:14px; color:rgba(255,255,255,0.7); margin-top:8px; }

/* RIGHT form */
.panel-right { width:480px; flex-shrink:0; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:48px; position:relative; }
.form-wrap { width:100%; max-width:360px; }
.form-heading { font-size:28px; font-weight:700; color:var(--text-primary); letter-spacing:-0.01em; }
.form-subheading { font-size:14px; color:var(--text-desc); margin-top:8px; margin-bottom:32px; }

/* Google btn */
.btn-google { width:100%; height:44px; border:1px solid var(--border); border-radius:8px; background:#fff; color:var(--text-primary); font-size:14px; font-weight:500; font-family:inherit; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:10px; transition:background .15s,border-color .15s; }
.btn-google:hover { background:var(--surface-2); border-color:var(--border-strong,#BFBFBF); }
.google-icon { width:18px; height:18px; }

/* Divider */
.divider { display:flex; align-items:center; gap:12px; margin:20px 0; }
.divider-line { flex:1; height:1px; background:var(--border-subtle); }
.divider-text { font-size:12px; color:var(--text-disabled); white-space:nowrap; }

/* Field */
.field { margin-bottom:18px; }
.field-label { display:block; font-size:13px; font-weight:500; color:var(--text-primary); margin-bottom:6px; }
.field-wrap { position:relative; }
.field-input { width:100%; height:40px; padding:0 40px 0 12px; font-size:14px; font-family:inherit; color:var(--text-primary); background:#fff; border:1px solid var(--border); border-radius:8px; outline:none; transition:border-color .15s,box-shadow .15s; }
.field-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(10,43,65,0.08); }
.field-input::placeholder { color:var(--text-disabled); }
.field-icon { position:absolute; right:12px; top:50%; transform:translateY(-50%); display:flex; cursor:pointer; }
.field.has-error .field-input { border-color:var(--error); }
.field.has-error .field-input:focus { box-shadow:0 0 0 3px rgba(245,34,45,0.08); }
.field-error { display:flex; align-items:center; gap:5px; font-size:13px; color:var(--error-text); margin-top:6px; }

/* Options */
.options-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
.remember { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; }
.remember-box { width:16px; height:16px; border:1.5px solid var(--border); border-radius:4px; display:flex; align-items:center; justify-content:center; transition:all .12s; }
.remember-box.checked { background:var(--primary); border-color:var(--primary); }
.remember-box svg { display:none; }
.remember-box.checked svg { display:block; }
.remember-label { font-size:13px; color:var(--text-secondary); }
.forgot-link { font-size:13px; color:var(--info); text-decoration:none; }
.forgot-link:hover { text-decoration:underline; }

/* Submit */
.btn-primary { width:100%; height:44px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; transition:background .15s; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-primary:disabled { opacity:0.6; cursor:not-allowed; }

/* Signup */
.signup-row { text-align:center; font-size:13px; color:var(--text-desc); margin-top:24px; }
.signup-link { color:var(--info); text-decoration:none; font-weight:500; }
.signup-link:hover { text-decoration:underline; }

/* Status */
.status-row { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-disabled); white-space:nowrap; }
.status-dot { width:7px; height:7px; border-radius:50%; background:var(--success); }

@media (max-width:900px){ .panel-left{display:none;} .panel-right{width:100%;} }
</style>

      <!-- Google OAuth -->

        <svg class="google-icon" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>

        <span class="divider-text">或使用帳號密碼</span>

      </div>

      <form id="login-form" novalidate>
        <!-- Email -->
        <div class="field" id="field-email">
          <label class="field-label" for="email">信箱</label>
          <div class="field-wrap">
            <input class="field-input" type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" oninput="clearError('field-email')" />
            <span class="field-icon" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8C8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
          </div>
          <div class="field-error" id="error-email" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CF1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-email-text"></span>
          </div>
        </div>

        <!-- Password -->
        <div class="field" id="field-password">
          <label class="field-label" for="password">密碼</label>
          <div class="field-wrap">
            <input class="field-input" type="password" id="password" name="password" placeholder="輸入密碼" autocomplete="current-password" oninput="clearError('field-password')" />
            <span class="field-icon" id="toggle-pw" onclick="togglePassword()" title="顯示/隱藏密碼">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8C8C8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
          <div class="field-error" id="error-password" style="display:none">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#CF1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span id="error-password-text"></span>
          </div>

      <span style="color:#BFBFBF">·</span>

<script>
  let remembered = false;
  function toggleRemember(){ remembered=!remembered; document.getElementById('remember-box').classList.toggle('checked',remembered); }
  let pwVisible=false;
  function togglePassword(){
    pwVisible=!pwVisible;
    document.getElementById('password').type = pwVisible?'text':'password';
    const ic=document.getElementById('eye-icon');
    ic.innerHTML = pwVisible
      ? '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
      : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
  function showError(f,msg){ const fl=document.getElementById('field-'+f); fl.classList.add('has-error'); const e=document.getElementById('error-'+f); e.style.display='flex'; document.getElementById('error-'+f+'-text').textContent=msg; }
  function clearError(id){ const fl=document.getElementById(id); fl.classList.remove('has-error'); const f=id.replace('field-',''); document.getElementById('error-'+f).style.display='none'; }
  function handleGoogle(){ alert('Google 登入（示意）'); }
  function handleSubmit(ev){
    ev.preventDefault();
    const email=document.getElementById('email').value.trim();
    const pw=document.getElementById('password').value;
    let ok=true;
    if(!email){ showError('email','請輸入信箱'); ok=false; }
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showError('email','信箱格式不正確'); ok=false; }
    if(!pw){ showError('password','請輸入密碼'); ok=false; }
    if(!ok) return;
    const btn=document.getElementById('btn-submit'); const lb=document.getElementById('btn-label');
    btn.disabled=true; lb.textContent='登入中…';
    setTimeout(()=>{ btn.disabled=false; lb.textContent='登入'; alert('登入成功（示意）'); },900);
  }
  // 穩健綁定：DOM 就緒後掛 submit 事件（取代 inline onsubmit）
  document.getElementById('login-form').addEventListener('submit', handleSubmit);
</script>
