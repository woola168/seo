const Btn = ({children,variant="primary",onClick,style}) => {
  const [h,setH]=useState(false);
  const base={height:40,padding:"0 16px",borderRadius:8,fontSize:14,fontWeight:500,cursor:"pointer",
    display:"inline-flex",alignItems:"center",gap:6,outline:"none",transition:"all .15s",whiteSpace:"nowrap",...style};
  const v={
    primary:{border:"1px solid var(--primary)",background:h?"var(--primary-hover)":"var(--primary)",color:"#fff"},
    secondary:{border:"1px solid var(--border)",background:h?"var(--bg-2)":"#fff",color:"var(--fg)"},
  }[variant];
  return <button onClick={onClick} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)} style={{...base,...v}}>{children}</button>;
};

// 真實選單結構
const NAV = [
  { id:"dashboard", icon:"grid", label:"總覽" },
  { id:"list", icon:"list", label:"列表頁", children:[
    {id:"list-basic",label:"一般列表頁"},
    {id:"list-card", label:"卡片列表頁"},
  ]},
  { id:"form", icon:"file-text", label:"表單頁", children:[
    {id:"form-basic",label:"一般表單頁"},
    {id:"form-steps",label:"步驟表單頁"},
  ]},
  { id:"detail",  icon:"file",     label:"詳情頁" },
  { id:"settings",icon:"settings", label:"設定頁" },
  { id:"profile", icon:"user",     label:"個人中心" },
];
function NavItem({item,active,setActive,expanded,toggle,collapsed}){
  const isActive = active===item.id || (item.children&&item.children.some(c=>c.id===active));
  const isExp = expanded[item.id];
  const [hov,setHov]=useState(false);
  return <React.Fragment>
    <div onClick={()=>{setActive(item.id); if(item.children) toggle(item.id);}}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{display:"flex",alignItems:"center",gap:8,padding:collapsed?"10px 0":"10px 12px",margin:"1px 8px",borderRadius:8,cursor:"pointer",
        justifyContent:collapsed?"center":"flex-start",
        background:isActive?"#E7EAEC":hov?"#FAFAFA":"transparent",color:isActive?"#0A2B41":"#595959",
        fontWeight:isActive?500:400,fontSize:14,transition:"all .12s"}}>
      <FI name={item.icon} size={16} color={isActive?"#0A2B41":"#8C8C8C"}/>
      {!collapsed && <span style={{flex:1}}>{item.label}</span>}
      {!collapsed && item.children && <FI name={isExp?"chevron-up":"chevron-right"} size={14} color="#BFBFBF"/>}
    </div>
    {!collapsed && item.children && isExp && <div style={{paddingLeft:10}}>
      {item.children.map(c=>{
        const ca=active===c.id;
        return <div key={c.id} onClick={()=>setActive(c.id)}
          style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",margin:"1px 8px",borderRadius:8,cursor:"pointer",
            background:ca?"#E7EAEC":"transparent",color:ca?"#0A2B41":"#595959",fontWeight:ca?500:400,fontSize:13}}
          onMouseEnter={e=>{if(!ca)e.currentTarget.style.background="#FAFAFA";}}
          onMouseLeave={e=>{if(!ca)e.currentTarget.style.background="transparent";}}>
          <div style={{width:5,height:5,borderRadius:"50%",background:ca?"#0A2B41":"#BFBFBF",marginLeft:6,flexShrink:0}}/>
          <span style={{flex:1}}>{c.label}</span>
        </div>;
      })}
    </div>}
  </React.Fragment>;
}

function StatCard({label,value,icon,iconColor,iconBg,subs}){
  return (
    <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,padding:"16px 18px",flex:1,minWidth:0}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}>
        <div style={{width:32,height:32,borderRadius:8,background:iconBg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><FI name={icon} size={16} color={iconColor}/></div>
        <span style={{fontSize:13,color:"#8C8C8C"}}>{label}</span>
      </div>
      <div style={{fontSize:26,fontWeight:600,color:"#1F1F1F",lineHeight:1.1,marginBottom:subs?8:0}}>{value}</div>
      {subs&&<div style={{display:"flex",gap:12,fontSize:12,color:"#8C8C8C"}}>{subs.map((s,i)=><span key={i}>{s.l} <span style={{color:s.c||"#434343",fontWeight:600}}>{s.v}</span></span>)}</div>}
    </div>
  );
}
function Panel({title,extra,children,style}){
  return (
    <div style={{background:"#fff",border:"1px solid #E7EAEC",borderRadius:12,padding:"18px 20px",...style}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
        <span style={{fontSize:14,fontWeight:600,color:"#1F1F1F"}}>{title}</span>
        {extra&&<span style={{fontSize:12,color:"#1677FF",cursor:"pointer"}}>{extra}</span>}
      </div>
      {children}
    </div>
  );
}

function StatusBadge({status}){
  const ok = status==="營業中";
  return <span style={{display:"inline-block",width:"max-content",maxWidth:"none",flexShrink:0,
    fontSize:12,fontWeight:500,padding:"2px 8px",borderRadius:999,whiteSpace:"nowrap",wordBreak:"keep-all",lineHeight:"18px",
    background:ok?"var(--success-light)":"var(--error-light)",
    color:ok?"var(--success-text)":"var(--error-text)",
    border:"1px solid "+(ok?"var(--success-border)":"var(--error-border)")}}>{status}</span>;
}
function Cb({checked,indeterminate,onChange}){
  return <div onClick={e=>{e.stopPropagation();onChange();}}
    style={{width:16,height:16,borderRadius:4,border:"1.5px solid "+(checked||indeterminate?"var(--primary)":"var(--border)"),
      background:checked||indeterminate?"var(--primary)":"#fff",display:"flex",alignItems:"center",justifyContent:"center",
      cursor:"pointer",transition:"all .12s",margin:"0 auto"}}>
    {checked&&<FI name="check" size={11} color="#fff"/>}
    {!checked&&indeterminate&&<div style={{width:8,height:2,background:"#fff",borderRadius:1}}/>}
  </div>;
}
function RowAction({icon,label,onClick}){
  const [h,setH]=useState(false);
  return <div style={{position:"relative"}}>
    {h&&<div style={{position:"absolute",bottom:30,left:"50%",transform:"translateX(-50%)",background:"#1F1F1F",
      color:"#fff",fontSize:12,padding:"5px 10px",borderRadius:6,whiteSpace:"nowrap",zIndex:30,pointerEvents:"none"}}>{label}</div>}
    <div onClick={e=>{e.stopPropagation();onClick&&onClick();}} onMouseEnter={()=>setH(true)} onMouseLeave={()=>setH(false)}
      style={{width:24,height:24,borderRadius:"50%",background:h?"#E5E5E5":"#F0F0F0",display:"flex",alignItems:"center",
        justifyContent:"center",cursor:"pointer",transition:"background .12s"}}>
      <FI name={icon} size={14} color={h?"#434343":"var(--fg-2)"}/>
    </div>
  </div>;
}

  const [expanded,setExpanded]=useState({});
  const [collapsed,setCollapsed]=useState(false);
  const toggle=k=>setExpanded(p=>({...p,[k]:!p[k]}));
  const crumbs = CRUMBS[active] || ["頁面"];

  const renderPage = () => {
    if(active==="dashboard") return <DashboardPage/>;
    if(active==="list-basic") return <ListPage/>;
    const titles={"list-card":"卡片列表頁","form-basic":"一般表單頁","form-steps":"步驟表單頁","detail":"詳情頁","settings":"設定頁","profile":"個人中心"};
    return <PlaceholderPage title={titles[active]||"頁面"}/>;
  };

  return (
    <div style={{display:"flex",minHeight:"100vh"}}>
      <aside style={{width:collapsed?56:240,background:"#fff",borderRight:"1px solid #E7EAEC",
        position:"fixed",top:0,left:0,bottom:0,display:"flex",flexDirection:"column",zIndex:100,transition:"width 200ms ease",overflow:"hidden"}}>
        <div style={{height:56,padding:"0 14px",borderBottom:"1px solid #F0F0F0",
          display:"flex",alignItems:"center",justifyContent:collapsed?"center":"space-between",flexShrink:0}}>
          {!collapsed && <img src={LOGO} alt="Youni Lab" style={{height:24,width:"auto",display:"block",flexShrink:0}}/>}
          <div onClick={()=>setCollapsed(c=>!c)}
            style={{width:28,height:28,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,transition:"background 120ms"}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="sidebar" size={18} color="#8C8C8C"/>
          </div>
        </div>
        {!collapsed && <div style={{margin:"10px 12px",display:"flex",alignItems:"center",gap:6,background:"#FAFAFA",
          border:"1px solid #D9D9D9",borderRadius:8,padding:"7px 10px",cursor:"pointer",flexShrink:0}}>
          <FI name="search" size={14} color="#8C8C8C"/>
          <span style={{fontSize:12,color:"#BFBFBF",flex:1}}>搜尋...</span>
          <span style={{fontSize:10,color:"#8C8C8C",background:"#fff",border:"1px solid #D9D9D9",borderRadius:4,padding:"1px 5px"}}>⌘/</span>
        </div>}
        <nav style={{flex:1,padding:"4px 0",overflowY:"auto"}}>
          {!collapsed && <div style={{fontSize:12,fontWeight:400,letterSpacing:"0.06em",textTransform:"uppercase",color:"#BFBFBF",padding:"16px 16px 6px"}}>主選單</div>}
          {NAV.map(n=><NavItem key={n.id} item={n} active={active} setActive={setActive} expanded={expanded} toggle={toggle} collapsed={collapsed}/>)}
        </nav>
      </aside>

      <div style={{marginLeft:collapsed?56:240,flex:1,display:"flex",flexDirection:"column",minWidth:0,transition:"margin-left 200ms ease"}}>
        <header style={{height:56,background:"#fff",borderBottom:"1px solid #F0F0F0",
          display:"flex",alignItems:"center",padding:"0 24px",gap:8,position:"sticky",top:0,zIndex:50}}>
          <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:"#8C8C8C",flex:1}}>
            {crumbs.map((c,i)=>(
              <React.Fragment key={i}>
                {i>0 && <span style={{color:"#D9D9D9"}}>/</span>}
                <span style={{color:i===crumbs.length-1?"#1F1F1F":"#8C8C8C",fontWeight:i===crumbs.length-1?500:400}}>{c}</span>
              </React.Fragment>
            ))}
          </div>
          <div style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative"}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="bell" size={18} color="#595959"/>
            <div style={{position:"absolute",top:5,right:6,width:8,height:8,borderRadius:"50%",background:"#F5222D",border:"1.5px solid #fff"}}/>
          </div>
          <div style={{width:32,height:32,borderRadius:6,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}
            onMouseEnter={e=>e.currentTarget.style.background="#F0F0F0"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <FI name="help-circle" size={18} color="#595959"/>
          </div>
          <div style={{width:1,height:20,background:"#F0F0F0",margin:"0 4px"}}/>
          <div onClick={()=>setUserMenu(o=>!o)} style={{display:"flex",alignItems:"center",gap:4,cursor:"pointer",position:"relative"}}>
            <div style={{width:28,height:28,borderRadius:"50%",background:"#2E4A5E",color:"#fff",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>CF</div>
            <FI name="chevron-down" size={14} color="#8C8C8C"/>
            {userMenu&&<div style={{position:"absolute",top:40,right:0,width:200,background:"#fff",border:"1px solid #F0F0F0",
              borderRadius:10,boxShadow:"0 8px 24px rgba(0,0,0,0.08)",padding:6,zIndex:100}}>
              <div style={{padding:"8px 10px",borderBottom:"1px solid #F0F0F0",marginBottom:4}}>
                <div style={{fontSize:13,fontWeight:600}}>Cody Fisher</div>
                <div style={{fontSize:11,color:"#8C8C8C"}}>c.fisher@gmail.com</div>
              </div>
              {[["user","個人資料"],["settings","帳號設定"],["log-out","登出"]].map(([ic,t])=>(
                <div key={t} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",borderRadius:6,cursor:"pointer",
                  fontSize:13,color:t==="登出"?"#CF1322":"#595959"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#FAFAFA"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <FI name={ic} size={16} color={t==="登出"?"#CF1322":"#8C8C8C"}/>{t}
                </div>
              ))}
            </div>}
          </div>
        </header>
        {renderPage()}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
