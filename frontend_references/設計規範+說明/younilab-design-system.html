// ── Utilities ──
function isLight(hex) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 160;
}

const Toast = ({ message, visible }) => (
  <div style={{
    position:"fixed",bottom:24,left:"50%",
    transform:`translateX(-50%) translateY(${visible?0:12}px)`,
    opacity:visible?1:0,transition:"all .25s ease",
    background:"#000",color:"#fff",padding:"8px 16px",
    borderRadius:8,fontSize:13,fontFamily:"var(--font-mono)",
    pointerEvents:"none",zIndex:9999,boxShadow:"0 4px 14px rgba(0,0,0,.15)",
  }}>{message}</div>
);

);

const GTable = ({ headers, rows }) => (

          ))}</tr>
        ))}
      </tbody>
    </table>

// ── Color Scale Bar ──
const ColorScale = ({ name, colors, onCopy }) => (
  <div style={{marginBottom:20}}>
    <div style={{fontSize:13,fontWeight:500,color:"var(--fg-2)",marginBottom:8,fontFamily:"var(--font-sans)"}}>{name}</div>
    <div style={{display:"flex",borderRadius:10,overflow:"hidden",border:"1px solid var(--border)"}}>
      {colors.map((c,i) => {
        const lt = isLight(c.hex);
        return (
          <div key={i} onClick={()=>onCopy(c.hex)} title={`${name}/${c.step}\n${c.hex}`}
            style={{
              flex:1,height:56,background:c.hex,cursor:"pointer",
              display:"flex",alignItems:"flex-end",justifyContent:"center",
              paddingBottom:6,transition:"opacity .15s",
              borderRight:i<colors.length-1?"1px solid rgba(128,128,128,0.1)":"none",
            }}
            onMouseEnter={e=>{e.currentTarget.style.opacity=0.85}}
            onMouseLeave={e=>{e.currentTarget.style.opacity=1}}
          >
            <span style={{fontSize:10,fontFamily:"var(--font-mono)",fontWeight:500,color:lt?"rgba(0,0,0,0.35)":"rgba(255,255,255,0.55)"}}>{c.step}</span>
          </div>
        );
      })}
    </div>
  </div>
);

// ── Button ──
const Btn = ({ variant="primary", size="md", children, disabled, loading, onClick }) => {
  const [h,setH]=useState(false);
  const [a,setA]=useState(false);
  // Sizes from comp tokens
  const sizes = {
    sm:{height:32,padding:"0 12px",fontSize:12,radius:4},
    md:{height:40,padding:"0 20px",fontSize:14,radius:8},
    lg:{height:48,padding:"0 24px",fontSize:16,radius:8},
  };
  const sz = sizes[size];
  const base = {
    fontFamily:"var(--font-sans)",fontWeight:500,cursor:disabled?"not-allowed":"pointer",
    borderRadius:sz.radius,display:"inline-flex",alignItems:"center",justifyContent:"center",gap:size==="lg"?8:4,
    transition:"all .15s ease",outline:"none",border:"none",
    fontSize:sz.fontSize,height:sz.height,padding:sz.padding,opacity:disabled?0.5:1,
  };
  // Colors from comp tokens
  const vars = {
    primary: { background:disabled?"#F0F0F0":a?"#061A28":h?"#2E4A5E":"#0A2B41", color:disabled?"#BFBFBF":"#FFFFFF" },
    secondary: { background:disabled?"#F0F0F0":a?"#F5F5F5":h?"#FAFAFA":"#FFFFFF", color:disabled?"#BFBFBF":"#1F1F1F", border:"1px solid "+(disabled?"#F0F0F0":"#D9D9D9") },
    danger: { background:disabled?"#F0F0F0":a?"#CF1322":h?"#FF4D4F":"#F5222D", color:disabled?"#BFBFBF":"#FFFFFF" },
    ghost: { background:a?"#F5F5F5":h?"#FAFAFA":"transparent", color:disabled?"#BFBFBF":"#1F1F1F", border:"1px solid transparent" },
    warning: { background:disabled?"#F0F0F0":a?"#D68C24":h?"#FFC861":"#FDB338", color:disabled?"#BFBFBF":"#FFFFFF" },
  };
  return (
    <button style={{...base,...vars[variant]}} onClick={!disabled?onClick:undefined}
      onMouseEnter={()=>!disabled&&setH(true)} onMouseLeave={()=>{setH(false);setA(false)}}
      onMouseDown={()=>!disabled&&setA(true)} onMouseUp={()=>setA(false)}
    >
      {loading ? <span style={{display:"flex",gap:3}}>{[0,1,2].map(i=>(
        <span key={i} style={{width:4,height:4,borderRadius:"50%",
          background:variant==="secondary"||variant==="ghost"?"#8C8C8C":"rgba(255,255,255,0.7)",
          animation:`dotPulse 1.2s ease-in-out ${i*0.15}s infinite`}} />
      ))}</span> : children}
    </button>
  );
};

function TextareaPage() {
  const [val1,setVal1]=useState("");
  const [val2,setVal2]=useState("");

  const TextareaField = ({value,onChange,placeholder,disabled,error,errorMsg,label,rows=3,maxLength,resize="vertical"}) => {
    const [focused,setFocused]=useState(false);
    const charCount = maxLength ? `${(value||"").length}/${maxLength}` : null;
    return (
      <div style={{width:"100%"}}>
        {label && <label style={{display:"block",fontSize:13,fontWeight:500,color:"var(--fg)",marginBottom:6,fontFamily:"var(--font-sans)"}}>{label}</label>}
        <div style={{position:"relative"}}>
          <textarea value={value} onChange={e=>onChange&&onChange(e.target.value)}
            placeholder={placeholder} disabled={disabled} rows={rows}
            maxLength={maxLength}
            onFocus={()=>setFocused(true)} onBlur={()=>setFocused(false)}
            style={{
              width:"100%",border:"1px solid "+(error?"#F5222D":focused?"#0A2B41":"var(--border)"),
              borderRadius:8,padding:12,fontSize:14,color:"var(--fg)",
              fontFamily:"var(--font-sans)",background:disabled?"var(--bg-2)":"var(--bg)",
              outline:"none",transition:"border-color .15s",lineHeight:1.6,
              resize:disabled?"none":resize,opacity:disabled?0.5:1,
              boxShadow:focused&&!error?"0 0 0 3px rgba(10,43,65,0.08)":error&&focused?"0 0 0 3px rgba(245,34,45,0.08)":"none",

          />
          {charCount && <span style={{position:"absolute",bottom:8,right:12,fontSize:12,color:"var(--fg-3)",fontFamily:"var(--font-mono)"}}>{charCount}</span>}
        </div>
        {error && errorMsg && <div style={{fontSize:13,color:"#F5222D",marginTop:6,fontFamily:"var(--font-sans)"}}>{errorMsg}</div>}

function TabsPage() {
  const [tab1,setTab1]=useState(0);
  const [tab2,setTab2]=useState(0);

  const TabBar = ({tabs,active,onChange,disabled,variant="primary"}) => {
    return (
      <div style={{

                padding:variant==="secondary"?"6px 16px":"10px 16px",

function ToastPage() {
  const [toasts,setToasts]=useState([]);
  let toastId = useRef(0);

  const addToast = (variant,msg) => {
    const id = ++toastId.current;
    setToasts(prev=>[...prev,{id,variant,msg,visible:true}]);
    setTimeout(()=>setToasts(prev=>prev.map(t=>t.id===id?{...t,visible:false}:t)),2500);
    setTimeout(()=>setToasts(prev=>prev.filter(t=>t.id!==id)),2800);
  };

  const ToastItem = ({variant,msg,visible}) => {
    const colors = {
      default:{bg:"#1F1F1F",color:"#fff",icon:null},
      success:{bg:"#1F1F1F",color:"#fff",icon:"✓",iconColor:"#52C41A"},
      error:{bg:"#1F1F1F",color:"#fff",icon:"✕",iconColor:"#F5222D"},
      warning:{bg:"#1F1F1F",color:"#fff",icon:"⚠",iconColor:"#FDB338"},
    };
    const c = colors[variant]||colors.default;
    return (
      <div style={{
        background:c.bg,color:c.color,padding:"10px 16px",borderRadius:8,
        fontSize:14,fontFamily:"var(--font-sans)",display:"flex",alignItems:"center",gap:8,
        boxShadow:"0 4px 14px rgba(0,0,0,0.15)",minWidth:200,

      }}>
        {c.icon && <span style={{color:c.iconColor,fontWeight:700}}>{c.icon}</span>}
        {msg}
      </div>
    );
  };

  return (
    <div>
      <p style={{fontSize:14,color:"var(--fg-2)",lineHeight:1.7,maxWidth:560,marginBottom:8,fontFamily:"var(--font-sans)"}}>
        短暫顯示的操作回饋通知。

      <Anchor id="to-variants">Variants</Anchor>
      <p style={{fontSize:14,color:"var(--fg-2)",lineHeight:1.7,marginBottom:20,fontFamily:"var(--font-sans)"}}>
        點擊按鈕觸發即時 Toast 通知。
      </p>
      <DemoBox style={{gap:8}}>
        <Btn variant="secondary" onClick={()=>addToast("default","已複製到剪貼簿")}>Default</Btn>
        <Btn variant="primary" onClick={()=>addToast("success","儲存成功")}>Success</Btn>
        <Btn variant="error" onClick={()=>addToast("error","刪除失敗")}>Error</Btn>
        <Btn variant="warning" onClick={()=>addToast("warning","請先填寫必填欄位")}>Warning</Btn>
      </DemoBox>
      {/* live toast stack */}
      <div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",zIndex:9999,display:"flex",flexDirection:"column-reverse",gap:8,alignItems:"center"}}>
        {toasts.map(t=><ToastItem key={t.id} {...t} />)}

      <p style={{fontSize:14,color:"var(--fg-2)",lineHeight:1.7,marginBottom:20,fontFamily:"var(--font-sans)"}}>

        <ToastItem variant="default" msg="已複製到剪貼簿" visible={true} />
        <ToastItem variant="success" msg="儲存成功" visible={true} />
        <ToastItem variant="error" msg="刪除失敗" visible={true} />
        <ToastItem variant="warning" msg="請先填寫必填欄位" visible={true} />
      </DemoBox>
      <Anchor id="to-specs">Specs</Anchor>
      <GTable headers={["Property","Value"]} rows={[
        ["Background","#1F1F1F"],
        ["Text color","#FFFFFF"],
        ["Font size","14px / Regular 400"],
        ["Padding","10px 16px"],

      ]} />

  );
}

function SwitchPage() {
  const [s1,setS1]=useState(false);

// ── PAGINATION ───────────────────────
function PaginationPage() {
  const [page, setPage] = useState(1);
  const [page2, setPage2] = useState(3);
  const total = 12;
  const PgBtn = ({label,active,disabled,onClick}) => {
    const [h,setH]=useState(false);
    return (
      <button onClick={!disabled?onClick:undefined}
        onMouseEnter={()=>!disabled&&setH(true)} onMouseLeave={()=>setH(false)}
        style={{minWidth:32,height:32,padding:"0 8px",borderRadius:8,border:"1px solid",fontSize:13,cursor:disabled?"not-allowed":"pointer",outline:"none",transition:"all .12s",
          background:active?"#0A2B41":h?"#FAFAFA":"#fff",
          borderColor:active?"#0A2B41":h?"#BFBFBF":"#D9D9D9",
          color:active?"#fff":disabled?"#BFBFBF":"#595959",
          opacity:disabled?0.4:1,fontFamily:"var(--font-sans)",fontWeight:active?500:400,
        }}>{label}</button>
    );
  };
  const pages = [1,2,3,"…",10,11,12];
  return (
    <div>
      <p style={{fontSize:14,color:"var(--fg-2)",lineHeight:1.7,maxWidth:560,marginBottom:8}}>表格與列表的分頁導覽控制元件。</p>

      <DemoBox style={{flexDirection:"column",gap:16,alignItems:"flex-start"}}>
        <div style={{display:"flex",gap:4,alignItems:"center"}}>
          <PgBtn label="‹" disabled={page===1} onClick={()=>setPage(p=>Math.max(1,p-1))}/>
          {[1,2,3,"…",10,11,12].map((p,i)=>
            p==="…"?<span key={i} style={{padding:"0 4px",color:"#8C8C8C",fontSize:13}}>…</span>
            :<PgBtn key={i} label={p} active={page===p} onClick={()=>setPage(p)}/>
          )}
          <PgBtn label="›" disabled={page===12} onClick={()=>setPage(p=>Math.min(12,p+1))}/>
        </div>
      </DemoBox>
      <Anchor id="pg-simple">Simple（前後頁 + 筆數）</Anchor>
      <DemoBox>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{display:"flex",gap:4}}>
            <PgBtn label="‹ 上一頁" disabled={page2===1} onClick={()=>setPage2(p=>Math.max(1,p-1))}/>
            <PgBtn label="下一頁 ›" disabled={page2===total} onClick={()=>setPage2(p=>Math.min(total,p+1))}/>

      <Anchor id="pg-specs">Specs</Anchor>

  );
}

                textTransform:"uppercase",letterSpacing:"0.07em",
              }}>
                <span>{group.section}</span>
                <span style={{
                  fontSize:10,fontWeight:500,
                  background:"var(--bg-2)",color:"var(--fg-3)",
                  border:"1px solid var(--border)",
                  padding:"1px 5px",borderRadius:9999,
                }}>{group.items.length}</span>
              </div>
              {group.items.map(item=>{
                const active=page===item.id;
                return (
                  <div key={item.id} data-nav={item.id}
                    onClick={()=>{setPage(item.id);window.scrollTo(0,0)}}
                    style={{
                      padding:"6px 16px 6px 18px",fontSize:13,cursor:"pointer",
                      color:active?"#0A2B41":"var(--fg-2)",
                      fontWeight:active?500:400,
                      background:active?"#E7EAEC":"transparent",
                      borderLeft:active?"2px solid #0A2B41":"2px solid transparent",
                      transition:"all .12s",
                    }}
                    onMouseEnter={e=>{if(!active){e.currentTarget.style.background="var(--bg-2)";e.currentTarget.style.color="var(--fg)"}}}
                    onMouseLeave={e=>{if(!active){e.currentTarget.style.background="transparent";e.currentTarget.style.color="var(--fg-2)"}}}
                  >{item.label}</div>
                );
              })}
              <div style={{height:1,background:"var(--border-light)",margin:"8px 16px 4px"}}/>
            </div>
          ))}
        </aside>
        <main style={{marginLeft:"var(--sidebar-w)",flex:1,maxWidth:720,padding:"48px 48px 100px"}}>
          <h1 style={{fontSize:32,fontWeight:700,color:"var(--fg)",fontFamily:"var(--font-sans)",letterSpacing:"-0.02em",marginBottom:12}}>{titles[page]}</h1>
          {content[page]}
          <div style={{display:"flex",justifyContent:"space-between",marginTop:64,paddingTop:24,borderTop:"1px solid var(--border)"}}>
            {prev?(<div onClick={()=>{setPage(prev.id);window.scrollTo(0,0)}} style={{cursor:"pointer"}}
              onMouseEnter={e=>{e.currentTarget.querySelector('.pn').style.color="var(--fg)"}}
              onMouseLeave={e=>{e.currentTarget.querySelector('.pn').style.color="var(--fg-2)"}}
            ><div style={{fontSize:12,color:"var(--fg-3)",marginBottom:2}}>Previous</div><div className="pn" style={{fontSize:14,color:"var(--fg-2)",fontWeight:500,transition:"color .15s"}}>{prev.label}</div></div>):<div/>}
            {next?(<div onClick={()=>{setPage(next.id);window.scrollTo(0,0)}} style={{cursor:"pointer",textAlign:"right"}}
              onMouseEnter={e=>{e.currentTarget.querySelector('.pn').style.color="var(--fg)"}}
              onMouseLeave={e=>{e.currentTarget.querySelector('.pn').style.color="var(--fg-2)"}}
            ><div style={{fontSize:12,color:"var(--fg-3)",marginBottom:2}}>Next</div><div className="pn" style={{fontSize:14,color:"var(--fg-2)",fontWeight:500,transition:"color .15s"}}>{next.label}</div></div>):<div/>}
          </div>
        </main>
      </div>
      <Toast message={toast.message} visible={toast.visible} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
