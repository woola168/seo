[project]
name = "younilab-geo-analysis-api"
version = "0.1.0"
description = "GEO analysis orchestration API."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1",
    "younilab-seo",
    "younilab-provider-request-audit",
]

[tool.uv.sources]
younilab-seo = { workspace = true }
younilab-provider-request-audit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
