[project]
name = "younilab-resource-catalog-api"
version = "0.1.0"
description = "Customer and SEO task master-data API."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1",
    "younilab-resource-catalog-application",
    "younilab-resource-catalog-domain",
    "younilab-resource-catalog-infrastructure",
]

[tool.uv.sources]
younilab-resource-catalog-application = { workspace = true }
younilab-resource-catalog-domain = { workspace = true }
younilab-resource-catalog-infrastructure = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
