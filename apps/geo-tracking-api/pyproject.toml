[project]
name = "younilab-geo-tracking-api"
version = "0.1.0"
description = "GEO tracking Query Research and run request API."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0,<1",
    "younilab-geo-tracking-application",
    "younilab-geo-tracking-domain",
    "younilab-geo-tracking-infrastructure",
]

[tool.uv.sources]
younilab-geo-tracking-application = { workspace = true }
younilab-geo-tracking-domain = { workspace = true }
younilab-geo-tracking-infrastructure = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
