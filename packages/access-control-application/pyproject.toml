[project]
name = "younilab-access-control-application"
version = "0.1.0"
description = "SEO access control use cases and ports."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "younilab-access-control-domain",
    "younilab-authorization-contracts",
]

[tool.uv.sources]
younilab-access-control-domain = { workspace = true }
younilab-authorization-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
