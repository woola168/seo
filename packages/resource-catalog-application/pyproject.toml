[project]
name = "younilab-resource-catalog-application"
version = "0.1.0"
description = "Resource catalog application use cases."
requires-python = ">=3.12"
dependencies = ["younilab-resource-catalog-domain"]

[tool.uv.sources]
younilab-resource-catalog-domain = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
