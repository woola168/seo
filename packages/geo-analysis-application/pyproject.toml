[project]
name = "younilab-geo-analysis-application"
version = "0.1.0"
description = "GEO analysis orchestration use cases."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3",
    "younilab-geo-analysis-domain",
]

[tool.uv.sources]
younilab-geo-analysis-domain = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
