[project]
name = "younilab-geo-analysis-infrastructure"
version = "0.1.0"
description = "GEO analysis infrastructure adapters."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.14,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    "younilab-geo-analysis-application",
    "younilab-geo-analysis-domain",
]

[tool.uv.sources]
younilab-geo-analysis-application = { workspace = true }
younilab-geo-analysis-domain = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
