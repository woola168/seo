[project]
name = "younilab-seo"
version = "0.1.0"
description = "SEO back-office bounded contexts and shared Python capabilities."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "cryptography>=44.0,<46",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "pwdlib[argon2]>=0.2.1,<1",
    "pyjwt[crypto]>=2.10,<3",
    "sqlalchemy>=2.0.14,<2.1",
    "sqlmodel>=0.0.38,<0.1",
]

[dependency-groups]
dev = ["aiosqlite>=0.21.0,<1", "pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
