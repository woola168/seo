[project]
name = "younilab-access-control-infrastructure"
version = "0.1.0"
description = "SEO access control infrastructure adapters."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<1",
    "cryptography>=44.0,<46",
    "pwdlib[argon2]>=0.2.1,<1",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic-settings>=2.0,<3",
    "sqlalchemy>=2.0.14,<2.1",
    "sqlmodel>=0.0.38,<0.1",
    "younilab-access-control-application",
    "younilab-access-control-domain",
]

[tool.uv.sources]
younilab-access-control-application = { workspace = true }
younilab-access-control-domain = { workspace = true }

[dependency-groups]
dev = ["aiosqlite>=0.21.0,<1", "pytest>=8.0"]

[build-system]
requires = ["uv_build>=0.7.12,<0.8.0"]
build-backend = "uv_build"
