name: Deploy Younilab SEO

on:
  push:
    branches: ["develop", "main"]

jobs:
  build-and-deploy:
    runs-on: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    env:
      DEPLOY_ENV_FILE: ${{ github.ref_name == 'main' && format('{0}/deploy/.env.prod', github.workspace) || format('{0}/deploy/.env.develop', github.workspace) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv sync --all-packages --all-groups

      - name: Run Python tests
        run: |
          uv --cache-dir .uv-cache run pytest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: |
          npm ci

      - name: Run frontend tests
        run: |
          npm run test:portal

      - name: Build frontend
        run: |
          npm run build:portal

      - name: Prepare Docker network
        run: |
          docker network inspect web_network >/dev/null 2>&1 || docker network create web_network

      - name: Validate deploy environment file
        run: |
          test -f "$DEPLOY_ENV_FILE"
          test "${DEPLOY_ENV_FILE##*/}" = "${{ github.ref_name == 'main' && '.env.prod' || '.env.develop' }}"

      - name: Build Docker images
        run: |
          docker compose --env-file "$DEPLOY_ENV_FILE" -f deploy/docker-compose.yml build

      - name: Deploy app containers
        run: |
          docker compose --env-file "$DEPLOY_ENV_FILE" -f deploy/docker-compose.yml up -d --remove-orphans

      - name: Reload Nginx Proxy Manager
        run: |
          docker exec nginx_proxy_manager nginx -s reload || true

      - name: Health check
        run: |
          for url in \
            http://127.0.0.1:18080/health \
            http://127.0.0.1:18004/health \
            http://127.0.0.1:18001/health \
            http://127.0.0.1:18002/health \
            http://127.0.0.1:18003/health
          do
            for attempt in 1 2 3 4 5
            do
              if curl --fail --show-error --silent "$url"; then
                echo
                break
              fi
              if [ "$attempt" = 5 ]; then
                docker compose --env-file "$DEPLOY_ENV_FILE" -f deploy/docker-compose.yml ps
                docker compose --env-file "$DEPLOY_ENV_FILE" -f deploy/docker-compose.yml logs --tail=120
                exit 1
              fi
              sleep 3
            done
          done
