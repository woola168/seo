[project]
name = "younilab-seo-python-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/access-control-api",
    "packages/access-control-domain",
    "packages/access-control-application",
    "packages/access-control-infrastructure",
    "packages/authorization-contracts",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "apps/access-control-api/tests",
    "packages/access-control-domain/tests",
    "packages/access-control-application/tests",
    "packages/access-control-infrastructure/tests",
    "packages/authorization-contracts/tests",
]
