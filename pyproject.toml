[project]
name = "younilab-seo-python-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/access-control-api",
    "apps/resource-catalog-api",
    "apps/geo-analysis-api",
    "apps/geo-tracking-api",
    "packages/geo-tracking-domain",
    "packages/geo-tracking-application",
    "packages/geo-tracking-infrastructure",
    "packages/younilab-seo",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [
    "apps/access-control-api/tests",
    "apps/resource-catalog-api/tests",
    "apps/geo-analysis-api/tests",
    "apps/geo-tracking-api/tests",
    "packages/geo-tracking-infrastructure/tests",
    "packages/younilab-seo/tests",
]
