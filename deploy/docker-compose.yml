services:
  admin-portal:
    container_name: admin-portal
    build:
      context: ..
      dockerfile: apps/admin-portal/Dockerfile
    image: younilab-seo-admin-portal:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "127.0.0.1:18080:80"
    networks:
      - web_network

  access-control-api:
    container_name: access-control-api
    build:
      context: ..
      dockerfile: apps/access-control-api/Dockerfile
    image: younilab-seo-access-control-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - web_network

  resource-catalog-api:
    container_name: resource-catalog-api
    build:
      context: ..
      dockerfile: apps/resource-catalog-api/Dockerfile
    image: younilab-seo-resource-catalog-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18001:8001"
    networks:
      - web_network

  geo-analysis-api:
    container_name: geo-analysis-api
    build:
      context: ..
      dockerfile: apps/geo-analysis-api/Dockerfile
    image: younilab-seo-geo-analysis-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18002:8002"
    networks:
      - web_network

  geo-tracking-api:
    container_name: geo-tracking-api
    build:
      context: ..
      dockerfile: apps/geo-tracking-api/Dockerfile
    image: younilab-seo-geo-tracking-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18003:8003"
    networks:
      - web_network

networks:
  web_network:
    external: true
