services:
  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:4-management
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - web_network

  admin-portal:
    container_name: admin-portal
    build:
      context: ..
      dockerfile: apps/admin-portal/Dockerfile
    image: younilab-seo-admin-portal:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    ports:
      - "127.0.0.1:18080:80"
    networks:
      - web_network

  access-control-api:
    container_name: access-control-api
    build:
      context: ..
      dockerfile: apps/access-control-api/Dockerfile
    image: younilab-seo-access-control-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18004:8000"
    networks:
      - web_network

  resource-catalog-api:
    container_name: resource-catalog-api
    build:
      context: ..
      dockerfile: apps/resource-catalog-api/Dockerfile
    image: younilab-seo-resource-catalog-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    ports:
      - "127.0.0.1:18001:8001"
    networks:
      - web_network

  geo-analysis-api:
    container_name: geo-analysis-api
    build:
      context: ..
      dockerfile: apps/geo-analysis-api/Dockerfile
    image: younilab-seo-geo-analysis-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    depends_on:
      - rabbitmq
      - access-control-api
      - resource-catalog-api
    ports:
      - "127.0.0.1:18002:8002"
    networks:
      - web_network

  geo-analysis-worker-gemini:
    container_name: geo-analysis-worker-gemini
    build:
      context: ..
      dockerfile: apps/geo-analysis-worker/Dockerfile
    image: younilab-seo-geo-analysis-worker:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    depends_on:
      - rabbitmq
      - geo-tracking-api
    networks:
      - web_network

  geo-analysis-worker-google-aio:
    container_name: geo-analysis-worker-google-aio
    build:
      context: ..
      dockerfile: apps/geo-analysis-worker/Dockerfile
    image: younilab-seo-geo-analysis-worker:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    environment:
      GEO_ANALYSIS_WORKER_PROVIDER: google_aio
      GEO_ANALYSIS_WORKER_QUEUE: geo.query-runs.google_aio
      GEO_ANALYSIS_WORKER_PREFETCH: 1
    depends_on:
      - rabbitmq
      - geo-tracking-api
    networks:
      - web_network

  geo-tracking-api:
    container_name: geo-tracking-api
    build:
      context: ..
      dockerfile: apps/geo-tracking-api/Dockerfile
    image: younilab-seo-geo-tracking-api:${DEPLOY_IMAGE_TAG:-latest}
    restart: always
    env_file:
      - ${DEPLOY_ENV_FILE}
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/config/gcp-key.json
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
    volumes:
      - ${GCP_CREDENTIALS_FILE_HOST}:/app/config/gcp-key.json:ro
    ports:
      - "127.0.0.1:18003:8003"
    networks:
      - web_network

volumes:
  rabbitmq-data:

networks:
  web_network:
    external: true
