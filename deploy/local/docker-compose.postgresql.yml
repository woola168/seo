services:
  access-control-postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: access_control
      POSTGRES_PASSWORD: access_control
    ports:
      - "5432:5432"
    volumes:
      - access-control-postgresql-data:/var/lib/postgresql
      - ./postgresql/baseline/access_control.sql:/docker-entrypoint-initdb.d/001_access_control.sql:ro

  resource-catalog-postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: resource_catalog
      POSTGRES_USER: resource_catalog
      POSTGRES_PASSWORD: resource_catalog
    ports:
      - "5433:5432"
    volumes:
      - resource-catalog-postgresql-data:/var/lib/postgresql
      - ./postgresql/baseline/resource_catalog.sql:/docker-entrypoint-initdb.d/001_resource_catalog.sql:ro
      - ./postgresql/baseline/geo_analysis.sql:/docker-entrypoint-initdb.d/002_geo_analysis.sql:ro
      - ./postgresql/seed/provider_pricing_rates.sql:/docker-entrypoint-initdb.d/003_provider_pricing_rates.sql:ro

volumes:
  access-control-postgresql-data:
  resource-catalog-postgresql-data:
