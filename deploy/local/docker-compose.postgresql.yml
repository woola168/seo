services:
  access-control-postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: access_control
      POSTGRES_USER: access_control
      POSTGRES_PASSWORD: access_control
    ports:
      - "5432:5432"
    volumes:
      - access-control-postgresql-data:/var/lib/postgresql
      - ./postgresql/001_access_control_schema.sql:/docker-entrypoint-initdb.d/001_access_control_schema.sql:ro
      - ./postgresql/003_access_control_lifecycle.sql:/docker-entrypoint-initdb.d/003_access_control_lifecycle.sql:ro

  resource-catalog-postgresql:
    image: postgres:18
    environment:
      POSTGRES_DB: resource_catalog
      POSTGRES_USER: resource_catalog
      POSTGRES_PASSWORD: resource_catalog
    ports:
      - "5433:5432"
    volumes:
      - resource-catalog-postgresql-data:/var/lib/postgresql
      - ./postgresql/001_resource_catalog_schema.sql:/docker-entrypoint-initdb.d/001_resource_catalog_schema.sql:ro
      - ./postgresql/004_geo_analysis_schema.sql:/docker-entrypoint-initdb.d/004_geo_analysis_schema.sql:ro
      - ./postgresql/015_geo_analysis_daily_scheduler.sql:/docker-entrypoint-initdb.d/015_geo_analysis_daily_scheduler.sql:ro
      - ./postgresql/016_geo_analysis_remove_seo_task_contract.sql:/docker-entrypoint-initdb.d/016_geo_analysis_remove_seo_task_contract.sql:ro
      - ./postgresql/018_provider_request_audit.sql:/docker-entrypoint-initdb.d/018_provider_request_audit.sql:ro

volumes:
  access-control-postgresql-data:
  resource-catalog-postgresql-data:
